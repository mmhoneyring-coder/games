<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#30262b">
<title>ゲーム一覧</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#30262b;color:#fff3dc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
main{max-width:760px;margin:0 auto;padding:clamp(24px,6vw,50px) 18px 48px}
h1{font-size:clamp(24px,5vw,32px);line-height:1.3;margin:0 0 8px}
.intro{font-size:13px;color:#d7c2ac;margin:0 0 28px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px}
.game{display:block;background:#4b3a3c;border:1px solid #8a7064;border-radius:14px;padding:20px;text-decoration:none;color:inherit;transition:border-color .15s,background .15s}
.game:hover,.game:focus-visible{background:#584448;border-color:#e5bd72;outline:none}
.game-title{font-size:20px;font-weight:800;margin:0 0 9px}
.game-desc{font-size:13px;color:#d7c2ac;line-height:1.6;margin:0}
.game-open{display:block;font-size:12px;font-weight:700;color:#e5bd72;margin-top:15px}
.game-thumb{display:block;width:100%;height:auto;border-radius:9px;margin:0 0 14px;background:#211923}
</style>
</head>
<body>
<main>
<h1>ゲーム一覧</h1>
<p class="intro">ゲームを選ぶと、そのままブラウザで遊べます。</p>
<div class="games">
<a class="game" href="./kyokudai-magic/">
<h2 class="game-title">極大魔法</h2>
<p class="game-desc">共有マナを育てて、自分の極大魔法の完成を目指すカードゲーム。</p>
<span class="game-open">ゲームを開く →</span>
</a>
<a class="game" href="./monster-growth/">
<h2 class="game-title">モンスター育成</h2>
<p class="game-desc">カードを使うか温存するかを選び、能力を育てながら20階を踏破するデッキ育成ゲーム（デモ版）。</p>
<span class="game-open">ゲームを開く →</span>
</a>
<a class="game" href="./dice-build/">
<img class="game-thumb" src="./dice-build/thumbnail.png" alt="サイコロビルドのサムネイル" loading="lazy">
<h2 class="game-title">サイコロビルド</h2>
<p class="game-desc">36面のダイスを改造し、呪いと破滅を利用して30階の突破を目指すローグライク（開発版 v0.2）。</p>
<span class="game-open">ゲームを開く →</span>
</a>
</div>
</main>
</body>
</html>
