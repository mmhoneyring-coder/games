function enemyTurn(){let b=S.battle,e=S.enemy;if(!b||S.screen!=='battle'||b.hp<=0)return;
let isMagic=rand()<e.spell,attSpd=e.spd,defSpd=battleSpd(),damage=0;
if(evaded(attSpd,defSpd)){addLog(`${isMagic?'敵の魔法':'敵の攻撃'}を回避。`)}else{
let base=isMagic?Math.max(1,e.mag*e.power-S.stats.mag*(e.passive==='魔法貫通'?.8:1)):Math.max(1,e.atk-S.stats.def);
let multiplier=critMult(attSpd,defSpd);damage=Math.max(1,ceil(base*multiplier));let crit=multiplier>1;
if(!isMagic&&S.pass['受け流し']&&rand()<[0,.15,.25,.35][S.pass['受け流し']]){damage=ceil(damage*.5);addLog('受け流しで物理ダメージを半減。')}
if(b.buffs.wall>0)damage=ceil(damage*.8);if(b.buffs.iron>0){damage=ceil(damage*.4);b.buffs.iron=0;addLog('鉄壁が発動。')}
const actual=Math.min(S.hp,damage);S.hp=Math.max(0,S.hp-damage);
addLog(`敵の${isMagic?'魔法':'物理攻撃'}：${damage}ダメージ${crit?'（会心）':''}。`);
if(actual>0&&S.pass['痛覚変換']){let amount=Math.min(S.stats.mp-S.mp,ceil(actual*[0,.1,.2,.3][S.pass['痛覚変換']]));if(amount>0){S.mp+=amount;addLog(`痛覚変換でMP＋${amount}。`)}}
if(S.hp<=0&&S.pass['不屈']&&!b.firstStrike){let lv=S.pass['不屈'];S.hp=lv===1?1:Math.max(1,ceil(S.stats.hp*(lv===2?.05:.1)));b.firstStrike=true;addLog('不屈で致命傷に耐えた。')}
if(S.hp>0&&actual>0&&S.pass['反撃']&&rand()<[0,.2,.3,.4][S.pass['反撃']]){addLog('反撃が発動。');playerHit('physical',1,0,'反撃',true)}
}
if(S.hp<=0){gameOver('敵の攻撃で倒れました。');return}
if(b.poison.length&&b.hp>0){let dot=0;for(let tick of b.poison){if(tick.left>0){dot+=Math.max(1,ceil(b.hp*tick.rate));tick.left--}}b.poison=b.poison.filter(t=>t.left>0);b.hp=Math.max(0,b.hp-dot);if(dot)addLog(`毒で敵に${dot}ダメージ。`)}
if(b.hp<=0){winBattle();return}b.enemyActed=true;
}
function playerHit(type,power,penetration,label,counter=false){const b=S.battle,e=S.enemy;if(!b||b.hp<=0)return 0;const ap=battleSpd(),dp=e.spd;
if(evaded(ap,dp)){addLog(`${label}は回避された。`);return 0}
let base=type==='physical'?Math.max(1,S.stats.atk*power-e.def*(1-penetration)):Math.max(1,S.stats.mag*power-e.mag*(1-penetration));let mul=critMult(ap,dp);let dmg=Math.max(1,ceil(base*mul));
if(type==='physical'&&e.passive==='受け流し'&&rand()<.15){dmg=ceil(dmg*.5);addLog('敵が受け流しを発動。')}
const actual=Math.max(0,Math.min(b.hp,dmg));b.hp=Math.max(0,b.hp-dmg);addLog(`${label}：${actual}ダメージ${mul>1?'（会心）':''}。`);
if(b.hp<=0&&e.passive==='不屈'&&!b.enemySturdy){b.hp=1;b.enemySturdy=true;addLog('敵の不屈が発動し、HP1で耐えた。')}
if(type==='physical'&&!counter&&actual>0&&b.hp>0&&e.passive==='反撃'&&rand()<.2){let r=Math.max(1,ceil(Math.max(1,e.atk-S.stats.def)*critMult(e.spd,battleSpd())));S.hp=Math.max(0,S.hp-r);addLog(`敵の反撃：${r}ダメージ。`);if(S.hp<=0&&S.pass['不屈']&&!b.firstStrike){b.firstStrike=true;S.hp=1;addLog('不屈が発動。')}}
return actual}
// Previews are deterministic: they never call rand() or change battle state.
function speedRates(){
 const ap=battleSpd(),ep=S.enemy.spd;
 return {playerCrit:Math.max(0,ap-ep)*5,enemyCrit:Math.max(0,ep-ap)*5,
  playerDodge:Math.min(25,Math.max(0,ap-ep)),enemyDodge:Math.min(25,Math.max(0,ep-ap))};
}
function physicalParams(){
 let b=S.battle,bonus=1,pen=0,drain=0;
 if(b.buffs.encourage)bonus+=.2;
 if(b.buffs.rampage)bonus+=.7*b.buffs.rampage;
 for(const n of b.phys){if(n==='斬撃')bonus+=.3;else if(n==='強斬撃')bonus+=.6;
  else if(n==='必殺斬り')bonus+=1.1;else if(n==='捨て身撃')bonus+=.9;
  else if(n==='貫通撃')pen=Math.max(pen,.5);else if(n==='吸収撃')drain+=.2;}
 return {bonus,pen,drain};
}
function previewHit(type,power,pen=0){
 let enemy=S.enemy;
 const base=type==='physical'?Math.max(1,S.stats.atk*power-enemy.def*(1-pen)):
  Math.max(1,S.stats.mag*power-enemy.mag*(1-pen));
 return Math.max(1,ceil(base));
}
function forecastMagic(item){
 const b=S.battle;let charge=b.buffs.charge,link=b.link,used=b.firstMagic,details=[],total=0;
 const penetration=S.pass['魔法貫通']?[0,.2,.35,.5][S.pass['魔法貫通']]:0;
 for(const part of item.parts){const c=C[part];
  if(part==='魔力蓄積')charge++;
  else if(c.kind==='magic'){
   const combo=link&&S.pass['魔撃連携']?1+[0,.15,.25,.35][S.pass['魔撃連携']]:1;
   const each=previewHit('magic',c.v*(1+.5*charge)*combo,penetration);
   const count=part==='連鎖雷'?3:1;
   const cost=Math.max(0,(c.mp||0)-(!used?(Math.min(c.mp||0,S.pass['迅速詠唱'])):0));
   details.push(`${part} ${each}${count>1?'×'+count:''}（MP${cost}）`);
   total+=each*count;used=true;charge=0;link=false;
  }
 }
 return {details,total};
}
function previewPanel(){
 const b=S.battle;if(b.phase!=='main')return '';
 const r=speedRates(),p=physicalParams(),damage=previewHit('physical',p.bonus,p.pen);
 const hit=Math.min(b.hp,damage);
 const text=b.normal?'通常攻撃済み。魔法は追加で使用できます。':
  `攻撃補正＋${Math.round((p.bonus-1)*100)}%${p.pen?' / 防御'+Math.round(p.pen*100)+'%無視':''}`;
 const risks=[S.enemy.passive==='受け流し'?'敵の受け流し（15%）で半減する場合があります。':'',
 S.enemy.passive==='不屈'?'敵の不屈は一度だけ致命傷を耐えます。':'',
 p.drain?`命中時の吸収撃：実際の与ダメージの${Math.round(p.drain*100)}%をHP回復。`:''].filter(Boolean);
 return `<div class="forecastPanel" aria-label="ダメージと会心回避の目安"><h3>通常攻撃の予測</h3>
 <div class="forecastMetrics"><div class="forecastMetric"><strong>${b.normal?'—':hit}</strong><span>与ダメージ（会心・回避なし）</span></div>
 <div class="forecastMetric"><strong>${b.normal?'—':Math.max(0,b.hp-damage)}</strong><span>攻撃後の敵HP</span></div>
 <div class="forecastMetric"><strong>${r.playerCrit}%</strong><span>自分の会心率</span></div>
 <div class="forecastMetric"><strong>${r.enemyDodge}%</strong><span>敵の回避率</span></div></div>
 <div class="forecastLine">${text}${!b.normal&&damage>=b.hp?' <strong class="good">通常命中なら撃破圏内</strong>':''}</div>
 <div class="forecastLine">被攻撃時：敵の会心率 ${r.enemyCrit}% / 自分の回避率 ${r.playerDodge}%</div>
 ${risks.length?`<div class="forecastLine">${risks.map(esc).join(' ')}</div>`:''}
 <div class="tiny muted">予測は会心・回避・受け流しを含まない基準値です。会心は100%以上で段階的に発生します。敵の行動は未確定です。</div></div>`;
}
function cardBattleHint(item){
 if(!S.battle||S.battle.phase!=='main')return '';
 const d=def(item);if(!d.kinds.includes('magic'))return '';
 const f=forecastMagic(item),r=speedRates();
 return `<div class="forecastChip">魔法予測：${esc(f.details.join(' ＋ '))} / 合計${f.total}（会心・回避なし）</div>`;
}
function tip(key,content){return tipClosed[key]?
 `<div class="guideCollapsed"><button class="small guideBtn" data-action="tipToggle" data-name="${key}">操作のヒントを見る</button></div>`:
 `<div class="notice guideTip"><div><strong>操作のヒント</strong><p>${content}</p></div><button class="small guideBtn" data-action="tipToggle" data-name="${key}" aria-label="ヒントを閉じる">閉じる</button></div>`}
function fusePreview(){
 const selected=S.selectedFuse.map(id=>S.deck.find(c=>c.id===id)).filter(Boolean);
 if(!selected.length)return '<div class="tiny muted">カードを選択すると、合成後の効果・成長Pを表示します。</div>';
 const makePart=(item)=>{const d=def(item);return `<div class="previewUnit"><strong>${esc(cardName(item))}</strong><div>${esc(desc(item))}</div><div class="gain">${pstr(d.p)}</div>${d.mp?`<div class="tiny muted">消費MP ${d.mp}</div>`:''}</div>`};
 const all={id:-1,parts:selected.flatMap(i=>i.parts)},d=def(all);
 return `<div class="previewBox"><h3>合成前後のプレビュー</h3><div class="previewPair">${makePart(selected[0])}<div class="previewArrow">＋</div>${selected[1]?makePart(selected[1]):'<div class="previewUnit muted">もう1枚選択</div>'}</div>
 ${selected.length===2?`<div class="previewResult"><strong>合成後：${esc(cardName(all))}</strong><div class="tiny">${esc(desc(all))}</div><div>成長P：${pstr(d.p)}</div>${d.mp?`<div>合計消費MP：${d.mp}</div>`:''}<div class="tiny muted">効果は選択した順に発動します。デッキ枚数 −1 / 再合成不可。</div></div>`:''}</div>`;
}
function draw(n){const b=S.battle;for(let i=0;i<n;i++){if(!b.pile.length){if(!b.discard.length)break;b.pile=shuffle(b.discard.splice(0))}b.hand.push(b.pile.pop())}}
function hasManip(i){return i.parts.some(x=>x==='集中'||x==='手札交換')}
function startTurn(){const b=S.battle;if(!b||S.screen!=='battle')return;if(b.turn>=35){gameOver('暫定ルール：35ターン以内に倒せませんでした。');return}b.turn++;b.normal=false;b.enemyActed=false;b.phys=[];b.link=false;b.penalty=b.nextPenalty;b.nextPenalty=0;b.exchange=null;b.exchangeSelected=[];draw(Math.max(0,3-b.penalty));
const my=S.stats.spd+(b.buffs.speed?3:0),their=S.enemy.spd;let myFirst=my===their?rand()<.5:my>their;let playerProc=false,enemyProc=false;
playerProc=!!S.pass['先制']&&rand()<[0,.1,.2,.3][S.pass['先制']];enemyProc=S.enemy.passive==='先制'&&rand()<.1;
if(playerProc&&enemyProc)myFirst=rand()<.5;else if(playerProc)myFirst=true;else if(enemyProc)myFirst=false;b.playerFirst=myFirst;addLog(`── 第${b.turn}ターン。${myFirst?'プレイヤー':'敵'}が先攻${playerProc?'（先制発動）':''}。`);
if(!myFirst){enemyTurn();if(S.screen!=='battle')return}
b.phase=b.hand.some(hasManip)?'manip':'main';save();render();}
function canUse(item){const b=S.battle;if(!b||b.exchange)return false;const parts=item.parts;if(b.phase==='manip'&&!hasManip(item))return false;if(b.phase==='main'&&hasManip(item))return false;if(b.normal&&parts.some(x=>C[x].kind==='physical'))return false;let virtualMp=S.mp,virtualHp=S.hp,magicUsed=b.firstMagic;for(const x of parts){const c=C[x];if(c.kind==='magic'){const cost=Math.max(0,c.mp-(magicUsed?0:Math.min(c.mp,S.pass['迅速詠唱'])));if(virtualMp<cost)return false;virtualMp-=cost;magicUsed=true;if(x==='吸魔')virtualMp=Math.min(S.stats.mp,virtualMp+ceil(S.stats.mp*.1))}else if(x==='瞑想'){virtualMp=Math.min(S.stats.mp,virtualMp+ceil(S.stats.mp*.15))}else if(x==='魔力転換'){const loss=ceil(S.stats.hp*.1);if(virtualHp<=loss)return false;virtualHp-=loss;virtualMp=Math.min(S.stats.mp,virtualMp+ceil(S.stats.mp*.25))}else if(x==='捨て身撃'){const loss=ceil(S.stats.hp*.05);if(virtualHp<=loss)return false;virtualHp-=loss}}return true}
function playCard(uid){const b=S.battle;if(!b||S.screen!=='battle')return;const item=b.hand.find(i=>i.id===uid);if(!item||!canUse(item))return;if(has(item,'手札交換')){b.exchange=uid;b.exchangeSelected=[];save();render();return}resolveCard(item,[])}
function resolveCard(item,exchanges){const b=S.battle;if(!b||S.screen!=='battle')return;let idx=b.hand.findIndex(x=>x.id===item.id);if(idx<0)return;b.hand.splice(idx,1);b.used++;S.total.used++;let killed=false;
// Compound cards play all their component effects in listed order. MP is paid by each magic component.
for(let name of item.parts){const c=C[name];if(c.kind==='physical'){b.phys.push(name);if(name==='捨て身撃'){let amt=ceil(S.stats.hp*.05);S.hp-=amt;addLog(`捨て身撃でHP−${amt}。`)}if(name==='必殺斬り')b.nextPenalty=Math.min(2,b.nextPenalty+1)}
else if(c.kind==='magic'){let discount=!b.firstMagic?Math.min(c.mp,S.pass['迅速詠唱']):0;const cost=c.mp-discount;S.mp-=cost;b.firstMagic=true;let charge=1+.5*b.buffs.charge;let link=b.link&&S.pass['魔撃連携']?1+[0,.15,.25,.35][S.pass['魔撃連携']]:1;let pen=S.pass['魔法貫通']?[0,.2,.35,.5][S.pass['魔法貫通']]:0;addLog(`${name}を使用（MP−${cost}${discount?'・迅速詠唱':''}）。`);for(let h=0;h<(name==='連鎖雷'?3:1);h++){playerHit('magic',c.v*charge*link,pen,name);if(b.hp<=0)break}if(name==='吸魔'){let r=Math.min(S.stats.mp-S.mp,ceil(S.stats.mp*.1));S.mp+=r;addLog(`吸魔でMP＋${r}。`)}b.buffs.charge=0;b.link=false}
else if(name==='集中'){draw(2);addLog('集中：カードを2枚引いた。')}
else if(name==='手札交換'){let take=exchanges||[];for(let id of take){let k=b.hand.findIndex(i=>i.id===id);if(k>=0)b.discard.push(b.hand.splice(k,1)[0])}draw(take.length);addLog(`手札を${take.length}枚交換した。`)}
else if(name==='鼓舞'){b.buffs.encourage=Math.max(3,b.buffs.encourage);addLog('鼓舞：通常攻撃強化3ターン。')}
else if(name==='猛攻'){b.buffs.rampage++;addLog('猛攻：次の通常攻撃を強化。')}
else if(name==='防壁'){b.buffs.wall=Math.max(3,b.buffs.wall);addLog('防壁：3ターン被ダメージ軽減。')}
else if(name==='鉄壁'){b.buffs.iron++;addLog('鉄壁：次の被ダメージを軽減。')}
else if(name==='加速'){b.buffs.speed=Math.max(3,b.buffs.speed);addLog('加速：素早さ＋3。')}
else if(name==='魔力蓄積'){b.buffs.charge++;addLog('魔力蓄積：次の魔法を強化。')}
else if(name==='毒'){b.poison.push({rate:.05,left:5});addLog('毒を付与（5回）。')}
else if(name==='応急処置'||name==='治癒'){let amt=Math.min(S.stats.hp-S.hp,ceil(S.stats.hp*c.v));S.hp+=amt;addLog(`${name}でHP＋${amt}。`)}
else if(name==='瞑想'){let amt=Math.min(S.stats.mp-S.mp,ceil(S.stats.mp*.15));S.mp+=amt;addLog(`瞑想でMP＋${amt}。`)}
else if(name==='魔力転換'){let amt=ceil(S.stats.hp*.1),restore=Math.min(S.stats.mp-S.mp,ceil(S.stats.mp*.25));S.hp-=amt;S.mp+=restore;addLog(`魔力転換：HP−${amt}・MP＋${restore}。`)}
else if(name==='小銭袋'||name==='宝の地図'){S.gold+=c.v;addLog(`${name}で${c.v}G獲得。デッキから削除。`)}
}
if(b.hp<=0)killed=true;
if(!item.parts.some(x=>x==='小銭袋'||x==='宝の地図'))b.discard.push(item);else{S.deck=S.deck.filter(c=>c.id!==item.id)}
b.exchange=null;b.exchangeSelected=[];
if(S.hp<=0){gameOver('カード使用でHPが尽きました。');return}
if(killed||b.hp<=0){winBattle();return}if(b.phase==='manip'&&!b.hand.some(hasManip))b.phase='main';save();render()}
function confirmExchange(){const b=S.battle;if(!b||!b.exchange)return;let item=b.hand.find(i=>i.id===b.exchange);if(!item)return;if(!b.exchangeSelected.length){b.exchange=null;b.exchangeSelected=[];render();return}const n=Math.min(2,b.exchangeSelected.length);resolveCard(item,b.exchangeSelected.slice(0,n))}
function attack(){const b=S.battle;if(!b||S.screen!=='battle'||b.phase!=='main'||b.normal)return;b.normal=true;const {bonus,pen,drain}=physicalParams();
const actual=playerHit('physical',bonus,pen,'通常攻撃');if(b.phys.length)b.link=true;if(drain){let amt=Math.min(S.stats.hp-S.hp,ceil(actual*drain));S.hp+=amt;if(amt)addLog(`吸収撃でHP＋${amt}。`)}b.buffs.rampage=0;
if(S.hp<=0){gameOver('敵の反撃で倒れました。');return}if(b.hp<=0){winBattle();return}save();render()}
function convertHand(){let b=S.battle;if(!b)return;for(let item of b.hand){let pp=def(item).p;for(let i=0;i<3;i++)S.p[i]+=pp[i];b.exiled.push(item);b.converted++;S.total.converted++}if(b.hand.length)addLog(`手札${b.hand.length}枚を成長Pに変換した。`);b.hand=[]}
function endTurn(){const b=S.battle;if(!b||S.screen!=='battle'||b.phase==='manip'||b.exchange)return;convertHand();if(!b.enemyActed){enemyTurn();if(S.screen!=='battle')return}if(S.hp<=0){gameOver('倒されました。');return}if(b.hp<=0){winBattle();return}for(let n of ['encourage','wall','speed']){if(b.buffs[n]>0)b.buffs[n]--}startTurn()}
function winBattle(){if(S.screen!=='battle')return;const b=S.battle;convertHand();S.total.wins++;addLog(`${S.enemy.name}に勝利した。`);S.gold+=S.enemy.boss?8:(S.enemy.strong?6:4);const p=S.enemy.passive;if(p)S.discounts[p]=Math.min(50,S.discounts[p]+(S.enemy.strong?20:10));S.bonusStrong=!!S.enemy.strong;S.screen=S.floor>=20?'clear':'reward';if(S.screen==='reward'){S.rewardIndex=0;makeRewardOffers()}save();render()}
function gameOver(reason){S.screen='gameover';S.loseReason=reason;save();render()}
function makeRewardOffers(){const all=Object.keys(C);const candidates=shuffle(all.slice());const better=S.bonusStrong; if(better){const best=candidates.filter(x=>C[x].p.reduce((a,b)=>a+b,0)>=7);S.rewardOptions=best.slice(0,2).concat(candidates.find(x=>!best.slice(0,2).includes(x)));}else S.rewardOptions=candidates.slice(0,3)}
function selectReward(name){if(S.screen!=='reward')return;if(name){S.deck.push(newItem(name))}S.rewardIndex++;if(S.rewardIndex>=2)S.screen='growth';else makeRewardOffers();save();render()}
function upgrade(name){if(!['growth','choose','facility'].includes(S.screen))return;let cost=getCost(name),cfg=STATS[name];if(S.p[cfg.p]<cost)return;S.p[cfg.p]-=cost;S.stats[name]+=cfg.n;S.lvl[name]++;if(name==='hp')S.hp+=cfg.n;if(name==='mp')S.mp+=cfg.n;save();render()}
function buyPass(name){if(!['growth','choose','facility'].includes(S.screen))return;const cost=passCost(name);if(!cost||!canPay(cost))return;for(let i=0;i<3;i++)S.p[i]-=cost[i];S.pass[name]++;save();render()}
function leaveGrowth(){if(S.screen!=='growth')return;if([3,9,13,19].includes(S.floor)){S.screen='facility';S.facilityMode=null;S.selectedFuse=[];S.shopLocked=false;makeShopOffers()}else advanceFloor();save();render()}
function advanceFloor(){S.floor++;S.battle=null;S.enemy=null;S.screen='choose';S.facilityMode=null;S.selectedFuse=[];makeEnemyOffers();save();render()}
function rest(){if(S.screen!=='facility'||S.shopLocked)return;let h=Math.min(S.stats.hp-S.hp,ceil(S.stats.hp*.2)),m=Math.min(S.stats.mp-S.mp,ceil(S.stats.mp*.2));S.hp+=h;S.mp+=m;advanceFloor()}
function useShop(mode,name){
 if(S.screen!=='facility'||S.facilityMode!=='shop')return;
 let changed=false;
 if(mode==='buy'&&S.shopOptions.includes(name)&&SHOP_POOL.includes(name)){
   const cost=shopPrice(name);
   if(S.gold>=cost){S.gold-=cost;S.deck.push(newItem(name));changed=true}
 }else if(mode==='remove'&&S.gold>=7&&S.deck.length>1){
   const item=S.deck.find(x=>x.id===Number(name));
   if(item){S.gold-=7;S.deck=S.deck.filter(x=>x.id!==item.id);changed=true}
 }else if(mode==='heal'&&S.gold>=6&&S.hp<S.stats.hp){
   S.gold-=6;S.hp=Math.min(S.stats.hp,S.hp+ceil(S.stats.hp*.25));changed=true
 }else if(mode==='mpHeal'&&S.gold>=5&&S.mp<S.stats.mp){
   S.gold-=5;S.mp=Math.min(S.stats.mp,S.mp+ceil(S.stats.mp*.30));changed=true
 }
 if(changed){S.shopLocked=true;save();render()}
}
function fuse(){if(S.screen!=='facility'||S.facilityMode!=='fuse'||S.selectedFuse.length!==2)return;let ids=S.selectedFuse,items=ids.map(id=>S.deck.find(c=>c.id===id));if(items.some(x=>!x||x.parts.length!==1))return;S.deck=S.deck.filter(x=>!ids.includes(x.id));S.deck.push({id:S.uid++,parts:[...items[0].parts,...items[1].parts]});advanceFloor()}
function chooseFuse(id){if(S.screen!=='facility'||S.facilityMode!=='fuse')return;let card=S.deck.find(x=>x.id===id);if(!card||card.parts.length>1)return;S.selectedFuse=S.selectedFuse.includes(id)?S.selectedFuse.filter(x=>x!==id):(S.selectedFuse.length<2?[...S.selectedFuse,id]:S.selectedFuse);render()}
function costText(a){return a.map((v,i)=>v?`<span class="${S.p[i]>=v?'':'bad'}">${['心','技','体'][i]}${v}</span>`:'').filter(Boolean).join(' / ')}
function hud(){let s=S.stats,h=limit(S.hp/s.hp*100,0,100),m=limit(S.mp/s.mp*100,0,100);return `<div class="overview"><div class="pill">第 <b>${Math.min(S.floor,20)}</b> / 20 戦</div><div class="pill">所持金 <b>${S.gold}G</b></div><div class="pill">デッキ <b>${S.deck.length}枚</b></div><div class="pill">勝利 <b>${S.total.wins}</b></div></div><div class="panel"><div class="flex between"><h2>育成中のモンスター</h2><span class="tag green">心${S.p[0]} / 技${S.p[1]} / 体${S.p[2]} P</span></div><div class="hero"><div>HP　<strong>${S.hp}/${s.hp}</strong><div class="meter"><div class="fill hp" style="width:${h}%"></div></div></div><div>MP　<strong>${S.mp}/${s.mp}</strong><div class="meter"><div class="fill mp" style="width:${m}%"></div></div></div></div><div class="stats">${[['atk','攻撃力'],['def','防御力'],['spd','素早さ'],['mag','魔力'],['hp','最大HP'],['mp','最大MP']].map(([k,n])=>`<div class="stat"><strong>${s[k]}</strong><span>${n}</span></div>`).join('')}</div></div>`}
function enemyHud(){let e=S.enemy,b=S.battle;return `<div class="panel"><div class="flex between"><div><div class="label">第${S.floor}戦の相手</div><h2>${esc(e.name)} <span class="tag ${e.boss?'red':e.strong?'orange':'blue'}">${e.boss?'ボス':e.strong?'強敵':e.kind}</span></h2></div><div class="tag purple">${esc(e.passive)} Lv1</div></div><div>HP <b>${Math.max(0,b.hp)} / ${b.maxhp}</b><div class="meter"><div class="fill hp" style="width:${limit(b.hp/b.maxhp*100,0,100)}%"></div></div></div><div class="flex tiny muted">攻撃 ${e.atk}　防御 ${e.def}　素早さ ${e.spd}　魔力 ${e.mag}　${e.spell===1?'魔法型':e.spell===0?'物理型':'物理・魔法'}</div><div class="flex tiny">${b.poison.length?`<span class="tag purple">毒 ${b.poison.length}層</span>`:''}${b.buffs.encourage?`<span class="tag green">鼓舞 ${b.buffs.encourage}</span>`:''}${b.buffs.wall?`<span class="tag green">防壁 ${b.buffs.wall}</span>`:''}${b.buffs.speed?`<span class="tag green">加速 ${b.buffs.speed}</span>`:''}${b.buffs.iron?'<span class="tag green">鉄壁</span>':''}${b.buffs.rampage?'<span class="tag orange">猛攻</span>':''}${b.buffs.charge?'<span class="tag blue">魔力蓄積</span>':''}</div></div>`}
function cardHTML(item,action,selected=false,disabled=false){let t=def(item),f=t.isFused;return `<button class="card ${kind(item)} ${selected?'selected':''} ${disabled?'disabled':''}" ${disabled?'disabled':''} data-action="${action}" data-id="${item.id}"><strong>${esc(cardName(item))}</strong><span class="tag ${f?'purple':kind(item)==='magic'?'blue':kind(item)==='physical'?'orange':'green'}">${f?'合成':kind(item)==='magic'?'魔法':kind(item)==='physical'?'物理':'補助'}${t.mp?` / MP${t.mp}`:''}</span><span class="effect">${esc(desc(item))}</span>${action==='use'?cardBattleHint(item):''}<div class="points">${action==='shopBuy'?`価格：<b>${shopPrice(item.parts[0])}G</b><br>`:''}P化：${pstr(t.p)}</div></button>`}
function chooseView(){let bosses=S.floor===10||S.floor===20;return `<div class="grid2"><div class="stack"><div class="panel"><h1 class="title">${bosses?'ボス戦':'戦う敵を選択'}</h1><p class="lead">${bosses?'この敵を倒すと次の区間へ進みます。':'異なる3種類から1体を選びます。強敵は勝利後の報酬が有利です。'}</p>${tip('choose','敵のHP・物理防御・魔力・素早さを比較してください。魔力は魔法攻撃と魔法防御の両方に使われます。強敵は報酬が有利です。')}<div class="enemyChoices ${bosses?'boss':''}">${S.offers.map((e,i)=>`<button class="enemyCard" data-action="enemy" data-id="${i}"><strong>${esc(e.name)}</strong><span class="tag ${e.strong?'orange':'blue'}">${e.boss?'ボス':e.strong?'強敵':'通常'}</span><div class="big">HP ${e.hp}</div><div class="tiny">攻撃 ${e.atk}　防御 ${e.def}<br>素早さ ${e.spd}　魔力 ${e.mag}</div><div class="tiny">${e.spell===0?'物理攻撃主体':e.spell===1?'魔法攻撃主体':'物理・魔法混合'}</div><div class="tiny muted">所持：${esc(e.passive)}（撃破で習得割引）</div><span class="tiny good">この敵と戦う →</span></button>`).join('')}</div></div></div><div class="stack">${hud()}${passiveOwned()}</div></div>`}
function battleView(){let b=S.battle;let manip=b.phase==='manip';let exchange=!!b.exchange;let selected=b.exchangeSelected;
return `<div class="grid2"><div class="stack">${enemyHud()}<div class="panel"><div class="flex between"><h2>第${b.turn}ターン <span class="tag">${manip?'手札操作':b.normal?'通常攻撃済み':'行動選択'}</span></h2><span class="tiny muted">山札${b.pile.length} / 捨て札${b.discard.length} / P化除外${b.exiled.length}</span></div>${b.penalty?`<div class="notice warn">必殺斬りの反動：このターンのドロー−${b.penalty}枚</div>`:''}${exchange?`<div class="notice">交換したいカードを最大2枚選んで「交換を実行」してください。0枚なら中止できます。</div>`:b.normal?'<div class="tiny muted spaced">通常攻撃済み。魔法・補助カードの使用後にターンを終了できます。</div>':''}
${tip(manip?'manip':'battle',manip?'集中・手札交換を先に使うか決めます。ほかのカードは操作を終えてから使用できます。':'物理カードを押すと通常攻撃に重なり、下の予測ダメージが更新されます。魔法はMPを消費して別に攻撃できます。使わなかった手札はP化されます。')}${previewPanel()}<div class="cards">${b.hand.length?b.hand.map(i=>cardHTML(i,exchange?'exchangePick':'use',selected.includes(i.id),exchange?i.id===b.exchange:!canUse(i))).join(''):'<div class="empty">手札がありません</div>'}</div>
<div class="actions">${exchange?`<button class="primary" data-action="exchangeConfirm">${selected.length?'交換を実行':'交換を中止'}（${selected.length}/2）</button><button data-action="exchangeCancel">中止</button>`:manip?`<button class="primary" data-action="manipDone">手札操作を終える</button>`:`<button class="primary" data-action="attack" ${b.normal?'disabled':''}>${b.normal?'通常攻撃済み':'通常攻撃を行う'} ${b.phys.length?'（'+b.phys.length+'枚を付与）':''}</button><button data-action="endTurn">ターン終了・未使用手札をP化</button>`}</div>
${b.phys.length?`<div class="tiny muted">通常攻撃に付与：${b.phys.map(esc).join('、')}</div>`:''}</div></div><div class="stack">${hud()}<div class="panel"><button class="small battleLogBtn" data-action="logToggle" aria-expanded="${logVisible}"><b>戦闘ログ（${b.log.length}件）</b><span>${logVisible?'閉じる ▲':'表示する ▼'}</span></button>${logVisible?`<div class="log" style="margin-top:8px">${b.log.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`:''}</div>${passiveOwned()}</div></div>`}
function passiveOwned(){let list=Object.entries(S.pass).filter(([k,v])=>v>0);return `<div class="panel"><h3>習得済みパッシブ</h3>${list.length?list.map(([k,lv])=>`<div class="flex between tiny"><b>${esc(k)} Lv${lv}</b><span class="muted">${esc(PASS[k].tip[lv-1])}</span></div>`).join(''):'<div class="tiny muted">未習得。勝利後の育成で習得できます。</div>'}</div>`}
function rewardView(){return `<div class="grid2"><div class="stack"><div class="panel"><h1 class="title">第${S.floor}戦 勝利</h1><p class="lead">報酬カード：${S.rewardIndex+1} / 2 回目。毎回3択から1枚選ぶか、スキップできます。</p>${tip('reward','カードを増やすほど手札の候補は広がりますが、必要なカードを引ける確率は下がります。使用時の効果と、使わずP化した場合のポイントを比べてください。')}${S.bonusStrong?'<div class="notice">強敵・ボス撃破：獲得ゴールドと報酬候補が有利になります。</div>':''}<div class="cards">${S.rewardOptions.map(n=>{let example={id:Object.keys(C).indexOf(n)+100000,parts:[n]};return cardHTML(example,'reward',false,false)}).join('')}</div><div class="actions"><button data-action="rewardSkip">スキップ（カード追加なし）</button></div></div></div><div class="stack">${hud()}${passiveOwned()}</div></div>`}
function growthTables(){return `<div class="panel"><h2>能力値の成長</h2><div class="tiny muted">強化後の値を緑色で示します。同じ能力を育てるほど必要Pが1増えます。HP・MPの強化時は現在値も増加します。</div><table class="pointsTable"><thead><tr><th>能力</th><th class="num">現在 → 強化後</th><th>成長幅</th><th>費用 / 残りP</th><th></th></tr></thead><tbody>${Object.entries(STATS).map(([k,t])=>`<tr><td>${t.label}</td><td class="num"><span class="statCurrent">${S.stats[k]}</span> → <span class="statFuture">${S.stats[k]+t.n}</span></td><td>+${t.n}</td><td class="cost">${['心','技','体'][t.p]}${getCost(k)} <span class="tiny muted">(${S.p[t.p]} → ${S.p[t.p]-getCost(k)})</span></td><td><button class="small" data-action="upgrade" data-name="${k}" ${S.p[t.p]<getCost(k)?'disabled':''}>強化</button></td></tr>`).join('')}</tbody></table></div>`}
function passTables(){return `<div class="panel"><div class="flex between"><h2>パッシブ習得・強化</h2><span class="tiny muted">Lv3まで。装備制限なし</span></div><div class="passives">${Object.entries(PASS).map(([name,c])=>{let lv=S.pass[name],cost=passCost(name),disc=S.discounts[name];return `<div class="passive"><div><b>${esc(name)} Lv${lv}${lv>=3?'（最大）':''}</b><div class="detail">${esc(c.tip[Math.min(lv,2)])}</div><div class="tiny cost">${lv<3?`次のLv費用：${costText(cost)}`:'習得済み'} ${disc?`<span class="good">（撃破割引−${disc}%）</span>`:''}</div></div><button class="small" data-action="pass" data-name="${name}" ${!cost||!canPay(cost)?'disabled':''}>${lv?'強化':'習得'}</button></div>`}).join('')}</div></div>`}
function growthView(){return `<div class="grid2"><div class="stack"><div class="panel"><h1 class="title">戦闘後の育成</h1><p class="lead">獲得した心・技・体Pで能力値やパッシブを強化できます。Pは持ち越し可能です。</p>${tip('growth','能力を強化する前に「現在→強化後」の値と残りPを確認できます。Pは保存でき、パッシブ習得にも使用します。')}<div class="actions"><button class="primary" data-action="growthDone">${[3,9,13,19].includes(S.floor)?'育成を終えて施設へ':'育成を終えて次の戦闘へ'} →</button></div></div>${growthTables()}${passTables()}</div><div class="stack">${hud()}${passiveOwned()}</div></div>`}
function facilityView(){let m=S.facilityMode;return `<div class="grid2"><div class="stack"><div class="panel"><h1 class="title">施設（第${S.floor}戦後）</h1><p class="lead">この施設では、休息・ショップ・合成から1つだけ選択します。</p>${tip('facility','施設は1回だけ利用できます。休息はHPとMPを回復、ショップは所持金の範囲で何度でも購入・削除・回復ができます、合成は2枚の効果とPを1枚にまとめます。')}<div class="flex spaced"><button class="${m===null?'primary':''}" data-action="facilityRest" ${S.shopLocked?'disabled':''}>休息：HP/MPを20%回復</button><button data-action="facilityShop">ショップ</button><button data-action="facilityFuse" ${S.shopLocked?'disabled':''}>2枚を合成</button></div>${m==='shop'?`<div class="separator"></div><h3>ショップ（所持金の範囲で何度でも取引）</h3><div class="tiny muted">カードは成長Pに応じて8〜19G、カード削除7G、HP回復6G、MP回復5G。所持金：${S.gold}G。<br>品ぞろえ：毎回4〜6種類（資金獲得カードは除く）。</div><h3 class="sectionTitle">カード購入</h3><div class="cards">${S.shopOptions.map(n=>cardHTML({id:Object.keys(C).indexOf(n)+100000,parts:[n]},'shopBuy',false,S.gold<shopPrice(n))).join('')}</div><div class="actions"><button data-action="shopHeal" ${S.gold<6||S.hp===S.stats.hp?'disabled':''}>6GでHP25%回復</button><button data-action="shopMpHeal" ${S.gold<5||S.mp===S.stats.mp?'disabled':''}>5GでMP30%回復</button></div><h3>カード削除（7G）</h3><div class="deckList">${S.deck.map(i=>`<div class="deckEntry"><span>${esc(cardName(i))}</span><button class="small" data-action="shopRemove" data-id="${i.id}" ${S.gold<7||S.deck.length<=1?'disabled':''}>削除</button></div>`).join('')}</div>`:''}${m==='fuse'?`<div class="separator"></div><h3>合成する2枚を選ぶ</h3><p class="tiny muted">元カードの効果・成長Pを合算して1枚にします。合成後のカードは再合成できません。異なる種類の合成も可能です。</p><div class="deckList">${S.deck.map(i=>`<button class="deckEntry ${S.selectedFuse.includes(i.id)?'selected':''}" data-action="fusePick" data-id="${i.id}" ${i.parts.length>1?'disabled':''}><span>${esc(cardName(i))}</span><span class="tiny">${S.selectedFuse.includes(i.id)?'選択中':i.parts.length>1?'合成済み':'選ぶ'}</span></button>`).join('')}</div>${fusePreview()}<div class="actions"><button class="primary" data-action="fuseConfirm" ${S.selectedFuse.length!==2?'disabled':''}>この2枚を合成する</button></div>`:''}${m===null?'<div class="notice">休息を選ぶと直ちに回復して次の戦闘に進みます。ショップ・合成は詳細を開いてから決定します。</div>':''}</div><div class="panel"><button data-action="facilitySkip">${m==='shop'?'ショップを出て次の戦闘へ':'何もせず次へ'}</button></div>${growthTables()}</div><div class="stack">${hud()}${passiveOwned()}</div></div>`}
function finalView(clear){return `<div class="grid2"><div class="stack"><div class="panel center"><h1 class="title">${clear?'全20戦クリア':'ゲームオーバー'}</h1><div class="bigNumber ${clear?'good':'bad'}">${clear?'CLEAR':'LOSE'}</div><p>${clear?'最終ボスを倒しました。今回の育成方針を振り返れます。':esc(S.loseReason||'敗北しました。')}</p><div class="actions" style="justify-content:center"><button class="primary" data-action="restart">新しい周回を開始</button></div></div><div class="panel"><h3>周回記録</h3><div>勝利：${S.total.wins} / 20 戦</div><div>使用したカード：${S.total.used}枚</div><div>P化したカード：${S.total.converted}枚</div><div>最終デッキ：${S.deck.length}枚</div></div></div><div class="stack">${hud()}${passiveOwned()}</div></div>`}
function render(){let content={choose:chooseView,battle:battleView,reward:rewardView,growth:growthView,facility:facilityView,clear:()=>finalView(true),gameover:()=>finalView(false)}[S.screen];$('#root').innerHTML=content?content():'<p>画面を表示できません</p>';if(modal)renderModal()}
function renderModal(){let html='';if(modal==='help'){html=`<h2>遊び方</h2><p>第1〜20戦を進み、20戦目のボスを倒すとクリアです。HP・MPは次の戦闘に持ち越します。</p><ol><li>各通常戦では、異なる3種類の敵から1体を選択します。</li><li>毎ターン3枚引きます。集中・手札交換がある場合は、ほかのカードを使う前に手札操作を決めます。</li><li>通常攻撃は毎ターン1回無料。物理カードを何枚でも付与できます。魔法はMPを消費して別に攻撃します。</li><li>ターン終了時、使わなかった手札は心・技・体の成長Pに変わり、その戦闘中は戻りません。使ったカードは捨て札になり、山札が尽きると再利用されます。</li><li>戦闘に勝つと報酬を3択×2回。毎回スキップできます。成長Pで能力・パッシブを強化します。</li><li>第3・9・13・19戦の後には施設があります。休息・ショップ・合成から1回選びます。</li></ol><p>素早さ差1につき、速い側の会心率＋5%、回避率＋1%（最大25%）。魔力は魔法攻撃と魔法防御を兼ねます。</p><div class="notice warn">試作用の仮設定：初期値、敵の強さ・行動、施設の配置・価格、パッシブ費用、会心倍率、端数処理、最大35ターンの制限。敵のパッシブも簡易的なものだけ発動します。</div><p class="tiny muted">セーブは現在のブラウザ内に保存します。違うブラウザや端末への移行には対応しません。</p>`}
else if(modal==='deck'){const count={};for(let i of S.deck){const name=cardName(i);count[name]??={i,n:0};count[name].n++}html=`<h2>デッキ一覧（${S.deck.length}枚）</h2><p class="tiny muted">カードを使えば効果、使わなければ成長Pになります。合成カードは元の2枚分をまとめて発動します。</p><div class="deckList">${Object.values(count).map(({i,n})=>`<div class="deckEntry"><span>${esc(cardName(i))} <b>×${n}</b></span><span class="tiny">${def(i).p.map((v,k)=>v?['心','技','体'][k]+v:'').filter(Boolean).join(' ')}</span></div>`).join('')}</div>`}
$('#modalRoot').innerHTML=`<div class="modalBackdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true">${html}<div class="actions"><button class="primary" data-action="modalClose">閉じる</button></div></div></div>`}
function act(e){const el=e.target.closest('[data-action]');if(!el)return;const op=el.dataset.action,id=Number(el.dataset.id),name=el.dataset.name;
if(op==='tipToggle'){tipClosed[name]=!tipClosed[name];render();return;}
if(op==='logToggle'){logVisible=!logVisible;render();return;}
if(op==='enemy')beginEnemy(id);else if(op==='use')playCard(id);else if(op==='exchangePick'){let b=S.battle;if(!b||b.exchange===id)return;let arr=b.exchangeSelected;if(arr.includes(id))b.exchangeSelected=arr.filter(i=>i!==id);else if(arr.length<2)b.exchangeSelected.push(id);render()}
else if(op==='exchangeConfirm')confirmExchange();else if(op==='exchangeCancel'){S.battle.exchange=null;S.battle.exchangeSelected=[];render()}
else if(op==='manipDone'){S.battle.phase='main';save();render()}
else if(op==='attack')attack();else if(op==='endTurn')endTurn();else if(op==='reward')selectReward(Object.keys(C)[id-100000]);else if(op==='rewardSkip')selectReward(null);
else if(op==='upgrade')upgrade(name);else if(op==='pass')buyPass(name);else if(op==='growthDone')leaveGrowth();else if(op==='facilityRest')rest();else if(op==='facilityShop'){S.facilityMode='shop';save();render()}else if(op==='facilityFuse'){if(!S.shopLocked){S.facilityMode='fuse';save();render()}}else if(op==='fusePick')chooseFuse(id);else if(op==='fuseConfirm')fuse();else if(op==='shopBuy')useShop('buy',Object.keys(C)[id-100000]);else if(op==='shopRemove')useShop('remove',id);else if(op==='shopHeal')useShop('heal');else if(op==='shopMpHeal')useShop('mpHeal');else if(op==='facilitySkip')advanceFloor();else if(op==='restart')confirmStart();else if(op==='modalClose'){modal=null;$('#modalRoot').innerHTML=''} }
function confirmStart(){if(confirm('現在の進行を消して、最初から始めますか？')){modal=null;$('#modalRoot').innerHTML='';startGame(Date.now())}}
document.addEventListener('click',act);$('#helpButton').addEventListener('click',()=>{modal='help';renderModal()});$('#deckButton').addEventListener('click',()=>{modal='deck';renderModal()});$('#newButton').addEventListener('click',confirmStart);$('#modalRoot').addEventListener('click',e=>{if(e.target.id==='modalBackdrop'){modal=null;$('#modalRoot').innerHTML=''}});
try{const saved=JSON.parse(localStorage.getItem(SAVEKEY)||'null');if(saved?.version===4&&saved?.deck?.length&&saved?.rng!==undefined){S=saved;if(S.screen==='battle'&&(!S.battle||!S.enemy))throw Error('invalid');if(S.screen==='facility'&&(!Array.isArray(S.shopOptions)||S.shopOptions.length<4||S.shopOptions.some(n=>!SHOP_POOL.includes(n)))){makeShopOffers();save()}render()}else startGame(Date.now())}catch(e){startGame(Date.now())}
</script></body></html>
