<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>記号召喚｜ダイス版</title>
<style>

-size:12px}.units{display:flex;gap:8px;min-height:110px;overflow-x:auto;padding:9px 2px 2px;scrollbar-width:thin}.unit{position:relative;flex:0 0 116px;background:#22383d;border:1px solid #435a60;border-radius:10px;padding:8px;min-height:100px}.unit label{font-weight:850;display:block}.unit small{color:var(--muted);display:block}.unit .line{display:flex;justify-content:space-between;gap:3px;margin-top:5px}.unit .index{position:absolute;top:-9px;left:8px;font-size:10px;padding:0px 6px;background:#506265;border-radius:7px}.unit .tags{display:flex;gap:3px;flex-wrap:wrap}.tag{color:var(--gold);font-size:10px}.units-empty{color:#71888b;align-self:center;padding:10px}.mid{display:grid;grid-template-columns:1fr 1.1fr;gap:12px}.seq{display:flex;align-items:center;justify-content:center;gap:9px;min-height:81px}.symbol{display:inline-grid;place-items:center;font-weight:950;line-height:1}.symbol.big{background:#2b4146;border:1px solid #557078;min-width:57px;height:62px;border-radius:12px;font-size:35px}.symbol.empty{opacity:.25}.symbol[data-sym="○"]{color:#c5e2f9}.symbol[data-sym="×"]{color:#e6bac7}.symbol[data-sym="△"]{color:#ead292}.symbol[data-sym="□"]{color:#c3e5b9}.symbol[data-sym="☆"]{color:#ffe39c}.section-name{font-size:12px;color:var(--muted);font-weight:750;margin:0 0 9px}.status{font-weight:800;color:var(--gold);margin:8px 0 0;text-align:center}.dice{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.die{min-width:59px;min-height:61px;padding:6px;border-radius:11px;background:#273f46;position:relative;font-size:31px;font-weight:900}.die.checked{border:2px solid var(--gold);background:#374d48}.die:disabled{opacity:.45}.die small{font-size:10px;display:block;font-weight:600;color:var(--muted)}.die.star{background:#493e2c;border-color:#9c8358}.die.star small{color:#eed49c}.dice-help{font-size:12px;color:var(--muted)}.utility{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.target-control{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.target-control select{max-width:100%;background:#233b41;border:1px solid var(--line);border-radius:7px;padding:9px;color:var(--ink)}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:340px;overflow-y:auto}.option{padding:10px;min-height:70px;text-align:left;display:flex;flex-direction:column;gap:3px}.option.on{background:#3d4a39;border-color:var(--gold)}.option .pattern{font-size:19px;font-weight:900;letter-spacing:.12em}.option .label{font-size:12px;font-weight:750}.option .detail{font-size:11px;color:var(--muted)}.outcome{margin:8px 0;font-size:12px;color:#c6d8d4;min-height:42px}.action-row{display:flex;gap:8px}.action-row button{flex:1}.log{max-height:400px;overflow-y:auto;font-size:12px}.log .entry{padding:7px 0;border-bottom:1px solid #354c51}.log .entry:first-child{font-weight:700;color:var(--gold)}.log .entry:last-child{border:0}.side .panel h3{margin:0 0 9px;font-size:13px}.rules summary{cursor:pointer;color:var(--gold);font-weight:700}.rules p{margin:7px 0;color:var(--muted)}.rule-table{max-height:370px;overflow:auto}.rule-table table{border-collapse:collapse;width:100%;font-size:11px}.rule-table th,.rule-table td{padding:4px;border-bottom:1px solid #32484d;text-align:left}.rule-table th{position:sticky;top:0;background:#1a3036}.centered{display:grid;place-items:center}.screen{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 18%,#2a4d4e,#0d1b21 70%);padding:20px;overflow:auto;display:grid;place-items:center}.screen[hidden]{display:none}.start-card{max-width:520px;width:100%;text-align:center;background:#17292f;border:1px solid #486066;border-radius:20px;padding:32px 22px;box-shadow:0 20px 70px #0008}.start-card .emblem{font-size:38px;letter-spacing:.16em;color:var(--gold)}.start-card h2{font-size:30px;letter-spacing:.1em;margin:7px 0}.start-card p{color:var(--muted);margin:8px 0 20px}.mode-btn{width:100%;display:flex;text-align:left;gap:14px;align-items:center;padding:15px;margin:9px 0;border-radius:12px}.mode-btn .glyph{font-size:27px;min-width:37px;text-align:center}.mode-btn strong{font-size:17px;display:block}.mode-btn small{color:var(--muted);display:block;margin-top:2px}.start-card .sidechoice{margin-top:15px;display:flex;gap:9px;justify-content:center}.sidechoice label{font-size:12px;color:var(--muted)}.start-card input{accent-color:#deb778}.end h2{font-size:24px}.end .buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.note{font-size:11px;color:var(--muted)}@media(max-width:770px){.board{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.rule-table{max-height:240px}}@media(max-width:570px){.wrap{padding:10px 9px 22px}.mid{grid-template-columns:1fr}.side{display:flex}.options{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:11px}.start-card{padding:22px 16px}.head h1{font-size:20px}}
/* 対戦画面：省スペース表示 */
.wrap{max-width:860px;padding:8px 10px 14px}.head{margin:0 0 7px;gap:7px}.head h1{font-size:18px;letter-spacing:.07em}.head .right{gap:5px}.head .right button{padding:5px 8px;font-size:11px}.head .right .small{font-size:11px}
.board{display:block}.main{gap:7px}.panel{padding:8px 10px;border-radius:10px}.army{padding:8px 10px 6px}.fighter{gap:8px;padding:0}.fighter h2{font-size:14px;margin:0}.fighter.isTurn{outline:none}.army:has(.isTurn){border-color:#c5a875;background:linear-gradient(140deg,#243537,#172a30)}.player-name{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.fighter .flag{font-size:10px;line-height:1;color:#b9c5bf}.hp-wrap{min-width:100px;max-width:135px;gap:3px}.hp{height:5px}.hp-label{font-size:11px}
.units{min-height:0;gap:5px;padding:6px 0 1px;overflow-x:auto}.unit{flex:0 0 123px;min-height:49px;padding:6px 7px;border-radius:8px}.unit label{font-size:11px;line-height:1.3}.unit .line{font-size:11px;line-height:1.4;margin-top:4px}.unit .index{font-size:9px;top:-2px;left:auto;right:3px;background:transparent;color:#9cbdba;padding:0}.unit .tags{font-size:10px;line-height:1.15}.tag{font-size:9px}.units-empty{padding:2px 0 0;font-size:11px;line-height:1.25}
.control-panel{padding:8px 10px}.turnline{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 9px}.turnline .status{display:block;margin:0;font-size:12px;text-align:left}.turnline #lastEffect{font-size:11px}.sequence-dice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;margin:5px 0}.seq{min-height:44px;gap:4px;justify-content:flex-start}.symbol.big{min-width:38px;height:41px;font-size:26px;border-radius:7px}.dicebox{min-width:0}.dice{flex-wrap:nowrap;gap:4px;overflow-x:auto;margin:0;padding:1px 0 3px;scrollbar-width:thin}.die{flex:0 0 44px;min-width:44px;min-height:43px;padding:3px 2px;font-size:25px;border-radius:7px}.die small{display:none}.die.checked{border-width:2px}.die.star{flex-basis:44px}.dice-help{font-size:10px;margin:0;line-height:1.4}.dice-help:empty{display:none}.utility{margin-top:3px;gap:5px;font-size:11px}.utility:empty{display:none}
.effect-row{margin:0}.options{max-height:112px;gap:4px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));overflow-y:auto}.options:empty{display:none}.option{padding:5px 7px;min-height:40px;gap:1px}.option .pattern{font-size:14px}.option .label{font-size:11px}.option .detail{display:none}.target-control{margin-top:5px;border-top:0;padding-top:0;gap:5px;font-size:11px}.target-control select{padding:5px;font-size:12px}.outcome{min-height:0;margin:4px 0 5px;font-size:12px;line-height:1.4}.outcome:empty{display:none}.action-row{gap:6px}.action-row .primary{padding:8px 12px;min-height:36px}
.log-disclosure{border:1px solid #334b50;border-radius:8px;font-size:11px;color:var(--muted);padding:0 10px}.log-disclosure summary{cursor:pointer;padding:6px 0;user-select:none}.log{max-height:180px;overflow-y:auto;padding:0 0 6px}.log .entry{padding:4px 0}
.rules-modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#041117e5;padding:12px}.rules-modal[hidden]{display:none}.rules-dialog{width:min(720px,100%);max-height:88dvh;overflow:auto;background:#182b30;border:1px solid #526c71;border-radius:12px;padding:12px}.rule-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-12px;padding:7px 0;background:#182b30;z-index:2}.rule-head button{padding:6px 12px}.rules-dialog p{font-size:12px;line-height:1.5;color:#c3d2cc;margin:7px 0}.rules-dialog .rule-table{max-height:45vh}.rules-dialog .rule-table table{font-size:12px}

@media(max-width:570px){.wrap{padding:7px 7px 14px}.head{display:flex;align-items:center;flex-direction:row;gap:6px;flex-wrap:nowrap}.head h1{font-size:17px;white-space:nowrap}.head .right{flex-wrap:nowrap;gap:4px}.head .right button{padding:5px 6px;font-size:11px;white-space:nowrap}.panel{padding:7px 8px}.army{padding:7px 8px 5px}.fighter h2{font-size:13px}.units{padding-top:5px}.unit{flex-basis:115px}.sequence-dice{gap:8px}.symbol.big{min-width:34px;height:39px;font-size:23px}.seq{gap:3px}.die{flex-basis:40px;min-width:40px;min-height:40px;font-size:23px}.option{min-height:40px}.option .pattern{font-size:13px}.outcome{font-size:11px}.control-panel{padding:7px 8px}}
@media(max-width:360px){.head .right .small{display:none}.sequence-dice{gap:5px}.symbol.big{min-width:31px;height:37px;font-size:22px}.die{flex-basis:38px;min-width:38px;min-height:39px}}
/* 友達料（仮）を参考に、固有能力を押せるチップとして常時表示 */
.unit.unit-detail{display:block;text-align:left;font:inherit;color:var(--ink);cursor:default;white-space:normal;line-height:1.3}
.unit.unit-detail:hover{border-color:var(--gold)}
.unit.unit-detail:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.unit .unit-title{display:block;font-size:11px;font-weight:850;line-height:1.3}
.unit .unit-special{display:block;margin-top:4px;font-size:10px;line-height:1.3;color:var(--gold);font-weight:700;white-space:normal}
.unit .unit-special.sealed{color:#e8aca3}
.unit .tags{margin-top:3px}
.unit-dialog{width:min(440px,100%)}
.unit-dialog .unit-detail-stats{font-size:12px;color:var(--muted);margin:3px 0 10px}
.unit-detail-ability{border-top:1px solid var(--line);padding:10px 0}
.unit-detail-ability strong{color:var(--gold);font-size:14px}
.unit-detail-ability p{margin:4px 0 0;line-height:1.6;font-size:13px;color:var(--ink)}

.unit-detail-note{font-size:12px;color:var(--muted)}
/* 名前・数値はタップで全情報、能力名はタップで即時説明 */
.unit .unit-core{display:block;width:100%;text-align:left;padding:0;margin:0;background:none;border:0;border-radius:3px;color:inherit;min-height:0}
.unit .unit-core:hover{color:var(--gold)}
.unit .unit-chips{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.unit .unit-skill-chip{display:inline-flex;align-items:center;min-height:21px;font-size:10px;line-height:1.15;font-weight:750;padding:2px 5px;border-radius:4px;background:#2d454a;border:1px solid #62818a;color:#cbe4e3;text-align:left;white-space:normal}
.unit .unit-skill-chip.attack{background:#493d2d;border-color:#8c7452;color:#f0d4a0}
.unit .unit-skill-chip.defense{background:#2b4539;border-color:#668876;color:#c6e9c8}
.unit .unit-skill-chip.sealed{background:#50383b;border-color:#97686e;color:#f0c0c4;text-decoration:line-through}
.unit .unit-skill-chip.on{outline:2px solid var(--gold);outline-offset:1px}
.unit .unit-skill-chip:hover{border-color:var(--gold)}
.skill-popover{position:fixed;z-index:48;max-width:calc(100vw - 16px);width:min(292px,calc(100vw - 16px));padding:10px 12px;background:#21373a;border:1px solid #8da69b;border-radius:10px;box-shadow:0 6px 25px #000b;font-size:12px;line-height:1.5;color:var(--ink);pointer-events:none}
.skill-popover[hidden]{display:none}
.skill-popover strong{color:var(--gold);display:block;margin-bottom:4px;font-size:13px}
.die.held{box-shadow:inset 0 -3px 0 #95d0b8}
.die.held small,.die.star small{display:block;position:absolute;bottom:0;right:2px;font-size:8px;line-height:1.1;background:#273f46b9;padding:1px 2px;border-radius:2px}
/* 戦闘は左端から短い間隔で順次再生。コマ送りの表示だけで戦闘結果は変えない */
.battle-notice{margin:5px 0 4px;padding:6px 9px;border-radius:6px;background:#284247;border-left:3px solid var(--gold);color:#eaf2e9;font-size:12px;min-height:28px}
.battle-notice[hidden]{display:none}
.unit.unit-detail.attacking{border-color:#f9d28f;box-shadow:0 0 0 2px #e0b56c77,0 0 18px #e0b56c33;transform:translateY(-2px);transition:transform 130ms ease}
.unit.unit-detail.hit{animation:unit-hit .28s ease}
@keyframes unit-hit{0%,100%{background:#22383d}35%{background:#79494b}}
.hp-wrap.hit{animation:hp-hit .28s ease}
@keyframes hp-hit{40%{filter:brightness(1.9) saturate(1.5)}}
.player-status{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;font-size:10px}
.player-status:empty{display:none}
.player-status span{padding:1px 6px;border-radius:4px;background:#273d41;border:1px solid #517077;color:#d1e1d8}
.target-tip{font-size:10px;color:var(--gold);margin:2px 0}
.unit.unit-detail.selectable{outline:1px dashed #afc2a2;cursor:pointer}
.unit.unit-detail.targeted{outline:2px solid var(--gold);outline-offset:0}
.unit.unit-detail.targeted2{outline:2px solid var(--aqua);outline-offset:0}
@media(prefers-reduced-motion:reduce){.unit.unit-detail.attacking,.unit.unit-detail.hit,.hp-wrap.hit{animation:none;transition:none}}
</style></head>
<body><div class="wrap"><header class="head"><h1>記号召喚</h1><div class="right"><span class="sub small" id="modeLabel"></span><button id="helpBtn" type="button">効果表</button><button id="homeBtn" type="button">タイトル</button></div></header><div class="board"><main class="main">
<section class="panel army" id="foeArmy"><div class="fighter" id="foeFighter"><div class="player-name"><span class="flag" id="foeFlag">待機</span><h2 id="foeName">プレイヤー2</h2></div><div class="hp-wrap"><div class="hp-label"><span>HP</span><strong id="foeHP">40 / 40</strong></div><div class="hp"><i id="foeBar"></i></div></div></div><div class="player-status" id="foePending"></div><div class="units" id="foeUnits"></div></section>
<section class="panel army" id="ownArmy"><div class="fighter" id="ownFighter"><div class="player-name"><span class="flag" id="ownFlag">待機</span><h2 id="ownName">プレイヤー1</h2></div><div class="hp-wrap"><div class="hp-label"><span>HP</span><strong id="ownHP">40 / 40</strong></div><div class="hp"><i id="ownBar"></i></div></div></div><div class="player-status" id="ownPending"></div><div class="units" id="ownUnits"></div></section>
<section class="panel control-panel"><div class="turnline"><strong class="status" id="turnStatus">対戦モードを選択</strong><span class="small sub" id="lastEffect"></span></div><div id="battleNotice" class="battle-notice" aria-live="polite" hidden></div><div class="sequence-dice"><div class="seq" id="seq"></div><div class="dicebox"><div id="dice" class="dice"></div><div class="dice-help" id="diceHelp"></div></div></div><div class="utility" id="diceUtility"></div><div class="effect-row"><div class="options" id="options"></div><div id="targetControl"></div><p class="outcome" id="outcome"></p></div><div class="action-row"><button class="primary" id="confirmBtn" type="button">配置する</button></div></section>
<details class="log-disclosure"><summary>行動履歴</summary><div class="log" id="log"></div></details>
</main></div></div>
<div class="rules-modal" id="rulesModal" hidden><div class="rules-dialog"><div class="rule-head"><strong>ルール・効果表</strong><button id="closeRulesBtn" type="button">閉じる</button></div><div id="rulesText"></div><div class="rule-table" id="ruleTable"></div></div></div>
<div class="skill-popover" id="skillPopover" role="tooltip" hidden></div>
<div class="rules-modal" id="unitModal" hidden role="dialog" aria-modal="true" aria-label="ユニットの能力詳細"><div class="rules-dialog unit-dialog"><div class="rule-head"><strong id="unitModalTitle">ユニットの詳細</strong><button type="button" id="closeUnitBtn">閉じる</button></div><div id="unitInfo"></div></div></div>
<section class="screen" id="startScreen"><div class="start-card"><div class="emblem">○ × △ □ ☆</div><h2>記号召喚</h2><p>3つのダイスから記号を選び、並びを完成させて<br>ユニットを召喚する対戦ゲーム</p><button type="button" id="twoPlayer" class="mode-btn"><span class="glyph">♟</span><span><strong>2人対戦</strong><small>この端末で2人が交互に操作</small></span></button><button type="button" id="cpuGame" class="mode-btn"><span class="glyph">◆</span><span><strong>CPU戦</strong><small>コンピューターと対戦</small></span></button><div class="sidechoice"><label><input name="mySide" type="radio" value="0" checked> CPU戦：先攻で遊ぶ</label><label><input name="mySide" type="radio" value="1"> 後攻で遊ぶ</label></div><p class="note">各手番で1記号ずつ配置。3記号が揃うと効果を発動します。</p></div></section>
<section class="screen end" id="endScreen" hidden><div class="start-card"><div class="emblem">☆</div><h2 id="endTitle"></h2><p id="endDetail"></p><div class="buttons"><button type="button" class="primary" id="againBtn">もう一度遊ぶ</button><button type="button" id="toStartBtn">タイトルへ</button></div></div></section>
<script>
'use strict';
const NORMAL=['○','×','△','□'],FACES=['○','○','×','×','△','□'];
const T={
'○○×':['s','兵士',1],'○×○':['s','盾兵',1],'○××':['s','弓兵',1],'×○○':['s','騎兵',1],'×○×':['s','兵士',1],'××○':['s','盾兵',1],
'○△○':['s','騎兵',1],'○△×':['s','兵士',1],'○□○':['s','盾兵',1],'○□×':['s','弓兵',1],'×△○':['s','弓兵',1],'×△×':['s','騎兵',1],
'×□○':['c','ユニット攻撃',1],'×□×':['c','ユニット回復',1],'△○○':['c','全体攻撃',0],'△○×':['c','ユニット回復',1],
'△×○':['c','攻撃バフ',1],'△××':['c','攻撃バフ',1],'□○○':['c','攻撃デバフ',1],'□○×':['c','バインド',1],

function combat(state,side,log,frames=null){

 function record(u,prior,start){if(!frames)return;
  const before=prior.players[1-side],after=state.players[1-side];
  const hitIds=before.units.filter(old=>{const next=after.units.find(x=>x.id===old.id);return !next||next.hp<old.hp}).map(x=>x.id);
  frames.push({players:deep(state.players),kind:'attack',side,actor:u.id,hitSide:1-side,hitIds,hitHP:after.hp<before.hp,lines:log.slice(start)});
 }
 for(const ref of own.units.slice()){
  const u=own.units.find(x=>x.id===ref.id);if(!u)continue;
  if(u.born===state.step||foe.hp<=0)continue;
  const prior=frames?{players:deep(state.players)}:null, start=log.length;
  if(u.bound>0){u.bound=0;u.mute=0;log.push(`${u.type}はバインドで行動不能`);record(u,prior,start);continue}
  let atk=u.atk;if(u.type==='兵士'){const n=own.units.filter(x=>x.type==='兵士').length;if(u.lv===2&&n>=2)atk+=2;else if(u.lv===3)atk+=n}
  if(u.type==='弓兵'&&u.lv>=2){faceHit(state,side,atk,log);if(u.lv>=3){for(let i=foe.units.length-1;i>=0;i--)damageUnit(foe.units,i,2,log)}record(u,prior,start);continue}
  if(foe.units.length){let ix=0;if(u.type==='騎兵'&&u.lv>=2)ix=foe.units.reduce((best,x,i,a)=>x.hp<a[best].hp?i:best,0);
   const killed=damageUnit(foe.units,ix,atk,log);
   if(killed&&u.type==='騎兵'&&u.lv>=3){if(foe.units.length){const next=foe.units.reduce((best,x,i,a)=>x.hp<a[best].hp?i:best,0);log.push('騎兵Lv3が追撃');damageUnit(foe.units,next,atk,log)}else{log.push('騎兵Lv3が追撃');faceHit(state,side,atk,log)}}
  }else faceHit(state,side,atk,log);
  record(u,prior,start);
 }
}

function execute(state,side,drawn,out,sel,sourceDice,frames=null){const log=[];const spent=new Set(drawn.map(x=>x.virtual?x.source:x.id));if(drawn.some(x=>x.held||(x.virtual&&sourceDice.some(d=>d.id===x.source&&d.held))))state.players[side].held=null;state.seq.push(...drawn.map(x=>x.s));state.players[side].wild=false;log.push(`${drawn.map(x=>x.s).join(' → ')} を配置${out.code?'：'+out.code+' '+showLabel(out.eff):''}`);applyEffect(state,side,out,sel,log,spent,sourceDice);if(frames)frames.push({players:deep(state.players),kind:'effect',side,lines:log.slice()});if(state.players[1-side].hp>0)combat(state,side,log,frames);if(state.players[0].hp<=0||state.players[1].hp<=0){state.winner=state.players[0].hp<=0?1:0;log.push(`${state.winner+1}P 勝利`)}state.step++;state.turn=1-side;state.last=`${state.mode==='cpu'?(side===state.human?'あなた':'CPU'):(side+1)+'P'}：${out.code?out.code+' '+showLabel(out.eff):'記号の配置'}`;return log}
function controlsFor(out,drawn){const t=targets(out.eff);const spent=new Set(drawn.map(x=>x.virtual?x.source:x.id));const remains=g.dice.filter(x=>!x.virtual&&!spent.has(x.id));const isKeep=out.eff[1]==='ダイスキープ';let html='';if(t){const opt=t.items.map(({i,u})=>`<option value="${i}">${i+1}. ${esc(labelUnit(u))}</option>`).join('');html+=`<div class="target-control"><label>${esc(t.desc)}</label><select id="targetA">${opt}</select>${t.twice?`<label>交換先</label><select id="targetB">${opt}</select>`:''}</div>`}if(isKeep){html+=`<div class="target-control"><label>キープするダイス</label><select id="targetKeep">${remains.map(x=>`<option value="${x.id}">${esc(x.s)}</option>`).join('')}</select></div>`}return html}
function getSelection(){const out=chosenOutcome();if(!out)return null;const t=targets(out.eff);const a=t&&t.items.length?(t.items.some(x=>String(x.i)===chosenTarget)?Number(chosenTarget):t.items[0].i):-1;let b=-1;if(t&&t.twice){b=t.items.some(x=>String(x.i)===secondTarget)?Number(secondTarget):(t.items.length>1?t.items[1].i:-1);if(b===a&&t.items.length>1)b=t.items.find(x=>x.i!==a).i}return {a,b,keep:keepTarget,code:out.code}}
function refreshOutcome(){const o=chosenOutcome();if(!o){$('outcome').textContent='記号を選んでください';return}$('outcome').textContent=`${o.raw} ${o.code&&o.code!==o.raw?'→ '+o.code+' と解釈':''}：${showLabel(o.eff)} ／ ${explain(o.eff)}`}
function pendingLabels(p,side){const tags=[];
 if(p.held)tags.push('キープ：'+p.held);
 if(p.delta>0)tags.push('次回ダイス+'+p.delta);
 if(p.delta<0)tags.push('次回ダイス'+p.delta);
 if(p.extra)tags.push('次回2記号');
 if(p.wild)tags.push('次回ワイルド');
 if(p.reroll||(g.turn===side&&g.rerolls))tags.push('振り直し可');
 return tags.map(v=>`<span>${esc(v)}</span>`).join('');
}
function targetPick(side,id){if(!active()||picked.length!==g.need)return false;
 const o=chosenOutcome(),t=o&&targets(o.eff);if(!t||!t.items.length)return false;
 const i=t.items.find(x=>x.u.id===id)?.i;if(i===undefined)return false;
 const srcSide=t.items[0].u&&g.players[0].units.some(u=>u.id===t.items[0].u.id&&u===t.items[0].u)?0:1;
 if(srcSide!==side)return false;
 if(t.twice){if(targetTapStage===0){chosenTarget=String(i);targetTapStage=1;}else{secondTarget=String(i);targetTapStage=0;}}
 else chosenTarget=String(i);
 render();return true;
}
const pauseBattle=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function animateTurn(side,drawn,out,sel){
 if(animating)return;animating=true;
 const token=++playbackToken, upcoming=deep(g), frames=[];
 const log=execute(upcoming,side,drawn,out,sel,g.dice,frames), startPlayers=deep(g.players);
 const prefix=g.mode==='cpu'?(side===g.human?'あなた':'CPU'):(side+1)+'P';
 playback={side,turn:g.step+1,players:startPlayers,seq:upcoming.seq,notice:`${prefix}：${drawn.map(x=>x.s).join(' → ')} ／ ${showLabel(out.eff)}`,actor:null,hitIds:[],hitSide:-1,hitHP:false};
 render();await pauseBattle(130);
 for(const frame of frames){if(token!==playbackToken)return;
  if(frame.kind==='attack'){
   playback.actor=frame.actor;playback.hitIds=[];playback.hitHP=false;
   playback.notice=`${prefix}：${(playback.players[side].units.find(x=>x.id===frame.actor)||{}).type||'ユニット'}が行動`;
   render();await pauseBattle(125);
   if(token!==playbackToken)return;
  }
  playback.players=frame.players;playback.actor=frame.actor||null;playback.hitSide=frame.hitSide??-1;playback.hitIds=frame.hitIds||[];playback.hitHP=!!frame.hitHP;
  playback.notice=frame.kind==='effect'?`${prefix}：${showLabel(out.eff)}`:`${prefix}：${frame.lines.slice(-2).join(' ／ ')}`;
  render();await pauseBattle(frame.kind==='effect'?180:190);
 }
 if(token!==playbackToken)return;
 playback=null;animating=false;g=upcoming;
 for(let i=log.length-1;i>=0;i--)note(log[i]);
 picked=[];chosenCode='';chosenTarget='';secondTarget='';targetTapStage=0;
 if(g.winner!==null){render();showEnd()}else begin();
}
function render(){if(!g)return;closeSkillTip();const my=g.human,enemy=1-my;const display=g.mode==='cpu'?my:0,foe=1-display;for(const [pref,side] of [['own',display],['foe',foe]]){const p=playback?playback.players[side]:pl(side);$(pref+'Name').textContent=sideName(side);$(pref+'Flag').textContent=side===(playback?playback.side:g.turn)?'行動中':'待機';$(pref+'HP').textContent=`${p.hp} / 40`;$(pref+'Bar').style.width=`${Math.max(0,100*p.hp/40)}%`;$(pref+'Fighter').classList.toggle('isTurn',side===(playback?playback.side:g.turn));$(pref+'Pending').innerHTML=pendingLabels(g.players[side],side);$(pref+'HP').closest('.hp-wrap').classList.toggle('hit',!!playback&&playback.hitHP&&playback.hitSide===side);$(pref+'Units').innerHTML=p.units.length?p.units.map((u,i)=>`<article class="unit unit-detail ${playback&&playback.actor===u.id&&playback.side===side?'attacking':''} ${playback&&playback.hitSide===side&&playback.hitIds.includes(u.id)?'hit':''} ${!playback&&picked.length===g.need&&targets(chosenOutcome()?.eff||['n'])?.items.some(x=>x.u.id===u.id)?'selectable':''} ${!playback&&String(chosenTarget)!==''&&targets(chosenOutcome()?.eff||['n'])?.items.some(x=>x.i===Number(chosenTarget)&&x.u.id===u.id)?'targeted':''} ${!playback&&String(secondTarget)!==''&&targets(chosenOutcome()?.eff||['n'])?.items.some(x=>x.i===Number(secondTarget)&&x.u.id===u.id)?'targeted2':''}" data-unit-side="${side}" data-unit-id="${u.id}"><span class="index">${i+1}</span><button type="button" class="unit-core" data-unit-overview="1" aria-label="${esc(u.type)} Lv${u.lv||0}、攻撃${u.atk}、HP${u.hp}。詳細を見る"><span class="unit-title">${esc(u.type)}${u.lv?' Lv'+u.lv:''}</span><span class="line"><span>攻 <b>${u.atk}</b></span><span>HP <b>${u.hp}/${u.max}</b></span></span></button>${unitSkills(u,side).length?`<span class="unit-chips">${unitSkills(u,side).map((skill,j)=>`<button type="button" class="unit-skill-chip ${u.type==='盾兵'?'defense':u.type==='弓兵'||u.type==='騎兵'?'attack':''} ${u.mute?'sealed':''}" data-skill-index="${j}" data-unit-side="${side}" data-unit-id="${u.id}" aria-label="${esc(skill.name)}の効果説明">${esc(skill.short)}</button>`).join('')}</span>`:''}<span class="tags">${u.sturdy?'<span class="tag">頑丈</span>':''}${u.bound?'<span class="tag">バインド</span>':''}${u.mute?'<span class="tag">能力封印</span>':''}${u.debuff?'<span class="tag">攻撃低下</span>':''}</span></article>`).join(''):'<div class="units-empty">ユニットなし</div>'}
$('modeLabel').textContent=g.mode==='cpu'?'CPU戦':'2人対戦';$('seq').innerHTML=Array.from({length:3},(_,i)=>{const t=(playback?playback.seq:g.seq).slice(-3);const s=t[i]||'·';return `<span class="symbol big ${s==='·'?'empty':''}" data-sym="${s}">${s}</span>`}).join('');$('turnStatus').textContent=playback?`${sideName(playback.side)}の戦闘 · ${playback.turn}手番目`:`${sideName(g.turn)}の番 · ${g.step+1}手番目${g.need===2?'（2記号配置）':''}`;$('lastEffect').textContent=g.last?'直前：'+g.last:'';$('battleNotice').hidden=!playback;if(playback)$('battleNotice').textContent=playback.notice;
const yours=active();$('dice').innerHTML=g.dice.map(d=>{const chk=picked.includes(d.id);return `<button type="button" class="die ${chk?'checked':''} ${d.virtual?'star':''} ${d.held?'held':''}" data-die="${d.id}" ${!yours?'disabled':''}><span class="symbol" data-sym="${d.s}">${d.s}</span><small>${d.held?'キープ':d.virtual?'特殊記号':chk?String(picked.indexOf(d.id)+1)+'個目':''}</small></button>`}).join('');document.querySelectorAll('[data-die]').forEach(b=>b.onclick=()=>choose(b.dataset.die));$('diceHelp').textContent=g.mode==='cpu'&&!yours?'CPUの手番':g.need===2?'2記号を順に選択':'';
$('diceUtility').innerHTML=g.rerolls&&yours?`<span class="small">振り直し候補（初期状態では全て選択）：</span>${g.dice.filter(x=>!x.virtual&&!x.held).map(x=>`<label class="small"><input type="checkbox" data-reroll="${x.id}" ${rerollMarked.has(x.id)?'checked':''}> ${x.s}</label>`).join('')}<button id="doReroll" ${!rerollMarked.size?'disabled':''}>選んだダイスを振り直す</button>`:'';
 document.querySelectorAll('[data-reroll]').forEach(c=>c.onchange=()=>{c.checked?rerollMarked.add(c.dataset.reroll):rerollMarked.delete(c.dataset.reroll);const btn=$('doReroll');if(btn)btn.disabled=!rerollMarked.size});
 if($('doReroll'))$('doReroll').onclick=()=>{if(!active()||!g.rerolls||!rerollMarked.size)return;for(const id of rerollMarked){const d=g.dice.find(x=>x.id===id);if(d&&!d.held&&!d.virtual)d.s=rollFace()}g.rerolls=0;picked=[];chosenCode='';rerollMarked.clear();updateStar();render()};
const outs=optionsNow();if(!chosenCode&&outs.length)chosenCode=outs[0].code;$('options').innerHTML=outs.length>1?outs.map(o=>`<button type="button" data-code="${esc(o.code)}" class="option ${chosenCode===o.code?'on':''}"><span class="pattern">${o.code||'—'}</span><span class="label">${esc(showLabel(o.eff))}</span><span class="detail">${esc(explain(o.eff))}</span></button>`).join(''):'';
document.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>{chosenCode=b.dataset.code;chosenTarget='';secondTarget='';keepTarget='';targetTapStage=0;render()});const o=chosenOutcome();$('targetControl').innerHTML=o&&yours?controlsFor(o,selected())+(targets(o.eff)?.items.length?'<div class="target-tip">対象のユニットを直接タップして選択できます</div>':''):'';const ta=$('targetA'),tb=$('targetB'),tk=$('targetKeep');if(ta){if(chosenTarget&&[...ta.options].some(x=>x.value===chosenTarget))ta.value=chosenTarget;chosenTarget=ta.value;ta.onchange=()=>{chosenTarget=ta.value;refreshOutcome()}}if(tb){if(secondTarget&&[...tb.options].some(x=>x.value===secondTarget))tb.value=secondTarget;else if(tb.options.length>1)tb.selectedIndex=1;secondTarget=tb.value;tb.onchange=()=>{secondTarget=tb.value;refreshOutcome()}}if(tk){if(keepTarget&&[...tk.options].some(x=>x.value===keepTarget))tk.value=keepTarget;keepTarget=tk.value;tk.onchange=()=>{keepTarget=tk.value}}refreshOutcome();$('confirmBtn').disabled=!yours||picked.length!==g.need;$('log').innerHTML=g.logs.slice(0,35).map(x=>`<div class="entry">${esc(x)}</div>`).join('')||'<div class="sub small">まだ行動がありません</div>';}
function commit(){if(!active()||picked.length!==g.need)return;const drawn=selected(),out=chosenOutcome(),sel=getSelection(),side=g.turn;animateTurn(side,drawn,out,sel)}

function showEnd(){$('endTitle').textContent=`${sideName(g.winner)}の勝利`;const n=g.players[1-g.winner].hp;$('endDetail').textContent=`全${g.step}手番で決着。敗者の残りHP：${n}`;$('endScreen').hidden=false}
function heuristic(state,side){const own=state.players[side],foe=state.players[1-side];if(foe.hp<=0)return 100000;if(own.hp<=0)return -100000;const value=(p)=>p.hp*2.2+p.units.reduce((sum,u)=>{let v=7+u.hp*.7+u.atk*1.9;const lev=u.lv||0;if(u.type==='兵士')v+=lev>=2?3*lev:0;if(u.type==='盾兵')v+=lev>=2?13:0;if(u.type==='弓兵')v+=lev>=2?11:0;if(u.type==='騎兵')v+=lev>=2?10:0;if(u.type==='ドラゴン')v+=13;return sum+v},0)+(p.held?2:0)+p.delta*2+(p.extra?7:0)+(p.wild?9:0)+(p.reroll?4:0);return value(own)-value(foe)}
function cpuPick(){const all=choiceList();const side=g.turn;let best=null;for(const draw of all){const syms=draw.map(x=>x.s);for(const out of outcomes(syms,current().wild)){
const t=targets(out.eff,side,g);let sels=[{a:-1,b:-1,keep:''}];if(t&&t.items.length){sels=t.items.map(x=>({a:x.i,b:-1,keep:''}));if(t.twice)sels=t.items.flatMap(x=>t.items.filter(y=>y.i!==x.i).map(y=>({a:x.i,b:y.i,keep:''})))}if(out.eff[1]==='ダイスキープ'){const spent=new Set(draw.map(x=>x.spent));const rest=g.dice.filter(x=>!x.virtual&&!spent.has(x.id));sels=rest.length?rest.map(x=>({a:-1,b:-1,keep:x.id})):[{a:-1,b:-1,keep:''}]}
for(const sel of sels){const tmp=deep(g),log=execute(tmp,side,draw,out,sel,g.dice);let v=heuristic(tmp,side);if(tmp.winner!==null&&tmp.winner===side)v+=100000;v+=Math.random()*.1;if(best===null||v>best.v)best={v,draw,out,sel};}
}}
return best}
function cpuMove(){if(!g||animating||g.winner!==null||g.mode!=='cpu'||g.turn===g.human)return;
 const p=current();if(g.rerolls){const baseline=cpuPick(),newly=g.dice.filter(x=>!x.virtual&&!x.held),before=deep(g.dice);
  for(const d of newly)d.s=rollFace();updateStar();const after=cpuPick();if(after&&baseline&&after.v<baseline.v){g.dice=before;updateStar()}g.rerolls=0}
 const pick=cpuPick();if(!pick){note('CPUの行動候補がありません');return}
 const drawn=pick.draw.map(x=>g.dice.find(d=>d.id===x.id)).filter(Boolean);
 animateTurn(g.turn,drawn,pick.out,pick.sel);
}

function renderRules(){const summary=`<p>各ターン、6面ダイス（○○××△□）3個から1記号を選び、共有の記号列に追加します。直近3記号で効果を判定。開始時も先後交互に1記号ずつ置き、ゲーム全体の3手番目（先攻の2回目）から発動します。</p><p>同一記号3連続は効果なし。キープ中を含む手元のダイス3個以上が同じ出目の場合、1個の代わりに☆を選べます。キープを☆に置き換えて使った場合はキープを消費します。☆が最後ならドラゴン召喚、1・2記号目ならワイルドカードです。</p><p>ユニットは召喚順に左から攻撃（召喚した手番は攻撃しません）。通常は敵の左端を攻撃し、敵がいなければプレイヤーを攻撃します。プレイヤーHPは40。記号効果による全体攻撃は3ダメージと5ダメージの2段階です。バインドLv1は敵左端1体、Lv2は指定敵1体、Lv3は敵ユニット全体を1手番行動・能力封印します。Lv3は頑丈も解除します。</p><p>兵士Lv2：味方兵士が他にいれば攻撃+2。Lv3：味方兵士の人数だけ攻撃追加。盾兵Lv2：プレイヤーへの攻撃をかばう。Lv3：左隣に一度だけ頑丈を付与。弓兵Lv2：プレイヤーを直接狙撃。Lv3：加えて敵全体に2ダメージ。騎兵Lv2：残りHPの少ない敵を攻撃。Lv3：撃破時に1回追撃。ドラゴン：攻10/HP30、召喚時に敵全体へ4ダメージ。</p><p>暫定処理：盾兵Lv3の頑丈は召喚・昇格時に付与、騎兵の追撃は各手番1回、デバフは攻撃0を下限としています。先後のダイス補正は未採用です。</p>`;$('rulesText').innerHTML=summary;const entries=Object.entries(T).sort(([a],[b])=>{const score=s=>2*('△□'.includes(s[0]))+1*('△□'.includes(s[1]))+4*('△□'.includes(s[2]));return score(a)-score(b)||a.localeCompare(b)});$('ruleTable').innerHTML='<table><thead><tr><th>記号</th><th>点</th><th>効果</th><th>詳細</th></tr></thead><tbody>'+entries.map(([code,e])=>`<tr><td>${code}</td><td>${2*('△□'.includes(code[0]))+1*('△□'.includes(code[1]))+4*('△□'.includes(code[2]))}</td><td>${esc(showLabel(e))}</td><td>${esc(explain(e))}</td></tr>`).join('')+'</tbody></table>'}
for(const panelId of ['ownUnits','foeUnits'])$(panelId).addEventListener('click',e=>{
 const skill=e.target.closest('[data-skill-index]');if(skill){showSkillTip(skill);return}
 const card=e.target.closest('[data-unit-id]');if(card&&!animating){const side=Number(card.dataset.unitSide),id=Number(card.dataset.unitId);if(targetPick(side,id))return;showUnitDetails(side,id)}
});

$('twoPlayer').onclick=()=>play('local');$('cpuGame').onclick=()=>play('cpu');$('confirmBtn').onclick=commit;$('againBtn').onclick=()=>play(g.mode);$('toStartBtn').onclick=()=>{$('endScreen').hidden=true;$('startScreen').hidden=false};$('homeBtn').onclick=()=>{if(animating)return;if(g&&g.winner===null&&!confirm('対戦を終了してタイトルに戻りますか？'))return;clearTimeout(cpuTimer);$('startScreen').hidden=false};$('helpBtn').onclick=()=>{$('rulesModal').hidden=false};$('closeRulesBtn').onclick=()=>{$('rulesModal').hidden=true};$('rulesModal').onclick=e=>{if(e.target===$('rulesModal'))$('rulesModal').hidden=true};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('rulesModal').hidden=true});renderRules();
// 診断用（ゲーム動作に影響しない）
