<body><div class="wrap"><header class="head"><div><h1>記号召喚</h1><p>ダイス版 · 4記号 / 60効果 / 4兵種</p></div><div class="right"><span class="sub small" id="modeLabel"></span><button id="helpBtn" type="button">ルール</button><button id="homeBtn" type="button">タイトルへ</button></div></header><div class="board"><main class="main"><section class="panel fighter" id="foeFighter"><div><div class="flag" id="foeFlag">相手</div><h2 id="foeName">プレイヤー2</h2></div><div class="hp-wrap"><div class="hp-label"><span>HP</span><strong id="foeHP">40 / 40</strong></div><div class="hp"><i id="foeBar"></i></div></div></section><section class="panel"><p class="section-name" id="foeUnitsName">相手のユニット · 左から行動</p><div class="units" id="foeUnits"></div></section><section class="mid"><div class="panel"><p class="section-name">直近の記号（左 → 右）</p><div class="seq" id="seq"></div><p class="status" id="turnStatus">対戦モードを選んでください</p><p class="small sub" id="lastEffect"></p></div><div class="panel"><p class="section-name">今回のダイス・記号を配置</p><div id="dice" class="dice"></div><div class="dice-help" id="diceHelp"></div><div class="utility" id="diceUtility"></div></div></section><section class="panel"><p class="section-name">発動する効果の選択</p><div class="options" id="options"></div><div id="targetControl"></div><p class="outcome" id="outcome"></p><div class="action-row"><button id="clearBtn" type="button">選択を取り消す</button><button class="primary" id="confirmBtn" type="button">この記号を配置する</button></div></section><section class="panel fighter" id="ownFighter"><div><div class="flag" id="ownFlag">自分</div><h2 id="ownName">プレイヤー1</h2></div><div class="hp-wrap"><div class="hp-label"><span>HP</span><strong id="ownHP">40 / 40</strong></div><div class="hp"><i id="ownBar"></i></div></div></section><section class="panel"><p class="section-name" id="ownUnitsName">自分のユニット · 左から行動</p><div class="units" id="ownUnits"></div></section></main><aside class="side"><div class="panel"><h3>行動履歴</h3><div class="log" id="log"></div></div><div class="panel"><details class="rules" id="rules"><summary>戦闘ルールと効果表</summary><div id="rulesText"></div><div class="rule-table" id="ruleTable"></div></details></div></aside></div></div>
<section class="screen" id="startScreen"><div class="start-card"><div class="emblem">○ × △ □ ☆</div><h2>記号召喚</h2><p>3つのダイスから記号を選び、並びを完成させて<br>ユニットを召喚する対戦ゲーム</p><button type="button" id="twoPlayer" class="mode-btn"><span class="glyph">♟</span><span><strong>2人対戦</strong><small>この端末で2人が交互に操作</small></span></button><button type="button" id="cpuGame" class="mode-btn"><span class="glyph">◆</span><span><strong>CPU戦</strong><small>コンピューターと対戦</small></span></button><div class="sidechoice"><label><input name="mySide" type="radio" value="0" checked> CPU戦：先攻で遊ぶ</label><label><input name="mySide" type="radio" value="1"> 後攻で遊ぶ</label></div><p class="note">各手番で1記号ずつ配置。3記号が揃うと効果を発動します。</p></div></section>
<section class="screen end" id="endScreen" hidden><div class="start-card"><div class="emblem">☆</div><h2 id="endTitle"></h2><p id="endDetail"></p><div class="buttons"><button type="button" class="primary" id="againBtn">もう一度遊ぶ</button><button type="button" id="toStartBtn">タイトルへ</button></div></div></section>
<script>
'use strict';
const NORMAL=['○','×','△','□'],FACES=['○','○','×','×','△','□'];
const T={
'○○×':['s','兵士',1],'○×○':['s','盾兵',1],'○××':['s','弓兵',1],'×○○':['s','騎兵',1],'×○×':['s','兵士',1],'××○':['s','盾兵',1],
'○△○':['s','騎兵',1],'○△×':['s','兵士',1],'○□○':['s','盾兵',1],'○□×':['s','弓兵',1],'×△○':['s','弓兵',1],'×△×':['s','騎兵',1],
'×□○':['c','ユニット攻撃',1],'×□×':['c','ユニット回復',1],'△○○':['c','ユニット攻撃',1],'△○×':['c','ユニット回復',1],
'△×○':['c','攻撃バフ',1],'△××':['c','攻撃バフ',1],'□○○':['c','攻撃デバフ',1],'□○×':['c','バインド',1],
'□×○':['o','レベルアップ',1],'□××':['o','ダイスキープ',0],
'△△○':['s','兵士',2],'△△×':['s','盾兵',2],'△□○':['c','攻撃デバフ',2],'△□×':['o','レベルアップ',1],
'□△○':['o','敵位置変更',0],'□△×':['o','浄化',0],'□□○':['o','任意振り直し',0],'□□×':['o','プレイヤー回復',0],
'○○△':['s','兵士',2],'○○□':['s','盾兵',2],'○×△':['s','弓兵',2],'○×□':['s','騎兵',2],
'×○△':['c','ユニット攻撃',2],'×○□':['c','ユニット回復',2],'××△':['o','次回4ダイス',0],'××□':['o','プレイヤー攻撃',0],
'○△△':['s','弓兵',2],'○△□':['s','騎兵',2],'○□△':['c','バインド',2],'○□□':['c','攻撃バフ',2],
'×△△':['o','ダイスキープ',0],'×△□':['o','任意振り直し',0],'×□△':['o','次回4ダイス',0],'×□□':['o','プレイヤー回復',0],
'△○△':['s','兵士',3],'△○□':['s','盾兵',3],'△×△':['s','騎兵',3],'△×□':['c','ユニット攻撃',3],
'□○△':['c','ユニット回復',3],'□○□':['o','レベルアップ',2],'□×△':['o','次回相手2ダイス',0],'□×□':['o','次回2記号',0],
'△△□':['s','弓兵',3],'△□△':['c','攻撃バフ',3],'△□□':['c','攻撃デバフ',3],'□△△':['c','バインド',3],'□△□':['o','次回1記号目ワイルド',0],'□□△':['o','プレイヤー攻撃',0]};
const NO=['○○○','×××','△△△','□□□'];
const STATS={'兵士':[[5,12],[6,17],[7,22]],'盾兵':[[2,20],[3,27],[4,34]],'弓兵':[[4,10],[5,14],[6,18]],'騎兵':[[5,11],[6,15],[7,19]],'ドラゴン':[[10,30]]};
const $=id=>document.getElementById(id);const randint=n=>Math.floor(Math.random()*n);const rollFace=()=>FACES[randint(FACES.length)];const deep=x=>structuredClone(x);const esc=s=>String(s).replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[a]));
let g=null,picked=[],chosenCode='',chosenTarget='',secondTarget='',keepTarget='',rerollMarked=new Set(),cpuTimer=null,pausedRules=false;
function pl(i){return g.players[i]}
function sideName(i){return g.mode==='cpu'?(i===g.human?'あなた':'CPU'):`プレイヤー${i+1}`}
function play(mode){clearTimeout(cpuTimer);g={mode,human:mode==='cpu'?Number(document.querySelector('input[name=mySide]:checked').value):0,players:[0,1].map(()=>({hp:40,units:[],held:null,delta:0,extra:false,reroll:false,wild:false})),seq:[],turn:0,step:0,round:0,uid:0,winner:null,logs:[],last:'',dice:[],need:1,rolled:[],lastCode:'',rerolls:0};$('startScreen').hidden=true;$('endScreen').hidden=true;begin()}
function note(s){g.logs.unshift(s);g.logs=g.logs.slice(0,70)}
function active(){return g&&g.winner===null&&!(g.mode==='cpu'&&g.turn!==g.human)}
function current(){return pl(g.turn)}
function begin(){if(g.winner!==null)return;const p=current();g.need=p.extra?2:1;p.extra=false;const total=Math.max(2,Math.min(4,3+p.delta));p.delta=0;g.dice=[];if(p.held!==null){g.dice.push({id:'h',s:p.held,held:true})}for(let i=g.dice.length;i<total;i++)g.dice.push({id:'d'+i,s:rollFace(),held:false});g.rerolls=p.reroll?1:0;p.reroll=false;updateStar();picked=[];chosenCode='';chosenTarget='';secondTarget='';keepTarget='';rerollMarked=new Set();render();if(g.mode==='cpu'&&g.turn!==g.human){cpuTimer=setTimeout(cpuMove,380)}}
function updateStar(){g.dice=g.dice.filter(d=>!d.virtual);const nums={};for(const d of g.dice.filter(d=>!d.held))nums[d.s]=(nums[d.s]||0)+1;const triple=Object.keys(nums).find(k=>nums[k]>=3);if(triple){const source=g.dice.find(d=>!d.held&&d.s===triple);g.dice.push({id:'star',s:'☆',virtual:true,source:source.id})}}
function choiceList(){const base=g.dice.map(d=>({s:d.s,id:d.id,spent:d.virtual?d.source:d.id,held:!!d.held,virtual:!!d.virtual}));if(g.need===1)return base.map(a=>[a]);const ret=[];for(const a of base)for(const b of base){if(a.spent!==b.spent&&a.id!==b.id)ret.push([a,b])}return ret}
function selected(){return picked.map(id=>g.dice.find(d=>d.id===id)).filter(Boolean)}
function choose(id){if(!active())return;const die=g.dice.find(d=>d.id===id);if(!die)return;const ix=picked.indexOf(id);if(ix>=0)picked.splice(ix,1);else if(picked.length<g.need&&!selected().some(x=>(x.virtual?x.source:x.id)===(die.virtual?die.source:die.id)))picked.push(id);chosenCode='';chosenTarget='';secondTarget='';keepTarget='';render()}
function outcomes(symbols,wild,history=g.seq){const seq=history.concat(symbols);if(seq.length<3)return [{code:'',eff:['n','判定前',0],raw:seq.slice(-3).join('')}];const raw=seq.slice(-3);if(raw[2]==='☆')return [{code:'☆',eff:['d','ドラゴン',0],raw:raw.join('')}];let opts=[''];for(let i=0;i<3;i++){const variants=raw[i]==='☆'||(i===0&&wild)?NORMAL:[raw[i]];opts=opts.flatMap(prefix=>variants.map(x=>prefix+x))}return [...new Set(opts)].map(code=>({code,raw:raw.join(''),eff:T[code]||['n','効果なし',0]}))}
function showLabel(e){let [cat,name,lv]=e;if(cat==='s')return `${name} Lv${lv}召喚`;if(cat==='c'||(cat==='o'&&name==='レベルアップ'))return `${name} Lv${lv}`;return name}
function explain(e){const [cat,name,lv]=e;if(cat==='s'){const [atk,hp]=STATS[name][lv-1];return `攻${atk} / HP${hp}`}if(cat==='d')return '攻撃10 / HP30、召喚時に敵全体へ4';if(cat==='n')return name==='判定前'?'最初の3記号が揃うまで発動しません':'効果なし';const target={1:'左端',2:'指定した1体',3:'全体'}[lv];if(name==='ユニット攻撃')return `${target}に${[0,7,10,5][lv]}ダメージ`;if(name==='ユニット回復')return `${target}を${[0,6,10,5][lv]}回復`;if(name==='攻撃バフ'||name==='攻撃デバフ')return `${target}の攻撃力を${[0,2,4,2][lv]}永続${name==='攻撃バフ'?'増加':'減少'}`;if(name==='バインド')return lv===3?'指定敵1体を1手番行動・能力封印（頑丈解除）':`${target}を1手番行動不能`;if(name==='レベルアップ')return lv===1?'左端の味方を1段階強化':'味方1体を選んで1段階強化';return ({'敵位置変更':'敵ユニット2体の順序交換','ダイスキープ':'残ったダイス1個を保持','次回4ダイス':'次の自手番に4ダイス','次回相手2ダイス':'相手の次手番を2ダイス','次回2記号':'次の自手番に2記号配置','浄化':'味方1体のバインド・攻撃低下を解除','任意振り直し':'次の自手番に新規ダイスを選んで振り直し','プレイヤー攻撃':'相手プレイヤーへ6ダメージ（盾兵にかばわれる）','プレイヤー回復':'自分のHPを6回復','次回1記号目ワイルド':'次の自手番の3記号判定で1記号目がワイルド'})[name]||''}
function optionsNow(){if(picked.length!==g.need)return [];return outcomes(selected().map(x=>x.s),current().wild)}
function chosenOutcome(){const outs=optionsNow();return outs.find(x=>x.code===chosenCode)||outs[0]}
function targets(e,turn=g.turn,state=g){const [cat,name,lv]=e;const own=state.players[turn].units,enemy=state.players[1-turn].units;let team=null,filtered=null,twice=false,desc='対象';if(cat==='c'){
if(name==='ユニット攻撃'||name==='攻撃デバフ'||name==='バインド'){if(lv===2||(name==='バインド'&&lv===3)){team=enemy;desc='敵ユニット'}}
else if(name==='ユニット回復'||name==='攻撃バフ'){if(lv===2){team=own;desc='味方ユニット'}}
}else if(cat==='o'){if(name==='レベルアップ'&&lv===2){team=own;filtered=u=>u.type!=='ドラゴン'&&u.lv<3;desc='レベルアップ対象'}else if(name==='浄化'){team=own;desc='浄化対象'}else if(name==='敵位置変更'){team=enemy;twice=true;desc='位置を交換する敵'}}
if(!team)return null;return {items:team.map((u,i)=>({i,u})).filter(x=>!filtered||filtered(x.u)),twice,desc}}
function labelUnit(u){return `${u.type}${u.lv?' Lv'+u.lv:''}（HP${u.hp} / 攻${u.atk}）`}
function targetIndex(e,arr,turn,sel){const t=targets(e,turn,{players:arr});if(!t||!t.items.length)return -1;if(t.items.some(x=>String(x.i)===String(sel)))return Number(sel);return t.items[0].i}
function addUnit(state,side,name,lv,log){const [atk,hp]=STATS[name][name==='ドラゴン'?0:lv-1];const u={id:++state.uid,type:name,lv,hp,max:hp,atk,born:state.step,sturdy:false,bound:0,mute:0,debuff:0};state.players[side].units.push(u);if(name==='盾兵'&&lv===3)grantSturdy(state.players[side].units,u,log);if(name==='ドラゴン'){const arr=state.players[1-side].units;for(let i=arr.length-1;i>=0;i--)damageUnit(arr,i,4,log);log.push('ドラゴン召喚時：敵ユニット全体に4ダメージ')}log.push(`${name}${lv?' Lv'+lv:''}召喚（攻${atk} / HP${hp}）`)}
function grantSturdy(arr,shield,log){const i=arr.findIndex(x=>x.id===shield.id);if(i>0){arr[i-1].sturdy=true;log.push(`${arr[i-1].type}に頑丈を付与`)}}
function damageUnit(arr,i,dmg,log){if(i<0||i>=arr.length)return false;const u=arr[i];const d=Math.max(0,dmg);if(d>=u.hp&&u.sturdy&&u.mute===0){u.hp=1;u.sturdy=false;log.push(`${u.type}は頑丈でHP1残った`);return false}u.hp-=d;log.push(`${u.type}に${d}ダメージ${u.hp<=0?'・撃破':''}`);if(u.hp<=0){arr.splice(i,1);return true}return false}
function faceHit(state,side,dmg,log){const foe=state.players[1-side],idx=foe.units.findIndex(u=>u.type==='盾兵'&&u.lv>=2&&u.mute===0);if(idx>=0){log.push('盾兵がプレイヤーをかばう');damageUnit(foe.units,idx,dmg,log)}else{foe.hp=Math.max(0,foe.hp-Math.max(0,dmg));log.push(`プレイヤーに${dmg}ダメージ（残りHP${foe.hp}）`)}}
function upgrade(state,arr,i,log){const u=arr[i];if(!u||u.lv>=3||u.type==='ドラゴン'){log.push('レベルアップ対象なし');return}const [atk,hp]=STATS[u.type][u.lv];const [oldAtk]=STATS[u.type][u.lv-1];const gain=hp-u.max;u.lv++;u.max=hp;u.hp+=gain;u.atk+=atk-oldAtk;log.push(`${u.type}がLv${u.lv}へ（HP +${gain}）`);if(u.type==='盾兵'&&u.lv===3)grantSturdy(arr,u,log)}
function applyEffect(state,side,out,sel,log,spent,dice){const [cat,name,lv]=out.eff,self=state.players[side],foe=state.players[1-side],own=self.units,enemy=foe.units;const ix=targetIndex(out.eff,state.players,side,sel.a);const jx=targetIndex(out.eff,state.players,side,sel.b);let d=0;if(cat==='n'){log.push(out.code?'効果なし':'効果判定前');return}if(cat==='s'){addUnit(state,side,name,lv,log);return}if(cat==='d'){addUnit(state,side,'ドラゴン',0,log);return}
if(cat==='c'){
if(name==='ユニット攻撃'){d=[0,7,10,5][lv];if(lv===3){for(let i=enemy.length-1;i>=0;i--)damageUnit(enemy,i,d,log)}else damageUnit(enemy,lv===1?0:ix,d,log)}
if(name==='ユニット回復'){d=[0,6,10,5][lv];const arr=lv===3?own:(lv===1?own.slice(0,1):(ix>=0?[own[ix]]:[]));for(const u of arr){if(!u)continue;const h=Math.max(0,Math.min(d,u.max-u.hp));u.hp+=h;if(h)log.push(`${u.type}が${h}回復`)} }
if(name==='攻撃バフ'||name==='攻撃デバフ'){d=[0,2,4,2][lv];const arr=name==='攻撃バフ'?own:enemy;const tgt=lv===3?arr:(lv===1?arr.slice(0,1):(ix>=0?[arr[ix]]:[]));for(const u of tgt){if(!u)continue;const b=u.atk;u.atk=name==='攻撃バフ'?u.atk+d:Math.max(0,u.atk-d);if(name==='攻撃デバフ')u.debuff+=b-u.atk;log.push(`${u.type} 攻${b}→${u.atk}`)}}
if(name==='バインド'){const u=enemy[lv===1?0:ix];if(u){u.bound=Math.max(u.bound,1);if(lv===3){u.mute=Math.max(u.mute,1);u.sturdy=false}log.push(`${u.type}をバインド${lv===3?'・能力封印':''}`)}}return}
if(name==='レベルアップ'){upgrade(state,own,lv===1?0:ix,log)}
if(name==='敵位置変更'){if(ix>=0&&jx>=0&&ix!==jx){[enemy[ix],enemy[jx]]=[enemy[jx],enemy[ix]];log.push('敵ユニットの順序を交換')}}
if(name==='浄化'){const u=own[ix];if(u){u.atk+=u.debuff;u.debuff=0;u.bound=0;u.mute=0;log.push(`${u.type}のバインド・攻撃デバフを解除`)}}
if(name==='次回4ダイス')self.delta+=1;
if(name==='次回相手2ダイス')foe.delta-=1;
if(name==='次回2記号')self.extra=true;
if(name==='任意振り直し')self.reroll=true;
if(name==='次回1記号目ワイルド')self.wild=true;
if(name==='プレイヤー攻撃')faceHit(state,side,6,log);
if(name==='プレイヤー回復'){const h=Math.min(6,40-self.hp);self.hp+=h;log.push(`プレイヤーHP +${h}`)}
if(name==='ダイスキープ'){if(self.held){log.push('すでにキープ中');return}const left=dice.filter(x=>!x.virtual&&!spent.has(x.id));const d=left.find(x=>x.id===sel.keep)||left[0];if(d){self.held=d.s;log.push(`ダイス${d.s}をキープ`)}else log.push('キープ対象なし')}
if(!['レベルアップ','敵位置変更','浄化','プレイヤー攻撃','プレイヤー回復','ダイスキープ'].includes(name))log.push(showLabel(out.eff)+' を適用');}
function combat(state,side,log){const own=state.players[side],foe=state.players[1-side];for(const ref of own.units.slice()){
const u=own.units.find(x=>x.id===ref.id);if(!u)continue;if(u.born===state.step)continue;if(foe.hp<=0)break;
if(u.bound>0){u.bound=0;u.mute=0;log.push(`${u.type}はバインドで行動不能`);continue}
let atk=u.atk;if(u.type==='兵士'){const n=own.units.filter(x=>x.type==='兵士').length;if(u.lv===2&&n>=2)atk+=2;else if(u.lv===3)atk+=n}
if(u.type==='弓兵'&&u.lv>=2){faceHit(state,side,atk,log);if(u.lv>=3){for(let i=foe.units.length-1;i>=0;i--)damageUnit(foe.units,i,2,log)}continue}
if(foe.units.length){let ix=0;if(u.type==='騎兵'&&u.lv>=2)ix=foe.units.reduce((best,x,i,a)=>x.hp<a[best].hp?i:best,0);const killed=damageUnit(foe.units,ix,atk,log);if(killed&&u.type==='騎兵'&&u.lv>=3){if(foe.units.length){const next=foe.units.reduce((best,x,i,a)=>x.hp<a[best].hp?i:best,0);log.push('騎兵Lv3が追撃');damageUnit(foe.units,next,atk,log)}else{log.push('騎兵Lv3が追撃');faceHit(state,side,atk,log)}}}
else faceHit(state,side,atk,log)
}}
function execute(state,side,drawn,out,sel,sourceDice){const log=[];const spent=new Set(drawn.map(x=>x.virtual?x.source:x.id));if(drawn.some(x=>x.held))state.players[side].held=null;state.seq.push(...drawn.map(x=>x.s));state.players[side].wild=false;log.push(`${drawn.map(x=>x.s).join(' → ')} を配置${out.code?'：'+out.code+' '+showLabel(out.eff):''}`);applyEffect(state,side,out,sel,log,spent,sourceDice);if(state.players[1-side].hp>0)combat(state,side,log);if(state.players[0].hp<=0||state.players[1].hp<=0){state.winner=state.players[0].hp<=0?1:0;log.push(`${state.winner+1}P 勝利`)}state.step++;state.turn=1-side;state.last=out.code?`${out.code}：${showLabel(out.eff)}`:'記号の配置';return log}
function controlsFor(out,drawn){const t=targets(out.eff);const spent=new Set(drawn.map(x=>x.virtual?x.source:x.id));const remains=g.dice.filter(x=>!x.virtual&&!spent.has(x.id));const isKeep=out.eff[1]==='ダイスキープ';let html='';if(t){const opt=t.items.map(({i,u})=>`<option value="${i}">${i+1}. ${esc(labelUnit(u))}</option>`).join('');html+=`<div class="target-control"><label>${esc(t.desc)}</label><select id="targetA">${opt}</select>${t.twice?`<label>交換先</label><select id="targetB">${opt}</select>`:''}</div>`}if(isKeep){html+=`<div class="target-control"><label>キープするダイス</label><select id="targetKeep">${remains.map(x=>`<option value="${x.id}">${esc(x.s)}</option>`).join('')}</select></div>`}return html}
function getSelection(){const out=chosenOutcome();if(!out)return null;const t=targets(out.eff);const a=t&&t.items.length?(t.items.some(x=>String(x.i)===chosenTarget)?Number(chosenTarget):t.items[0].i):-1;let b=-1;if(t&&t.twice){b=t.items.some(x=>String(x.i)===secondTarget)?Number(secondTarget):(t.items.length>1?t.items[1].i:-1);if(b===a&&t.items.length>1)b=t.items.find(x=>x.i!==a).i}return {a,b,keep:keepTarget,code:out.code}}
function refreshOutcome(){const o=chosenOutcome();if(!o){$('outcome').textContent=`${g.need}個のダイスを順に選んでください。`;return}$('outcome').textContent=`${o.raw} ${o.code&&o.code!==o.raw?'→ '+o.code+' と解釈':''}：${showLabel(o.eff)} ／ ${explain(o.eff)}`}
function render(){if(!g)return;const my=g.human,enemy=1-my;const display=g.mode==='cpu'?my:0,foe=1-display;for(const [pref,side] of [['own',display],['foe',foe]]){const p=pl(side);$(pref+'Name').textContent=sideName(side);$(pref+'Flag').textContent=side===g.turn?'行動中':'待機';$(pref+'HP').textContent=`${p.hp} / 40`;$(pref+'Bar').style.width=`${Math.max(0,100*p.hp/40)}%`;$(pref+'Fighter').classList.toggle('isTurn',side===g.turn);$(pref+'UnitsName').textContent=`${sideName(side)}のユニット · 左から行動`;$(pref+'Units').innerHTML=p.units.length?p.units.map((u,i)=>`<article class="unit"><div class="index">${i+1}</div><label>${esc(u.type)}${u.lv?' Lv'+u.lv:''}</label><small>${u.type==='ドラゴン'?'大型':'ユニット'}</small><div class="line"><span>攻 <b>${u.atk}</b></span><span>HP <b>${u.hp}/${u.max}</b></span></div><div class="tags">${u.sturdy?'<span class="tag">頑丈</span>':''}${u.bound?'<span class="tag">バインド</span>':''}${u.mute?'<span class="tag">能力封印</span>':''}${u.debuff?'<span class="tag">攻撃低下</span>':''}</div></article>`).join(''):'<div class="units-empty">ユニットなし</div>'}
$('modeLabel').textContent=g.mode==='cpu'?'CPU戦':'2人対戦';$('seq').innerHTML=Array.from({length:3},(_,i)=>{const t=g.seq.slice(-3);const s=t[i]||'·';return `<span class="symbol big ${s==='·'?'empty':''}" data-sym="${s}">${s}</span>`}).join('');$('turnStatus').textContent=`${sideName(g.turn)}の番 · ${g.step+1}手番目${g.need===2?'（2記号配置）':''}`;$('lastEffect').textContent=`前の効果：${g.last||'まだ発動していません'}`;
const yours=active();$('dice').innerHTML=g.dice.map(d=>{const chk=picked.includes(d.id),spent=selected().some(x=>(x.virtual?x.source:x.id)===(d.virtual?d.source:d.id));return `<button type="button" class="die ${chk?'checked':''} ${d.virtual?'star':''}" data-die="${d.id}" ${!yours||(!chk&&(picked.length>=g.need||spent))?'disabled':''}><span class="symbol" data-sym="${d.s}">${d.s}</span><small>${d.held?'キープ':d.virtual?'特殊記号':chk?String(picked.indexOf(d.id)+1)+'個目':''}</small></button>`}).join('');document.querySelectorAll('[data-die]').forEach(b=>b.onclick=()=>choose(b.dataset.die));$('diceHelp').textContent=g.mode==='cpu'&&!yours?'CPUが考えています…':g.seq.length<2?'3記号が揃うまでは効果なし。':g.need===2?'配置順を指定してください。効果は2記号目の後に1回判定します。':'3つのダイスから1記号を選んでください。';
$('diceUtility').innerHTML=g.rerolls&&yours?`<span class="small">振り直す新規ダイスを選択（キープ不可）</span>${g.dice.filter(x=>!x.virtual&&!x.held).map(x=>`<label class="small"><input type="checkbox" data-reroll="${x.id}" ${rerollMarked.has(x.id)?'checked':''}> ${x.s}</label>`).join('')}<button id="doReroll">選択したダイスを振り直す</button>`:'';document.querySelectorAll('[data-reroll]').forEach(c=>c.onchange=()=>{c.checked?rerollMarked.add(c.dataset.reroll):rerollMarked.delete(c.dataset.reroll)});if($('doReroll'))$('doReroll').onclick=()=>{if(!active()||!g.rerolls)return;for(const id of rerollMarked){const d=g.dice.find(x=>x.id===id);if(d&&!d.held&&!d.virtual)d.s=rollFace()}g.rerolls=0;picked=[];chosenCode='';rerollMarked.clear();updateStar();render()};
const outs=optionsNow();if(!chosenCode&&outs.length)chosenCode=outs[0].code;$('options').innerHTML=outs.length?outs.map(o=>`<button type="button" data-code="${esc(o.code)}" class="option ${chosenCode===o.code?'on':''}"><span class="pattern">${o.code||'—'}</span><span class="label">${esc(showLabel(o.eff))}</span><span class="detail">${esc(explain(o.eff))}</span></button>`).join(''):'<p class="sub small">ダイスを選ぶと、発動する効果を表示します。</p>';
document.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>{chosenCode=b.dataset.code;chosenTarget='';secondTarget='';keepTarget='';render()});const o=chosenOutcome();$('targetControl').innerHTML=o&&yours?controlsFor(o,selected()):'';const ta=$('targetA'),tb=$('targetB'),tk=$('targetKeep');if(ta){if(chosenTarget&&[...ta.options].some(x=>x.value===chosenTarget))ta.value=chosenTarget;chosenTarget=ta.value;ta.onchange=()=>{chosenTarget=ta.value;refreshOutcome()}}if(tb){if(secondTarget&&[...tb.options].some(x=>x.value===secondTarget))tb.value=secondTarget;else if(tb.options.length>1)tb.selectedIndex=1;secondTarget=tb.value;tb.onchange=()=>{secondTarget=tb.value;refreshOutcome()}}if(tk){if(keepTarget&&[...tk.options].some(x=>x.value===keepTarget))tk.value=keepTarget;keepTarget=tk.value;tk.onchange=()=>{keepTarget=tk.value}}refreshOutcome();$('clearBtn').disabled=!yours||!picked.length;$('confirmBtn').disabled=!yours||picked.length!==g.need;$('log').innerHTML=g.logs.slice(0,35).map(x=>`<div class="entry">${esc(x)}</div>`).join('')||'<div class="sub small">まだ行動がありません</div>';}
function commit(){if(!active()||picked.length!==g.need)return;const drawn=selected(),out=chosenOutcome(),sel=getSelection();const side=g.turn,log=execute(g,side,drawn,out,sel,g.dice);for(let i=log.length-1;i>=0;i--)note(log[i]);picked=[];if(g.winner!==null){render();showEnd()}else begin()}
function showEnd(){$('endTitle').textContent=`${sideName(g.winner)}の勝利`;const n=g.players[1-g.winner].hp;$('endDetail').textContent=`全${g.step}手番で決着。敗者の残りHP：${n}`;$('endScreen').hidden=false}
function heuristic(state,side){const own=state.players[side],foe=state.players[1-side];if(foe.hp<=0)return 100000;if(own.hp<=0)return -100000;const value=(p)=>p.hp*2.2+p.units.reduce((sum,u)=>{let v=7+u.hp*.7+u.atk*1.9;const lev=u.lv||0;if(u.type==='兵士')v+=lev>=2?3*lev:0;if(u.type==='盾兵')v+=lev>=2?13:0;if(u.type==='弓兵')v+=lev>=2?11:0;if(u.type==='騎兵')v+=lev>=2?10:0;if(u.type==='ドラゴン')v+=13;return sum+v},0)+(p.held?2:0)+p.delta*2+(p.extra?7:0)+(p.wild?9:0)+(p.reroll?4:0);return value(own)-value(foe)}
function cpuPick(){const all=choiceList();const side=g.turn;let best=null;for(const draw of all){const syms=draw.map(x=>x.s);for(const out of outcomes(syms,current().wild)){
const t=targets(out.eff,side,g);let sels=[{a:-1,b:-1,keep:''}];if(t&&t.items.length){sels=t.items.map(x=>({a:x.i,b:-1,keep:''}));if(t.twice)sels=t.items.flatMap(x=>t.items.filter(y=>y.i!==x.i).map(y=>({a:x.i,b:y.i,keep:''})))}if(out.eff[1]==='ダイスキープ'){const spent=new Set(draw.map(x=>x.spent));const rest=g.dice.filter(x=>!x.virtual&&!spent.has(x.id));sels=rest.length?rest.map(x=>({a:-1,b:-1,keep:x.id})):[{a:-1,b:-1,keep:''}]}
for(const sel of sels){const tmp=deep(g),log=execute(tmp,side,draw,out,sel,g.dice);let v=heuristic(tmp,side);if(tmp.winner!==null&&tmp.winner===side)v+=100000;v+=Math.random()*.1;if(best===null||v>best.v)best={v,draw,out,sel};}
}}
return best}
function cpuMove(){if(!g||g.winner!==null||g.mode!=='cpu'||g.turn===g.human)return;const p=current();if(g.rerolls){const baseline=cpuPick();const newly=g.dice.filter(x=>!x.virtual&&!x.held);const before=deep(g.dice);for(const d of newly)d.s=rollFace();updateStar();const after=cpuPick();if(after&&baseline&&after.v<baseline.v){g.dice=before;updateStar()}g.rerolls=0}const pick=cpuPick();if(!pick){note('CPUの行動候補がありません');return}const drawn=pick.draw.map(x=>g.dice.find(d=>d.id===x.id)).filter(Boolean);const log=execute(g,g.turn,drawn,pick.out,pick.sel,g.dice);for(let i=log.length-1;i>=0;i--)note(log[i]);if(g.winner!==null){render();showEnd()}else begin()}
function renderRules(){const summary=`<p>各ターン、6面ダイス（○○××△□）3個から1記号を選び、共有の記号列に追加します。直近3記号で効果を判定。開始時も先後交互に1記号ずつ置き、先攻3手番目から発動します。</p><p>同一記号3連続は効果なし。ダイスのうち新規に振った3個以上が同じ出目の場合、1個の代わりに☆を選べます。☆が最後ならドラゴン召喚、1・2記号目ならワイルドカードです。</p><p>ユニットは召喚順に左から攻撃（召喚した手番は攻撃しません）。通常は敵の左端を攻撃し、敵がいなければプレイヤーを攻撃します。プレイヤーHPは40。</p><p>兵士Lv2：味方兵士が他にいれば攻撃+2。Lv3：味方兵士の人数だけ攻撃追加。盾兵Lv2：プレイヤーへの攻撃をかばう。Lv3：左隣に一度だけ頑丈を付与。弓兵Lv2：プレイヤーを直接狙撃。Lv3：加えて敵全体に2ダメージ。騎兵Lv2：残りHPの少ない敵を攻撃。Lv3：撃破時に1回追撃。ドラゴン：攻10/HP30、召喚時に敵全体へ4ダメージ。</p><p>暫定処理：盾兵Lv3の頑丈は召喚・昇格時に付与、騎兵の追撃は各手番1回、デバフは攻撃0を下限としています。先後のダイス補正は未採用です。</p>`;$('rulesText').innerHTML=summary;const entries=Object.entries(T).sort(([a],[b])=>{const score=s=>2*('△□'.includes(s[0]))+1*('△□'.includes(s[1]))+4*('△□'.includes(s[2]));return score(a)-score(b)||a.localeCompare(b)});$('ruleTable').innerHTML='<table><thead><tr><th>記号</th><th>点</th><th>効果</th></tr></thead><tbody>'+entries.map(([code,e])=>`<tr><td>${code}</td><td>${2*('△□'.includes(code[0]))+1*('△□'.includes(code[1]))+4*('△□'.includes(code[2]))}</td><td>${esc(showLabel(e))}</td></tr>`).join('')+'</tbody></table>'}
$('twoPlayer').onclick=()=>play('local');$('cpuGame').onclick=()=>play('cpu');$('clearBtn').onclick=()=>{picked=[];chosenCode='';render()};$('confirmBtn').onclick=commit;$('againBtn').onclick=()=>play(g.mode);$('toStartBtn').onclick=()=>{$('endScreen').hidden=true;$('startScreen').hidden=false};$('homeBtn').onclick=()=>{if(g&&g.winner===null&&!confirm('対戦を終了してタイトルに戻りますか？'))return;clearTimeout(cpuTimer);$('startScreen').hidden=false};$('helpBtn').onclick=()=>{$('rules').open=!$('rules').open;$('rules').scrollIntoView({block:'nearest',behavior:'smooth'})};renderRules();
// 診断用（ゲーム動作に影響しない）
window.symbolSummonDebug=()=>g?deep(g):null;
