};
const HOW=['刃物','絞殺','毒物'];const WHO=['執事','庭師','料理人'];const LIMIT=4;
const app=document.getElementById('app');let stage='start',s=null,lastSelections=null;
const E=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const modeName=m=>m==='alternate'?'差替版':'元版';
const lookup=(id,mode)=>{const d=DATA[id].versions[mode];return d.ids.map((cid,i)=>({id:cid,loc:LOCATION[i],kind:CARDS[cid][0],text:CARDS[cid][1],true:!d.false.includes(cid),related:!d.unused.includes(cid),meaning:d.notes[i]}))};
const alias=id=>'事件 '+id;
const scrollTop=()=>{window.scrollTo({top:0,behavior:'instant'})};
function startScreen(){const list=Array.from({length:7},(_,i)=>String(i+1).padStart(2,'0'));app.innerHTML=`<section class="intro"><div><div class="caption">ARCHIVE 00 / AN UNSOLVED DEATH</div><h1 class="lead">真相は、<br>すべて見えるとは限らない。</h1><p class="desc">屋敷の主人が書斎で亡くなった。残された痕跡、曖昧な目撃談、関係者の証言。あなたが確かめられるのは、7か所のうち4か所までです。</p><p class="desc">必要な情報が集まらなくても、調査を終えて推理できます。犯人・方法・現場をそれぞれ判断してください。</p><div class="three"><span class="chip">7つの調査場所</span><span class="chip">最大4枚の情報</span><span class="chip">3つの推理</span></div></div><div class="intro-art" aria-hidden="true"><div class="diagonal"></div><svg viewBox="0 0 200 200" fill="none"><path d="M100 19 L165 60 L154 143 L100 182 L46 143 L35 60Z" stroke="#d9b777" stroke-width="1.7"/><path d="M100 19 V182 M35 60 L165 60 M46 143 L154 143 M35 60 L154 143 M165 60 L46 143" stroke="#739b91" stroke-width="1" opacity=".54"/><circle cx="100" cy="100" r="38" stroke="#d9b777"/><circle cx="100" cy="100" r="5" fill="#d9b777"/><path d="M100 72 V128 M72 100 H128" stroke="#d9b777" stroke-width="1"/><circle cx="100" cy="19" r="4" fill="#d9b777"/><circle cx="165" cy="60" r="4" fill="#d9b777"/><circle cx="154" cy="143" r="4" fill="#d9b777"/><circle cx="46" cy="143" r="4" fill="#d9b777"/><circle cx="35" cy="60" r="4" fill="#d9b777"/></svg><div class="ghost-text">THE SEVEN ROOMS</div></div></section><section class="setup panel"><div class="panel-head"><h2>事件ファイルを開く</h2><span class="small">SESSION SETUP</span></div><div class="setup-fields"><div><label class="label" for="caseSelect">事件</label><select class="select" id="caseSelect"><option value="random">ランダムに選ぶ</option>${list.map(id=>`<option value="${id}">事件 ${id}</option>`).join('')}</select></div><div><label class="label" for="modeSelect">カード構成</label><select class="select" id="modeSelect"><option value="alternate">差替版（本人証言あり）</option><option value="original">元版</option></select></div><button id="startBtn" class="btn btn-primary">調査を開始 →</button></div><div class="setup-note">調査地点にあるカードは固定の仮配置です。事件やカードの真相は回答後まで表示しません。比較の際は同じ事件を選んでカード構成を切り替えてください。</div></section>`;document.getElementById('startBtn').addEventListener('click',()=>startCase(document.getElementById('caseSelect').value,document.getElementById('modeSelect').value));}
function startCase(id,mode){if(id==='random')id=String(Math.floor(Math.random()*7)+1).padStart(2,'0');s={id,mode,found:[],answers:{who:null,how:null,where:null},stage:'investigate'};stage='investigate';render();scrollTop()}
function publicInfo(){return `<div class="info-row"><div class="info-box"><div class="caption">発見報告</div><div class="line"><strong>被害者：</strong>屋敷の主人</div><div class="line"><strong>遺体発見：</strong>22時30分・書斎</div><div class="small">発見された場所が殺害現場とは限りません。</div></div><div class="info-box"><div class="caption">関係者の申告（初期公開情報）</div><div class="line"><strong>執事：</strong>21:00〜21:30は厨房</div><div class="line"><strong>庭師：</strong>21:00〜21:30は庭</div><div class="line"><strong>料理人：</strong>21:00〜21:30は厨房</div><div class="small">本人の申告です。真偽は分かりません。</div></div></div>`}
function stageHead(){return `<div class="game-top"><div><div class="caption">CASE RECORD / ${E(s.id)}</div><div class="game-id">屋敷の主人の死 <span>${modeName(s.mode)}・${s.found.length} / ${LIMIT}枚を確認</span></div></div><button class="btn btn-quiet" id="toStart" type="button">事件選択に戻る</button></div>`}
function mapHtml(){const lines=EDGES.map(([a,b])=>{const p=POS[a],q=POS[b];return `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}"></line>`}).join('');return `<section class="map-panel panel"><div class="panel-head"><h2>屋敷の見取り図</h2><span class="small">選択して調査</span></div><div class="map-wrap"><svg class="map-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>${LOCATION.map(loc=>{const x=POS[loc],seen=s.found.includes(loc),closed=s.found.length>=LIMIT&&!seen;return `<button type="button" class="room ${seen?'seen':closed?'closed':''}" data-room="${loc}" style="--x:${x[0]}%;--y:${x[1]}%" ${seen||closed?'disabled':''} aria-label="${loc} ${seen?'調査済み':closed?'調査回数の上限':'調査する'}"><span class="room-icon" aria-hidden="true">${ICONS[loc]}</span><span class="room-name">${loc}</span><span class="room-state">${seen?'調査済み':closed?'未調査':'調べる'}</span></button>`}).join('')}</div><p class="hint">位置関係は仮の見取り図です。どこでも調べられます。カードの内容が必ず取得地点を指すとは限りません。</p></section>`}
function evidenceCard(record,seq){return `<article class="evidence"><div class="evidence-top"><span>NO. ${String(seq).padStart(2,'0')} <span style="color:var(--sub)">/ ${E(record.kind)}</span></span><span>${E(record.loc)}で取得</span></div><p class="evidence-body">${E(record.text)}</p></article>`}
function journalHtml(){const mine=lookup(s.id,s.mode);const found=s.found.map(loc=>mine[LOCATION.indexOf(loc)]);return `<aside class="journal panel"><div class="panel-head"><h2>調査記録</h2><span class="small">EVIDENCE / ${found.length} OF ${LIMIT}</span></div><div class="journal-body" id="journalBody">${found.length?found.map((v,i)=>evidenceCard(v,i+1)).join(''):'<div class="journal-empty"><div><div class="empty-figure" aria-hidden="true">◇</div>まだ情報がありません。<br>見取り図の場所を選んでください。</div></div>'}</div><div class="journal-foot"><div class="small">調査した地点 ${found.length} / ${LIMIT}</div><div class="meter" aria-label="調査可能回数の消費 ${found.length}/${LIMIT}">${Array.from({length:LIMIT},(_,i)=>`<span class="${i<found.length?'filled':''}"></span>`).join('')}</div></div></aside>`}
function investigate(){app.innerHTML=stageHead()+publicInfo()+`<div class="board">${mapHtml()}${journalHtml()}</div><div class="actions"><span class="summary">${s.found.length>=LIMIT?'調査回数を使い切りました。':'情報が不足していても、いつでも推理に進めます。'}</span><div class="action-right"><button class="btn btn-secondary" type="button" id="restart">同じ事件をやり直す</button><button class="btn btn-primary" type="button" id="goDeduce">推理する →</button></div></div>`;bindCommon();document.querySelectorAll('[data-room]').forEach(btn=>btn.addEventListener('click',()=>{const loc=btn.dataset.room;if(s.found.includes(loc)||s.found.length>=LIMIT)return;s.found.push(loc);render();const journal=document.getElementById('journalBody');if(journal&&window.innerWidth<921)journal.scrollIntoView({behavior:'smooth',block:'nearest'});}));document.getElementById('restart').addEventListener('click',()=>startCase(s.id,s.mode));document.getElementById('goDeduce').addEventListener('click',()=>{stage='deduce';render();scrollTop()})}
function question(key,order,title,options){return `<div class="query"><h3><span class="number">${order}</span>${title}</h3><div class="choices" role="group" aria-label="${title}">${options.map(t=>`<button class="choice" type="button" data-answer="${key}" data-value="${E(t)}" aria-pressed="${s.answers[key]===t}">${E(t)}</button>`).join('')}</div></div>`}
function deduce(){app.innerHTML=stageHead()+publicInfo()+`<section class="deduction panel"><div class="caption">FINAL DEDUCTION</div><h2>事件の真相を推理する</h2><p class="desc">確認できた ${s.found.length}枚の情報と、初期公開情報から答えてください。3つの質問は独立して採点します。</p><div class="review">${s.found.length?`確認した情報：${s.found.map(loc=>E(loc)).join('・')}`:'情報はまだ1枚も確認していません。初期公開情報だけで回答できます。'}</div>${question('who','01','犯人は誰か',WHO)}${question('how','02','殺害方法は何か',HOW)}${question('where','03','犯行現場はどこか',LOCATION)}<div class="actions" style="margin-bottom:0"><button class="btn btn-quiet" id="backExplore">調査に戻る</button><div class="action-right"><button class="btn btn-primary" id="submit" ${Object.values(s.answers).every(Boolean)?'':'disabled'}>回答を確定 →</button></div></div></section>`;bindCommon();document.getElementById('backExplore').addEventListener('click',()=>{stage='investigate';render();scrollTop()});document.querySelectorAll('[data-answer]').forEach(btn=>btn.addEventListener('click',()=>{s.answers[btn.dataset.answer]=btn.dataset.value;render();}));document.getElementById('submit').addEventListener('click',()=>{if(!Object.values(s.answers).every(Boolean))return;stage='result';lastSelections=[...s.found];render();scrollTop()})}
function compareHtml(){const thisVer=lookup(s.id,s.mode),otherVer=lookup(s.id,s.mode==='original'?'alternate':'original');return `<details class="details"><summary>同じ事件の「${s.mode==='original'?'差替版':'元版'}」と比較する</summary><div class="details-body"><p class="small">回答後のため、別バージョンのカード内容を表示します。どちらも正解となる犯人・方法・現場は同じです。</p><div class="truth-grid">${LOCATION.map((loc,i)=>{const a=thisVer[i],b=otherVer[i],same=a.id===b.id;return `<article class="truth-card"><div class="byline">${loc} ${same?'・同じカード':'・差替えあり'}</div><div><strong>${modeName(s.mode)}：</strong>${E(a.text)}</div><div style="border-top:1px solid var(--line);margin-top:9px;padding-top:9px"><strong>${s.mode==='original'?'差替版':'元版'}：</strong>${E(b.text)}</div></article>`}).join('')}</div></div></details>`}
function result(){const d=DATA[s.id],v=lookup(s.id,s.mode),values=[['who','犯人',d.who],['how','殺害方法',d.how],['where','犯行現場',d.where]];const points=values.filter(([k,_,answer])=>s.answers[k]===answer).length;let grade=points===3?'3問すべて正解':points===2?'2問正解':points===1?'1問正解':'正解なし';app.innerHTML=stageHead()+`<section class="deduction panel" style="max-width:960px"><div class="result-head"><div><div class="caption">CASE CLOSED · ${E(s.id)}</div><h2 style="font-size:29px;margin:7px 0 0">${grade}</h2><div class="small">${s.found.length} / ${LIMIT}枚の情報をもとに推理</div></div><div class="score">${points}<small> / 3</small></div></div><div class="result-answer">${values.map(([key,title,truth])=>{const ok=s.answers[key]===truth;return `<div class="answer-tile"><div class="line">${title}</div><strong>${E(truth)}</strong><div class="status ${ok?'good':''}">${ok?'正解':'不正解：あなたの回答 '+E(s.answers[key])}</div></div>`}).join('')}</div><div class="caption">事件の真相</div><div class="truth">${E(d.story)}${s.mode==='alternate'&&s.id==='02'?'<p>差替版では、書斎の椅子と飲みかけのグラスも事件に関係しています。</p>':''}${s.mode==='alternate'&&s.id==='06'?'<p>差替版では、庭師の袖口の赤い汚れは返り血です。</p>':''}</div><details class="details"><summary>情報カード7枚の本当の意味と真偽</summary><div class="details-body"><div class="truth-grid">${v.map(t=>{const collected=s.found.includes(t.loc);return `<article class="truth-card"><div class="byline">${E(t.loc)} / ${collected?'取得したカード':'未取得カード'} / ${E(t.id)}</div><div style="display:flex;gap:7px;align-items:start;justify-content:space-between"><div>${E(t.text)}</div><span class="flag ${t.true?'':'false'}">${t.true?'内容は真':'内容は偽'}</span></div><div class="explain">${E(t.meaning)} ${t.related?'':'（事件とは無関係）'}</div></article>`}).join('')}</div></div></details>${compareHtml()}<div class="result-buttons"><button class="btn btn-primary" id="switchMode">同じ事件の${s.mode==='original'?'差替版':'元版'}を遊ぶ →</button><button class="btn btn-secondary" id="playAgain">別の事件を調査する</button><button class="btn btn-quiet" id="sameCase">同じ条件で再挑戦</button></div></section>`;bindCommon();document.getElementById('switchMode').addEventListener('click',()=>startCase(s.id,s.mode==='original'?'alternate':'original'));document.getElementById('playAgain').addEventListener('click',()=>startCase('random',s.mode));document.getElementById('sameCase').addEventListener('click',()=>startCase(s.id,s.mode))}
function bindCommon(){const b=document.getElementById('toStart');if(b)b.addEventListener('click',()=>{stage='start';s=null;render();scrollTop()})}
function render(){if(stage==='start')return startScreen();if(stage==='investigate')return investigate();if(stage==='deduce')return deduce();return result()}
render();
</script></body></html>
