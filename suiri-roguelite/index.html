/* 能力選択と調査補助（v0.2） */
.setup-fields{grid-template-columns:1fr 1fr 1.2fr auto}

.room.sensed .room-state{color:#ffe5a8;font-weight:800}

function stageHead(){return `<div class="game-top"><div><div class="caption">事件 ${run.progress+(stage==='result'&&s.lastScore===3?0:1)} / 7</div><div class="game-id">屋敷の主人の死 <span>調査${s.found.length}/${maxInvestigations()}・能力 ${run.abilities.length?run.abilities.map(k=>E(ABILITIES[k].name)).join('・'):'未取得'}</span></div></div><button class="btn btn-quiet" id="toStart" type="button">周回を終了</button></div>${trustBar()}`;}
function trustBar(){return `<section class="trust-panel" aria-label="信頼${run.trust}/${TRUST_MAX}"><div class="trust-head"><strong>信頼 ${run.trust} / ${TRUST_MAX}</strong><span>${run.progress}件解決 · 次の能力解放 ${!run.firstUnlocked?UNLOCK_FIRST:run.abilities.length<3?UNLOCK_ALL:'全能力取得済み'}</span></div><div class="trust-track"><div style="width:${(run.trust/TRUST_MAX)*100}%;background:${run.trust<=UNLOCK_ALL?'#db8d84':run.trust<=UNLOCK_FIRST?'#d9b777':'#8dcbc3'}"></div></div></section>`;}
function mapHtml(){const lines=EDGES.map(([a,b])=>{const p=POS[a],q=POS[b];return `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}"></line>`}).join('');const active=senseActive(),levels=active?new Map(remainingRelated().map(v=>[v.loc,v.level])):new Map();return `<section class="map-panel panel"><div class="panel-head"><h2>屋敷の見取り図</h2><span class="small">${active?'最後の手掛かりを表示中':'場所を選んで調査'}</span></div><div class="map-wrap"><svg class="map-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>${LOCATION.map(loc=>{const x=POS[loc],seen=s.found.includes(loc),closed=s.found.length>=maxInvestigations()&&!seen,level=levels.get(loc)||0;return `<button type="button" class="room ${seen?'seen':closed?'closed':''} ${active&&level?'sensed lev'+level:''}" data-room="${loc}" style="--x:${x[0]}%;--y:${x[1]}%" ${seen||closed?'disabled':''} aria-label="${loc} ${seen?'調査済み':closed?'未調査':active?level?'関連度'+level:'関連情報なし':'調査する'}"><span class="room-icon" aria-hidden="true">${ICONS[loc]}</span><span class="room-name">${loc}</span><span class="room-state">${seen?'調査済み':closed?'未調査':active?level?'関連度 '+level:'関連なし':'調べる'}</span></button>`}).join('')}</div><p class="hint">発見場所と、手掛かりが示す場所は一致するとは限りません。</p></section>`;}
function evidenceCard(record,seq,readOnly=false){const diagnosed=s.diagnosed?.loc===record.loc;const result=diagnosed?`<span class="diag-state level-${record.level}">関連レベル ${record.level} / 3 · ${LEVEL_NAME[record.level]}</span>`:'';const btn=!readOnly&&run.abilities.includes('diagnose')&&!s.diagnosed?`<button type="button" class="btn btn-secondary" data-diagnose="${E(record.loc)}">関連度を判定</button>`:'';return `<article class="evidence"><div class="evidence-top"><span>NO. ${String(seq).padStart(2,'0')} <span style="color:var(--sub)">/ ${E(record.kind)}</span></span><span>${E(record.loc)}で取得</span></div><p class="evidence-body">${E(record.text)}</p>${result||btn?`<div class="diag-ctrl">${result}${btn}</div>`:''}</article>`;}
function journalHtml(readOnly=false){const mine=lookup(s.id,s.mode);const found=s.found.map(loc=>mine[LOCATION.indexOf(loc)]),limit=maxInvestigations();return `<aside class="journal panel"><div class="panel-head"><h2>調査記録</h2><span class="small">${found.length} / ${limit}枚</span></div><div class="journal-body" id="journalBody">${found.length?found.map((v,i)=>evidenceCard(v,i+1,readOnly)).join(''):'<div class="journal-empty"><div><div class="empty-figure" aria-hidden="true">◇</div>まだ情報がありません。<br>見取り図の場所を選んでください。</div></div>'}</div><div class="journal-foot"><div class="small">調査した地点 ${found.length} / ${limit}</div><div class="meter" aria-label="調査可能回数の消費 ${found.length}/${limit}">${Array.from({length:limit},(_,i)=>`<span class="${i<found.length?'filled':''}"></span>`).join('')}</div></div></aside>`}

function abilityPanel(){if(!run.abilities.length)return '<section class="ability-panel"><div class="ability-title">能力：未取得</div><p class="ability-description">推理に失敗すると信頼が減少し、段階的に能力が解放されます。</p></section>';let out=run.abilities.map(k=>{let desc='';if(k==='extra')desc='調査できる地点が4→5か所に増えます。';if(k==='diagnose')desc=s.diagnosed?`判定済み：${E(s.diagnosed.loc)}は関連レベル${s.diagnosed.level}`:'取得済みカードを1枚選んで関連レベルを判定できます。';if(k==='sense')desc=senseActive()?`未取得の関連カードのレベルを表示中。`:s.found.length>=maxInvestigations()?'この事件の調査は終了しています。':'最後の調査先を選ぶ時に未取得カードの関連レベルを表示します。';return `<div class="ability-skill"><b>${E(ABILITIES[k].name)}</b><span>${desc}</span></div>`}).join('');return `<section class="ability-panel" aria-live="polite"><div class="ability-title">獲得済みの能力</div>${out}</section>`;}
function investigate(){app.innerHTML=stageHead()+publicInfo()+abilityPanel()+`<div class="board">${mapHtml()}${journalHtml()}</div><div class="actions"><span class="summary">${s.found.length>=maxInvestigations()?'調査枠はすべて使用しました。':'推理にはいつでも移行できます。'}</span><div class="action-right"><button class="btn btn-secondary" id="restart">周回を最初から</button><button class="btn btn-primary" id="goDeduce">推理する →</button></div></div>`;bindCommon();document.querySelectorAll('[data-room]').forEach(btn=>btn.addEventListener('click',()=>{const loc=btn.dataset.room;if(s.found.includes(loc)||s.found.length>=maxInvestigations())return;s.found.push(loc);render();const journal=document.getElementById('journalBody');if(journal&&window.innerWidth<921)journal.scrollIntoView({behavior:'smooth',block:'nearest'});}));document.querySelectorAll('[data-diagnose]').forEach(btn=>btn.addEventListener('click',()=>{if(!run.abilities.includes('diagnose')||s.diagnosed)return;const loc=btn.dataset.diagnose;if(!s.found.includes(loc))return;const record=lookup(s.id,s.mode).find(v=>v.loc===loc);if(!record)return;s.diagnosed={loc,level:record.level};render();}));document.getElementById('restart').addEventListener('click',()=>startRun(s.id,s.mode));document.getElementById('goDeduce').addEventListener('click',()=>{stage='deduce';render();scrollTop()});}
function question(key,order,title,options){return `<div class="query"><h3><span class="number">${order}</span>${title}</h3><div class="choices" role="group" aria-label="${title}">${options.map(t=>`<button class="choice" type="button" data-answer="${key}" data-value="${E(t)}" aria-pressed="${s.answers[key]===t}">${E(t)}</button>`).join('')}</div></div>`}
function deduce(){app.innerHTML=stageHead()+publicInfo()+`<section class="deduction panel"><div class="caption">推理 ${s.attempts+1}回目</div><h2>事件の真相を推理する</h2><p class="desc">正答数だけを発表します。どの項目が正しいかは伏せ、誤答の数だけ信頼を失います。3問すべて正解で次の事件に進めます。</p><div class="case-review">${journalHtml(true)}</div>${question('who','01','犯人は誰か',WHO)}${question('how','02','殺害方法は何か',HOW)}${question('where','03','犯行現場はどこか',LOCATION)}<div class="actions" style="margin-bottom:0"><button class="btn btn-quiet" id="backExplore">調査に戻る</button><div class="action-right"><button class="btn btn-primary" id="submit" ${Object.values(s.answers).every(Boolean)?'':'disabled'}>推理を提出 →</button></div></div></section>`;bindCommon();document.getElementById('backExplore').addEventListener('click',()=>{stage='investigate';render();scrollTop()});document.querySelectorAll('[data-answer]').forEach(btn=>btn.addEventListener('click',()=>{s.answers[btn.dataset.answer]=btn.dataset.value;render();}));document.getElementById('submit').addEventListener('click',submitAttempt);}
function compareHtml(){const thisVer=lookup(s.id,s.mode),otherVer=lookup(s.id,s.mode==='original'?'alternate':'original');return `<details class="details"><summary>同じ事件の「${s.mode==='original'?'差替版':'元版'}」と比較する</summary><div class="details-body"><p class="small">回答後のため、別バージョンのカード内容を表示します。どちらも正解となる犯人・方法・現場は同じです。</p><div class="truth-grid">${LOCATION.map((loc,i)=>{const a=thisVer[i],b=otherVer[i],same=a.id===b.id;return `<article class="truth-card"><div class="byline">${loc} ${same?'・同じカード':'・差替えあり'}</div><div><strong>${modeName(s.mode)}：</strong>${E(a.text)}</div><div style="border-top:1px solid var(--line);margin-top:9px;padding-top:9px"><strong>${s.mode==='original'?'差替版':'元版'}：</strong>${E(b.text)}</div></article>`}).join('')}</div></div></details>`}
function feedback(){const choice=run.pendingSkill?`<section class="rescue-panel"><h3>救済能力を1つ選択</h3><p>信頼${UNLOCK_FIRST}以下で初めての能力が解放されました。能力を選ぶと、今回の事件で1枚追加調査できます。能力は次の事件にも持ち越します。</p><div class="rescue-options">${['extra','diagnose','sense'].map(k=>`<button type="button" class="btn btn-secondary" data-skill="${k}">${E(ABILITIES[k].name)}</button>`).join('')}</div></section>`:run.trust<=UNLOCK_ALL?'<p class="crisis">信頼が残り少なくなったため、3能力すべてが解放され、1枚追加調査できます。</p>':'';
app.innerHTML=stageHead()+`<section class="deduction panel"><div class="caption">推理結果</div><h2>正答数：${s.lastScore} / 3</h2><p class="desc">どの回答が正しかったかは、まだ分かりません。集めた情報を見返して推理できます。</p><div class="loss-detail">今回の不正解 ${s.lastLoss}問・信頼 −${s.lastLoss}・残り信頼 <b>${run.trust}/${TRUST_MAX}</b></div>${choice}<div class="case-review">${journalHtml(true)}</div><div class="actions"><button class="btn btn-secondary" id="backExplore" ${run.pendingSkill?'disabled':''}>追加調査へ</button><button class="btn btn-primary" id="tryAgain" ${run.pendingSkill?'disabled':''}>回答を修正する →</button></div></section>`;bindCommon();document.querySelectorAll('[data-skill]').forEach(btn=>btn.addEventListener('click',()=>chooseRescue(btn.dataset.skill)));document.getElementById('backExplore').addEventListener('click',()=>{if(run.pendingSkill)return;stage='investigate';render();scrollTop()});document.getElementById('tryAgain').addEventListener('click',()=>{if(run.pendingSkill)return;stage='deduce';render();scrollTop()});}
function result(){const d=DATA[s.id],v=lookup(s.id,s.mode),won=s.lastScore===3;const labels=[['who','犯人',d.who],['how','殺害方法',d.how],['where','犯行現場',d.where]];app.innerHTML=stageHead()+`<section class="deduction panel" style="max-width:960px"><div class="result-head"><div><div class="caption">捜査結果</div><h2 style="font-size:29px;margin:7px 0 0">${won?'事件解決':'信頼が尽きました'}</h2><div class="small">解決済み ${run.progress}/7件 · 今回の提出${s.attempts}回 · 信頼${run.trust}/${TRUST_MAX}</div></div><div class="score">${s.lastScore}<small> / 3</small></div></div><div class="result-answer">${labels.map(([k,title,truth])=>`<div class="answer-tile"><div class="line">${title}</div><strong>${E(truth)}</strong><div class="status ${s.answers[k]===truth?'good':''}">${s.answers[k]===truth?'正解':'あなたの回答：'+E(s.answers[k])}</div></div>`).join('')}</div><div class="caption">今回の事件の真相</div><div class="truth">${E(d.story)}</div><details class="details"><summary>情報カードの本当の意味・関連度・真偽</summary><div class="details-body"><div class="truth-grid">${v.map(t=>`<article class="truth-card"><div class="byline">${E(t.loc)} / ${s.found.includes(t.loc)?'取得済み':'未取得'} / ${E(t.id)}</div><div>${E(t.text)} <span class="flag ${t.true?'':'false'}">${t.true?'内容は真':'内容は偽'}</span></div><div class="explain">関連度${t.level}/3・${E(t.meaning)}</div></article>`).join('')}</div></div></details><div class="result-buttons"><button class="btn btn-primary" id="continueRun">${won?'次の事件へ進む →':'今回の周回結果を見る →'}</button><button class="btn btn-quiet" id="toNewRun">新しい周回を始める</button></div></section>`;bindCommon();document.getElementById('continueRun').addEventListener('click',()=>{if(won)nextCase();else{stage='runEnd';render();scrollTop();}});document.getElementById('toNewRun').addEventListener('click',()=>{stage='start';run=null;s=null;render();scrollTop()});}
function runEnd(){const success=run.progress===7;app.innerHTML=`<section class="deduction panel" style="max-width:850px"><div class="caption">捜査記録</div><h1>${success?'7事件すべて解決':'捜査終了'}</h1><p class="desc">解決：${run.progress}/7事件　残り信頼：${run.trust}/${TRUST_MAX}　獲得能力：${run.abilities.length?run.abilities.map(x=>E(ABILITIES[x].name)).join('・'):'なし'}</p><div class="truth">${success?'7事件を連続で解決しました。':'信頼が0になり、これ以上の捜査を続けられません。'}</div><button class="btn btn-primary" id="newRun">新しい周回を始める →</button></section>`;document.getElementById('newRun').addEventListener('click',()=>{run=null;s=null;stage='start';render();scrollTop()});}
function bindCommon(){const b=document.getElementById('toStart');if(b)b.addEventListener('click',()=>{if(!confirm('現在の周回を終了して事件選択画面に戻りますか？'))return;run=null;s=null;stage='start';render();scrollTop()});}
function render(){if(stage==='start')return startScreen();if(stage==='investigate')return investigate();if(stage==='deduce')return deduce();if(stage==='feedback')return feedback();if(stage==='result')return result();return runEnd();}
render();
</script></body></html>
