const TIMING={firstRoll:180,rollGap:300,step:430,preview:650};

let G=null,UI={kind:"none"},seq=0,combatTapArm=0;
const ri=n=>Math.floor(Math.random()*n);
const choice=a=>a[ri(a.length)];
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=ri(i+1);[b[i],b[j]]=[b[j],b[i]]}return b};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const finite=(n,fallback=0)=>{const v=Number(n);return Number.isFinite(v)?v:fallback};
const floor=x=>Math.floor(finite(x,0)+1e-9);
const fmt=n=>{n=finite(n,0);return Number.isInteger(n)?String(n):n.toFixed(1).replace(/\.0$/,'')};
function normalizeCombatHp(C){if(!C)return;const fallbackMax=Math.max(1,finite(G?.maxHp,60));C.playerMax=Math.max(1,finite(C.playerMax,fallbackMax));C.playerHp=clamp(finite(C.playerHp,finite(G?.hp,C.playerMax)),0,C.playerMax);if(C.enemy){C.enemy.maxHp=Math.max(1,finite(C.enemy.maxHp,finite(C.enemy.hp,1)));C.enemy.hp=clamp(finite(C.enemy.hp,C.enemy.maxHp),0,C.enemy.maxHp)}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function sampleWithoutReplacement(n,k){const a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>=n-k;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]]}return a.slice(n-k)}
function weightedWithoutReplacement(items,k){const pool=items.map(x=>({...x})),out=[];while(out.length<k&&pool.length){const total=pool.reduce((s,x)=>s+x.w,0),r=Math.random()*total;let a=0,i=0;for(;i<pool.length;i++){a+=pool[i].w;if(r<a)break}out.push(pool[Math.min(i,pool.length-1)].key);pool.splice(Math.min(i,pool.length-1),1)}return out}
// Keep fractional intermediates; round once when an effect amount, duration, count, or price is finalized.
function paramRaw(type,param,lv){const p=PARAMS[type]?.[param];return p?p[0]+p[1]*Math.max(1,lv):0}

  lv=Math.max(1,lv);

  const primary={attack:"damage",multi:"damagePerHit",execute:"damage",pierce:"damage",bleed_attack:"damage",heavy:"damage",curse_blade:"lvDamage",defense:"defense",reflect:"defense",barricade:"defense",heal:"heal",cleanse_heal:"heal",attack_support:"lvAdd",defense_support:"lvAdd"}[type];
  if(!primary)return 0;

}
function curseArmorGain(lv,ruinLv=ruin()){return floor(paramRaw("curse_armor","lvMaxHp",lv)+ruinLv*paramRaw("curse_armor","ruinAddRatePct",lv)/100)}
function rolledFaceValue(r){return faceBaseValue(r.type,r.level)+(r.basicAwakened&&(r.type==="attack"||r.type==="defense")?1+Math.max(1,r.level):0)}
function faceDisplayValue(f){const lv=Math.max(1,f.level),r=ruin();
  if(["attack","growth_attack","heavy","execute","pierce","bleed_attack","curse_blade","defense","reflect","barricade","heal","cleanse_heal"].includes(f.type))return fmt(faceBaseValue(f.type,lv,r)+(f.basicAwakened&&(f.type==="attack"||f.type==="defense")?1+lv:0));

  if(f.type==="regen")return `${paramValue("regen","healPerTurn",lv)}/T`;
  if(f.type==="weaken_apply")return `${paramValue("weaken_apply","duration",lv)}`;
  if(f.type==="enfeeble_apply")return `${paramValue("enfeeble_apply","duration",lv)}`; 
  if(f.type==="attack_support"||f.type==="defense_support")return `+${faceBaseValue(f.type,lv,r)}Lv`;
  if(f.type==="interfere")return `-${paramValue("interfere","enemyLvDown",lv)}Lv`;
  if(f.type==="amplify")return `+${lv}Lv`;
  if(f.type==="poison_apply")return `3×${paramValue("poison_apply","duration",lv)}T`;
  if(f.type==="debuff_extend")return `+${paramValue("debuff_extend","turnsAdd",lv)}`;

  if(f.type==="vulnerable")return `${paramValue("vulnerable","duration",lv)}`;

function faceDisplayHtml(f){const raw=faceDisplayValue(f);return raw.replace(/(\d)×(?=\d)/g,`$1<span class="valueTimes">×</span>`).replace(/^([+\-])/,`<span class="valueSign">$1</span>`).replace(/(Lv|HP|T)$/,'<span class="valueUnit">$1</span>')}
function enemyFaceDisplayHtml(f){const raw=faceDisplayValue(f).replace(/回$/,"" );return raw.replace(/(\d)×(?=\d)/g,`$1<span class="valueTimes">×</span>`).replace(/^([+\-])/,`<span class="valueSign">$1</span>`).replace(/(Lv|HP|T)$/,'<span class="valueUnit">$1</span>')}
function makeFace(type,level=1,extra={}){return {type,level,...extra}}
function initialDice(){const d=[];for(let i=0;i<3;i++)d.push(Array.from({length:6},()=>makeFace("attack")));for(let i=0;i<2;i++)d.push(Array.from({length:6},()=>makeFace("defense")));d.push(Array.from({length:6},()=>makeFace("defense_support")));return d}
function allFaces(){const a=[];G.dice.forEach((d,di)=>d.forEach((f,fi)=>a.push({di,fi,f,key:`${di}:${fi}`})));return a}
function parseFaceKey(k){return k.split(":").map(Number)}
function normalFaces(attr=null){return allFaces().filter(x=>!CURSES.has(x.f.type)&&x.f.type!=="empty"&&(!attr||faceAttr(x.f.type)===attr))}
function curseFaces(){return allFaces().filter(x=>CURSES.has(x.f.type))}
function ruin(){return G?curseFaces().reduce((s,x)=>s+Math.max(1,x.f.level),0):0}
function campaignMaxHp(){return 60+ruin()}
function syncCampaignHp(oldMax){const nm=campaignMaxHp(),delta=nm-oldMax;if(delta>0)G.hp=Math.min(nm,G.hp+delta);else if(G.hp>nm)G.hp=nm;G.maxHp=nm}
function addLog(t){G.log.unshift(t);G.log=G.log.slice(0,80)}
// Shared by the playable game and runner. Sheet face order / priority / PARAMS are data.
const CombatCore=(()=>{
  const order={attack:6,defense:5,support:4,curse:3,empty:6};
  const definitions={
    amplify:{order:1,priority:3,action:'boost',target:'all',amount:'lvAdd'},
    cleanse_heal:{order:2,priority:2,action:'cleanse'},
    attack_support:{action:'boost',target:'attack',amount:'lvAdd'},
    defense_support:{action:'boost',target:'defense',amount:'lvAdd'},
    interfere:{action:'interfere'},debuff_extend:{order:7,priority:-1,action:'extend'},
    poison_apply:{action:'status',status:'poison',duration:'duration',power:'hpLossPerTurn'},
    weaken_apply:{action:'status',status:'vulnerable',duration:'duration'},enfeeble_apply:{action:'status',status:'weak',duration:'duration'},
    regen:{action:'status',status:'regen',duration:'duration',power:'healPerTurn',self:true},
    heavy:{action:'attack',attached:{status:'vulnerable',duration:'vulnerableTurns'}},
    pierce:{action:'attack',pierce:true},bleed_attack:{action:'attack',attached:{status:'bleed',duration:'bleedTurns',power:'bleedHpLossPerHit',onDamage:true}},
    multi:{action:'attack',hits:'hitCount'},execute:{action:'attack',conditional:true},
    reflect:{action:'defense',status:'reflect',fixedDuration:1},
    barricade:{action:'defense',status:'barricade',duration:'carryFullTurns'},
    heal:{action:'heal'},curse_armor:{action:'armor'},curse_chant:{action:'chant'},
    weak:{action:'curse',status:'weak',duration:'duration'},
    vulnerable:{action:'curse',status:'vulnerable',duration:'duration'},
    poison:{action:'curse',status:'poison',duration:'duration',power:'hpLossPerTurn'},
    bleed:{action:'curse',status:'bleed',duration:'duration',power:'hpLossPerHit'},
    bind:{action:'curse',status:'bind',duration:'duration',internalPriority:1},
    hp_loss:{action:'curse'},empty:{action:'empty'},nullify:{action:'nullify'},disrupt:{action:'disrupt'}
  };
  const debuffs=new Set(['weak','vulnerable','poison','bleed']);
  const handEndEffects=new Set(['poison','regen']);
  const countEffects=new Set(['weak','vulnerable','bleed','bind']);
  const raw=(t,p,l)=>{const a=PARAMS[t]?.[p];return a?a[0]+a[1]*Math.max(1,l):0};
  const value=(t,p,l)=>Math.floor(raw(t,p,l));
  function definition(type){const attr=EFFECTS[type]?.attr||'curse';return {order:order[attr],priority:0,action:attr==='attack'?'attack':attr==='defense'?'defense':'empty',...definitions[type]};}
  function compare(a,b){const x=definition(a.type),y=definition(b.type);return y.priority-x.priority||x.order-y.order;}
  const pending=a=>a.faces.filter(f=>!f.used);
  const effectActive=(a,e)=>(e.mode==='handEnd'||e.mode==='count')?e.remaining>0:e.until>a.turn;
  const active=(a,k)=>a.effects.filter(e=>e.key===k&&effectActive(a,e));
  const has=(a,k)=>active(a,k).length>0;
  const power=(a,k)=>active(a,k).reduce((n,e)=>n+e.power,0);
  function actor(hp,maxHp=hp){return {hp,maxHp,turn:0,turnOpen:false,defense:0,effects:[],faces:[]};}
  function create(hp,maxHp,enemyHp,ruin=0,enemyDefense=0){const e=actor(enemyHp);e.defense=Math.max(0,Math.floor(enemyDefense));return {sides:[actor(hp,maxHp),e],ruin,round:0,phase:'player',next:0,open:false,forced:true,winner:null,events:[]};}
  function emit(s,text){s.events.push(text);}
  function consumeCount(a,key){let changed=false;for(const e of a.effects){if(e.key!==key||e.mode!=='count'||e.remaining<=0)continue;e.remaining--;changed=true;}if(changed)a.effects=a.effects.filter(e=>effectActive(a,e));return changed;}
  function add(s,target,key,duration,p=0){const a=s.sides[target];if(debuffs.has(key)&&has(a,'bind')){consumeCount(a,'bind');emit(s,'デバフ無効：'+key);return false;}
    const d=Math.max(1,Math.floor(duration));
    if(handEndEffects.has(key)){a.effects.push({key,mode:'handEnd',remaining:d,power:p});return true;}
    if(countEffects.has(key)){
      if(key==='bleed')a.effects.push({key,mode:'count',remaining:d,power:p});
      else {const old=active(a,key)[0];if(old){old.remaining+=d;old.power=Math.max(old.power||0,p||0);}else a.effects.push({key,mode:'count',remaining:d,power:p});}
      return true;
    }
    const until=a.turn+d+(a.turnOpen?0:1);
    const old=active(a,key)[0];if(old){old.until=Math.max(old.until,until);old.power=Math.max(old.power||0,p||0);}else a.effects.push({key,mode:'turn',until,power:p});
    return true;
  }
  const cleanseOrder=['weak','vulnerable','poison','bleed'];
  function clearSome(a,n){const keys=cleanseOrder.filter(k=>has(a,k)).slice(0,Math.max(0,Math.floor(n)));if(!keys.length)return [];const rm=new Set(keys);a.effects=a.effects.filter(e=>!rm.has(e.key));return keys;}

  function extend(a,n){for(const e of a.effects){if(!debuffs.has(e.key)||!effectActive(a,e))continue;if(e.mode==='handEnd'||e.mode==='count')e.remaining+=n;else e.until+=n;}}
  function check(s){s.winner=s.sides[0].hp<=0?1:s.sides[1].hp<=0?0:null;return s.winner!==null;}
  function beginActorTurn(a){
    const fullCarry=has(a,'barricade');
    if(a.turn>0&&!fullCarry)a.defense=Math.floor(a.defense/2);
    a.turn++;

    a.turnOpen=true;
  }
  function beginRound(s,playerFaces,enemyFaces){
    s.round++;
    s.sides[0].faces=playerFaces.map(f=>({...f,used:false}));
    s.sides[1].faces=enemyFaces.map(f=>({...f,used:false}));

    beginActorTurn(s.sides[0]);
    s.sides[1].turnOpen=false;
    s.phase='player';s.next=0;s.open=false;s.forced=true;
  }

  }
  function finishHandEndEffects(s,side){const a=s.sides[side],po=power(a,'poison'),re=power(a,'regen');
    if(po||re){a.hp=Math.min(a.maxHp,a.hp+re-po);emit(s,(side?'敵':'自分')+` 継続：毒${po}／再生${re}`);}
    for(const e of a.effects)if(e.mode==='handEnd'&&e.remaining>0)e.remaining--;
    a.effects=a.effects.filter(e=>effectActive(a,e));

    }

      if(pending(s.sides[1]).length){beginActorTurn(s.sides[1]);s.phase='enemy';s.next=1;}

      s.phase='done';s.next=null;

  function endForcedOnly(s){endFace(s);}
  function curse(s,recipient,face,bindRecipient){const d=definition(face.type),lv=face.level;
    if(face.type==='hp_loss'){s.sides[recipient].hp-=value('hp_loss','hpLoss',lv);return;}
    add(s,face.type==='bind'?bindRecipient:recipient,d.status,value(face.type,d.duration,lv),d.power?value(face.type,d.power,lv):0);

  function base(f,ruin){const t=f.type,l=f.level;if(t==='growth_attack')return 3+l*l;

  function hit(s,side,f,d,ctx={}){const a=s.sides[side],b=s.sides[1-side];let mult=1;

function startBundle(title,actions,done,kicker="変更",hint=""){const list=mergeBundleActions(actions.filter(a=>a.count>0)).map((a,i)=>({...a,id:`a${i}_${Math.random().toString(36).slice(2,6)}`}));if(!list.length){done();return}G.bundle={title,actions:list,done,kicker,hint};showBundle()}
function showBundle(){const b=G.bundle;if(!b)return;if(b.actions.every(a=>a.count<=0)){const done=b.done;G.bundle=null;done();return}UI={kind:"bundle",bundle:b,overlayOpen:true};render()}
function bundleHasAlternative(){return !!G.bundle&&G.bundle.actions.filter(a=>a.count>0).length>1}
function runBundle(id){const b=G.bundle,a=b?.actions.find(x=>x.id===id);if(!a||a.count<=0)return;const finish=()=>{a.count--;showBundle()},finishAll=()=>{a.count=0;showBundle()};if(a.kind==="growth")chooseGrowth(a.count,finishAll,a.attr||null,a.title||"成長");else if(a.kind==="face")chooseFaceReward(a.type,finish,a.restrictAttr||null,a.title||"面取得");else if(a.kind==="curse")grantCurse(1,finish,a.title||"呪い",a);else if(a.kind==="swap")chooseSwap(finish,a.title||"面交換")}
function chooseGrowth(count,done,attr=null,title="成長"){const keys=normalFaces(attr).map(x=>x.key);if(!keys.length){done();return}setMultiFaceChoice(title,count,keys,order=>{for(const k of order){const [di,fi]=parseFaceKey(k),f=G.dice[di][fi];f.level++;addLog(`${title}：${EFFECTS[f.type].name} Lv${f.level}`)}done()},{mode:"growth",attr,label:attr?`${ATTR_LABEL[attr]}属性を成長させる面を選択`:"成長させる面を選択"});if(!G.growthTutorialShown){G.growthTutorialShown=true;showOneTimeGuide("成長","成長させる面を選びます。Lvが上がると、その面の効果が強くなります。")}}
function overwritePreview(f,type){if(CURSES.has(f.type))return null;if(f.type==="empty")return makeFace(type,1);return makeFace(type,faceAttr(f.type)===faceAttr(type)?f.level+1:f.level)}
function chooseFaceReward(type,done,restrictAttr=null,title="面取得"){const keys=allFaces().filter(x=>!CURSES.has(x.f.type)&&(x.f.type==="empty"||!restrictAttr||faceAttr(x.f.type)===restrictAttr)).map(x=>x.key);if(!keys.length){done();return}setFaceChoice(title,`${EFFECTS[type].name}にする面を選択`,keys,(di,fi)=>{const old=G.dice[di][fi],nf=overwritePreview(old,type);G.dice[di][fi]=nf;addLog(`${title}：${EFFECTS[old.type]?.name||"空面"} → ${EFFECTS[type].name} Lv${nf.level}`);done()},"",{mode:"face",type});if(!G.faceOverwriteTutorialShown){G.faceOverwriteTutorialShown=true;showOneTimeGuide("面の上書き","同じ属性の面に重ねるとLv+1、別属性ならLvはそのまま、空白面ならLv1になります。")}}
function chooseSwap(done,title="面交換"){const keys=allFaces().map(x=>x.key);setMultiFaceChoice(title,2,keys,order=>{const [a,b]=order.map(parseFaceKey);if(a[0]===b[0]&&a[1]===b[1]){done();return}const af=G.dice[a[0]][a[1]],bf=G.dice[b[0]][b[1]];G.dice[a[0]][a[1]]=bf;G.dice[b[0]][b[1]]=af;addLog(`${title}：2面を交換`);done()},{mode:"swap",noRepeat:true,label:"交換する2面を選択"})}
function previewFace(f,meta){if(meta.mode==="growth")return {...f,level:f.level+1};if(meta.mode==="face")return overwritePreview(f,meta.type)||f;if(meta.mode==="curse")return makeFace(meta.type,CURSES.has(f.type)?f.level+1:Math.max(1,f.level));if(meta.mode==="aggregateCurse")return makeFace(meta.type,meta.total);return f}

function grantCurse(count,done,title="呪いを受ける",owner=null){if(count<=0){done();return}const holder=owner||G;let state=holder.curseResolution;if(!state)state=holder.curseResolution={remaining:count,current:null,title};const finishAll=()=>{holder.curseResolution=null;done()};const step=()=>{if(state.remaining<=0){finishAll();return}if(!state.current)state.current={type:choice(CURSE_KEYS),rerolled:false,locked:false};const ctx=state.current,placed=()=>{state.remaining--;state.current=null;if(state.remaining<=0)finishAll();else step()};if(ctx.locked){placeCurse(ctx.type,placed,title);return}offerCurseType(ctx,()=>{ctx.locked=true;placeCurse(ctx.type,placed,title)},()=>{const before=ctx.type;ctx.type=choice(CURSE_KEYS);ctx.rerolled=true;ctx.locked=true;addLog(`破滅5：呪い内容リロール ${EFFECTS[before].name} → ${EFFECTS[ctx.type].name}`);placeCurse(ctx.type,placed,title)},title)};step()}
function offerCurseType(ctx,accept,reroll,title){if(ruin()<5||ctx.locked){accept();return}const buttons=[{label:"このまま受ける",className:"danger",onClick:accept}];if(!ctx.rerolled)buttons.push({label:"破滅5：1回リロール",className:"good",onClick:reroll});setChoice(title,`受ける呪い：${EFFECTS[ctx.type].name}`,buttons,ctx.rerolled?"リロール使用済み":"リロール後は強制採用","呪い")}
function showRuinUnlock(before,after,done){const unlocked=RUIN_EFFECTS.filter(([t])=>before<t&&after>=t);if(!unlocked.length){done();return}const root=document.getElementById("detailRoot");let closed=false;const close=e=>{if(e){e.preventDefault();e.stopPropagation()}if(closed)return;closed=true;root.onclick=null;closeInfo();done()};root.className="detailRoot show";root.innerHTML=`<div class="detailCard tapDismissCard"><div class="modalKicker">破滅効果 解放</div><h3>破滅 ${after}</h3><div class="ruinInfoList">${unlocked.map(([t,x])=>`<div class="ruinInfoRow active"><strong>${t}</strong><span>${x}</span></div>`).join("")}</div><p class="detailTapHint">タップで閉じる</p></div>`;root.onclick=close}
function placeCurse(type,done,title){const all=allFaces(),min=Math.min(...all.map(x=>x.f.level)),eligible=all.filter(x=>x.f.level===min);setFaceChoice(title,`${EFFECTS[type].name}を受ける面を選択`,eligible.map(x=>x.key),(di,fi)=>{const beforeRuin=ruin(),oldMax=G.maxHp,f=G.dice[di][fi];if(CURSES.has(f.type))G.dice[di][fi]=makeFace(type,f.level+1);else G.dice[di][fi]=makeFace(type,Math.max(1,f.level));syncCampaignHp(oldMax);addLog(`呪い：${EFFECTS[type].name} Lv${G.dice[di][fi].level}`);showRuinUnlock(beforeRuin,ruin(),done)},"",{mode:"curse",type,minimum:min});if(!G.cursePlacementTutorialShown){G.cursePlacementTutorialShown=true;showOneTimeGuide("呪いを置く面","呪いは現在Lvが最も低い面の中から置く場所を選びます。選べる面だけが対象になります。")}}

function newGame(){seq++;G={floor:0,hp:60,maxHp:60,money:30,dice:initialDice(),log:[],bundle:null,route:null,shopAttr:null,bargainOffers:null,curseResolution:null,aggregateEvent:null,eventSeen:[],specialOrder:Math.random()<.5?["rare","curse"]:["curse","rare"],combat:null,combatTutorialShown:false,rerollTutorialShown:false,reflectTutorialShown:false,rewardRerollTutorialShown:false,growthTutorialShown:false,faceOverwriteTutorialShown:false,cursePlacementTutorialShown:false};UI={kind:"none"};addLog("ゲーム開始：成長6 → 呪い1");startBundle("開始時ボーナス",[{kind:"growth",count:6,title:"初期成長"},{kind:"curse",count:1,title:"開始時の呪い"}],()=>{G.floor=1;enterFloor()},"準備")}
function moveNextFloor(){if(G.floor>=30){gameClear();return}G.floor++;enterFloor()}

function normalFloorOptions(){if([9,19,29].includes(G.floor))return ["rest"];return weightedWithoutReplacement([{key:"battle",w:2},{key:"elite",w:1},{key:"rest",w:1},{key:"shop",w:1},{key:"event",w:1}],5)}

const DEFAULT_CURVE={b1:{lv:1,hp:22},b2:{lv:1,hp:30},m10:{lv:2,hp:65},b3:{lv:2,hp:40},b4:{lv:2,hp:45},m20:{lv:3,hp:65},b5:{lv:3,hp:42},b6:{lv:3,hp:50},boss:{lv:4,hp:80}};
function floorEnemyBase(f){if(f<=5)return DEFAULT_CURVE.b1;if(f<=9)return DEFAULT_CURVE.b2;if(f===10)return DEFAULT_CURVE.m10;if(f<=15)return DEFAULT_CURVE.b3;if(f<=19)return DEFAULT_CURVE.b4;if(f===20)return DEFAULT_CURVE.m20;if(f<=25)return DEFAULT_CURVE.b5;if(f<=29)return DEFAULT_CURVE.b6;return DEFAULT_CURVE.boss}
function normalVariant(){const x=Math.random();if(G.floor<=5)return x<.35?"basic":x<.68?"growth":"multi";if(G.floor<=9)return x<.25?"basic":x<.50?"growth":x<.75?"multi":"heavy";if(G.floor<=15)return x<.25?"basic":x<.55?"heavy":x<.80?"weaken":"toxic_duo";if(G.floor<=19)return x<.20?"basic":x<.45?"heavy":x<.70?"weaken":x<.85?"barricade":"toxic_duo";if(G.floor<=25)return x<.20?"basic":x<.45?"heavy":x<.65?"weaken":x<.85?"barricade":"toxic_duo";return x<.15?"basic":x<.35?"heavy":x<.55?"weaken":x<.80?"barricade":"toxic_duo"}
function enemyForFloor(kind){const b=floorEnemyBase(G.floor);let lv=b.lv,hp=b.hp,faces,diceCount=1,variant=kind,faceSets=null,dieLevels=null;const boosted=t=>({type:t,level:lv+1});if(kind==="elite"){lv++;hp=floor(hp*1.35);if(G.floor<=9)faces=["attack","attack",boosted("growth_attack"),boosted("multi"),"defense","weak"];else if(G.floor<=19)faces=["attack","attack",boosted("heavy"),boosted("weak"),"defense","barricade"];else faces=["attack","attack",boosted("poison_apply"),boosted("debuff_extend"),"defense","barricade"]}else if(kind==="mid"&&G.floor===10){faces=["attack","attack",boosted("execute"),"reflect","multi","defense"];variant="mid_execute_reflect"}else if(kind==="mid"&&G.floor===20){faces=["attack","attack",boosted("pierce"),"regen","heavy","defense"];variant="mid_pierce_regen"}else if(kind==="boss"){const curseFaces=G.dice.flat().filter(f=>CURSES.has(f.type)).map(f=>({type:f.type,level:Math.max(1,f.level)}));faceSets=[["attack","attack",boosted("pierce"),"cleanse_heal","enfeeble_apply","defense"]];if(curseFaces.length)faceSets.push(curseFaces);diceCount=curseFaces.length?2:1;dieLevels=[lv];faces=faceSets[0];variant="boss_curse_mirror"}else{variant=normalVariant();if(variant==="growth")faces=["attack","attack","attack","attack",boosted("growth_attack"),"defense"];else if(variant==="multi")faces=["attack","attack","attack","attack",boosted("multi"),"defense"];else if(variant==="heavy")faces=["attack","attack","attack","attack",boosted("heavy"),"defense"];else if(variant==="weaken")faces=["attack","attack","attack","attack",boosted("weaken_apply"),"defense"];else if(variant==="barricade")faces=["attack","attack","attack","attack",boosted("barricade"),"defense"];else if(variant==="toxic_duo"){hp=floor(hp*.8);diceCount=2;faceSets=[["attack","attack","attack","attack",boosted("poison_apply"),"defense"],["attack","attack","attack","attack","debuff_extend","defense"]];faces=faceSets[0]}else faces=["attack","attack","attack","attack","defense","defense"]}return {hp,maxHp:hp,level:lv,faces,faceSets,dieLevels,diceCount,variant,status:newStatuses()}}
function showCombatTutorials(){const C=G.combat;if(!C||UI.kind!=="combatResult")return;const items=[];if(!G.combatTutorialShown){G.combatTutorialShown=true;items.push(`<h3>戦闘</h3><p>出た自分のダイスは、好きな順にタップして使えます。効果を確認したいときは長押しします。</p>`)}if(!G.rerollTutorialShown&&ruin()>=20&&!C.rerollDone&&!!C.results?.length){G.rerollTutorialShown=true;items.push(`<h3>↻ 振り直し</h3><p><strong>↻</strong> を押して、振り直す出目をタップします。1戦闘につき1回使えます。</p>`)}if(!G.reflectTutorialShown&&ruin()>=35&&!C.curseReflectDone&&combatCurseIndices(C).length>0){G.reflectTutorialShown=true;items.push(`<h3>反射</h3><p><strong>反射</strong> を押して、敵へ返す呪いをタップします。選んだ呪いは自分には発動せず、敵へ2回分発動します。1戦闘につき1回使えます。</p>`)}if(!items.length)return;const root=document.getElementById("detailRoot");root.className="detailRoot show";root.innerHTML=`<div class="detailCard tutorialCard tapDismissCard">${items.join("")}<p class="detailTapHint">タップで閉じる</p></div>`;root.onclick=e=>{e.preventDefault();e.stopPropagation();closeInfo()}}
function startBattle(kind){G.maxHp=Math.max(1,finite(G.maxHp,60));G.hp=clamp(finite(G.hp,G.maxHp),0,G.maxHp);const e=enemyForFloor(kind);e.maxHp=Math.max(1,finite(e.maxHp,finite(e.hp,1)));e.hp=clamp(finite(e.hp,e.maxHp),0,e.maxHp);G.combat={kind,enemy:e,playerHp:G.hp,playerMax:G.maxHp,playerStatus:newStatuses(),playerDefense:0,enemyDefense:faceBaseValue("defense",e.level),turn:0,enemyRolls:[],results:null,revealed:0,highlighted:0,openingCursePending:false,processedCount:0,resolveSteps:[],resolveIndex:-1,preview:null,beforePlayerHp:G.hp,beforeEnemyHp:e.hp,offeredDice:null,selectedDice:null,rerollDone:false,curseReflectDone:false,reflectedCurseIndex:null,turnActions:[]};normalizeCombatHp(G.combat);addLog(`${G.floor}F ${kind==="normal"?"戦闘":KIND_LABEL[kind]}開始：敵Lv${e.level} HP${e.hp}`);beginTurn()}
function enemyFacesForDie(C,di=0){return C.enemy.faceSets?.[di]||C.enemy.faces}
function enemyLevelForDie(C,di=0){return C.enemy.dieLevels?.[di]??C.enemy.level}
function enemyRollFromSpec(spec,lv,di){return {type:typeof spec==="string"?spec:spec.type,level:typeof spec==="string"?lv:Math.max(1,spec.level||lv),enemyDie:di}}
function rollEnemyBase(C){C.enemyRolls=Array.from({length:C.enemy.diceCount},(_,di)=>enemyRollFromSpec(choice(enemyFacesForDie(C,di)),enemyLevelForDie(C,di),di))}
function beginTurn(){const C=G.combat;if(!C)return;C.turn++;C.results=null;C.revealed=0;C.highlighted=0;C.openingCursePending=false;C.processedCount=0;C.resolveSteps=[];C.resolveIndex=-1;C.preview=null;C.reflectedCurseIndex=null;C.turnActions=[];C.enemyRolls=[];if(ruin()>=30){C.offeredDice=sampleWithoutReplacement(6,3);UI={kind:"dicePick"};render()}else{C.selectedDice=sampleWithoutReplacement(6,3);UI={kind:"combatReady"};render()}}
function chooseFixedDie(di){const C=G.combat;if(!C.offeredDice.includes(di))return;const rest=Array.from({length:6},(_,i)=>i).filter(i=>i!==di),need=ruin()>=40?3:2;C.selectedDice=[di,...sampleWithoutReplacement(rest.length,need).map(i=>rest[i])];C.offeredDice=null;UI={kind:"combatReady"};render()}
function rollFace(di){const fi=ri(6),f=G.dice[di][fi];return {die:di,face:fi,type:f.type,level:f.level,basicAwakened:!!f.basicAwakened,voided:false}}
async function rollPlayer(){clearCombatTap();const C=G.combat,token=++seq;rollEnemyBase(C);C.results=C.selectedDice.map(rollFace);C.highlighted=0;C.openingCursePending=false;if(!C.alt)C.alt=CombatCore.create(C.playerHp,C.playerMax,C.enemy.hp,ruin(),C.enemyDefense||0);CombatCore.beginRound(C.alt,C.results,C.enemyRolls);syncAlternating(C);C.revealed=0;C.preview=null;UI={kind:"rolling"};render();await wait(TIMING.firstRoll);if(token!==seq)return;for(let i=1;i<=C.results.length;i++){C.revealed=i;render();if(i<C.results.length){await wait(TIMING.rollGap);if(token!==seq)return}}updateDamagePreview(C);const hasCurse=combatCurseIndices(C).length>0;await wait(hasCurse?TIMING.step:TIMING.rollGap);if(token!==seq||G.combat!==C)return;C.openingCursePending=hasCurse;UI={kind:"combatResult"};render();showCombatTutorials();if(hasCurse&&!hasOpeningCurseSpecial(C))await resolveOpeningCurses(true)}
function advanceCombatResult(){const C=G.combat;if(!C)return;prepareAndResolveTurn()}
function combatCurseIndices(C=G.combat){return C?.results?.map((r,i)=>({r,i})).filter(x=>!x.r.used&&!x.r.voided&&CURSES.has(x.r.type)).map(x=>x.i)||[]}
function combatSelectableIndices(C=G.combat,kind=UI.kind){if(!C?.results?.length)return[];if(kind==="rerollChoice")return C.results.map((r,i)=>!r.used?i:-1).filter(i=>i>=0);if(kind==="curseReflectChoice")return (UI.curseIdx||[]).filter(i=>C.results[i]&&!C.results[i].used&&!C.results[i].voided&&CURSES.has(C.results[i].type));if(["combatResult","combatChoose"].includes(kind))return C.results.map((r,i)=>!r.used&&!r.voided&&!CURSES.has(r.type)?i:-1).filter(i=>i>=0);return[]}
function hasOpeningCurseSpecial(C=G.combat){if(!C?.openingCursePending)return false;return (ruin()>=20&&!C.rerollDone)||(ruin()>=35&&!C.curseReflectDone&&combatCurseIndices(C).length>0)}
async function revealCombatHighlights(C,token=seq){return}
async function resolveOpeningCurses(skipFirstForcedWait=true){const C=G.combat;if(!C?.openingCursePending)return;C.openingCursePending=false;if(!C.alt){C.alt=CombatCore.create(C.playerHp,C.playerMax,C.enemy.hp,ruin(),C.enemyDefense||0);CombatCore.beginRound(C.alt,C.results,C.enemyRolls)}C.results.forEach((r,i)=>r.reflected=i===C.reflectedCurseIndex);C.alt.sides[0].faces=C.results.map(f=>({...f,used:!!f.used}));C.alt.sides[1].faces=C.enemyRolls.map(f=>({...f,used:!!f.used}));syncAlternating(C);await advanceAlternating(null,{skipFirstForcedWait})}

async function rerollResult(index){const C=G.combat;if(UI.kind!=="rerollChoice"||!C||C.rerollDone||ruin()<20||index==null||!C.results?.[index]||C.results[index].used)return;C.rerollDone=true;const di=C.results[index].die;C.results[index]=rollFace(di);C.openingCursePending=combatCurseIndices(C).length>0;C.highlighted=0;updateDamagePreview(C);addLog(`破滅20：ダイス${di+1}を振り直し（強制採用）`);UI={kind:"combatResult"};render();if(C.openingCursePending&&!hasOpeningCurseSpecial(C))await resolveOpeningCurses(true)}
async function reflectCurseResult(index){const C=G.combat;if(UI.kind!=="curseReflectChoice"||!C||C.curseReflectDone)return;const r=C.results[index];if(!r||r.used||r.voided||!CURSES.has(r.type))return;C.curseReflectDone=true;C.reflectedCurseIndex=index;C.results[index].reflected=true;C.openingCursePending=true;C.highlighted=0;updateDamagePreview(C);addLog(`破滅35：${EFFECTS[r.type].name} Lv${r.level}を無効化し、敵へ2回分返す`);UI={kind:"combatResult"};render();await resolveOpeningCurses(true)}
function cancelCombatSpecial(){if(["rerollChoice","curseReflectChoice"].includes(UI.kind)){const C=G.combat;UI={kind:"combatResult"};if(C&&!C.openingCursePending)C.highlighted=combatSelectableIndices(C,"combatResult").length;render()}}

function updateDamagePreview(C){if(!C?.results?.length||!C.enemyRolls?.length){C.preview=null;return;}const s=C.alt||CombatCore.create(C.playerHp,C.playerMax,C.enemy.hp,ruin(),C.enemyDefense||0);if(!C.alt){s.sides[0].defense=C.playerDefense||0;s.sides[1].defense=C.enemyDefense||0;}const out=CombatCore.forecastDamage(s,0,C.results),inc=CombatCore.forecastDamage(s,1,C.enemyRolls),playerLoss=inc.toTarget+out.toSelf,enemyLoss=out.toTarget+inc.toSelf;C.preview={playerHp:C.playerHp-playerLoss,enemyHp:C.enemy.hp-enemyLoss,playerMax:C.playerMax,incomingDamage:playerLoss,outgoingDamage:enemyLoss};}
function syncAlternating(C){const [p,e]=C.alt.sides;p.maxHp=Math.max(1,finite(p.maxHp,C.playerMax));p.hp=clamp(finite(p.hp,C.playerHp),0,p.maxHp);e.maxHp=Math.max(1,finite(e.maxHp,C.enemy.maxHp));e.hp=clamp(finite(e.hp,C.enemy.hp),0,e.maxHp);C.playerHp=p.hp;C.playerMax=p.maxHp;C.playerDefense=finite(p.defense,0);C.playerStatus=CombatCore.status(p);C.enemy.hp=e.hp;C.enemy.maxHp=e.maxHp;C.enemyDefense=finite(e.defense,0);C.enemy.status=CombatCore.status(e);C.results=p.faces;C.enemyRolls=e.faces;normalizeCombatHp(C);updateDamagePreview(C);}
function combatCursePool(){return curseFaces().map(x=>({type:x.f.type,level:x.f.level}));}
function combatUiSnapshot(C){if(!C?.alt)return null;return C.alt.sides.map(a=>({hp:a.hp,maxHp:a.maxHp,defense:a.defense,status:CombatCore.status(a),levels:(a.faces||[]).map(f=>f.level)}));}
function combatStatusAmount(st,key){const v=st?.[key];if(Array.isArray(v))return v.reduce((n,x)=>n+Math.max(0,Number(x.rem)||0),0);if(typeof v==='number')return v;return v?1:0;}
function recordCombatAction(C,side,face,before,after,events=[]){if(!C||!face||!before||!after)return;const actor0=before[side],actor1=after[side],target0=before[1-side],target1=after[1-side],actorName=side?'敵':'自分',targetName=side?'自分':'敵',parts=[],mods=[];if(ATTACKS.has(face.type)){const weakOn=combatStatusAmount(actor0.status,'weak')>0,vulnerableOn=combatStatusAmount(target0.status,'vulnerable')>0;if(weakOn)mods.push('脱力');if(vulnerableOn)mods.push('弱体');if(weakOn||vulnerableOn){let inherent=1;if(face.type==='execute'&&actor0.hp<=actor0.maxHp*paramRaw('execute','hpThresholdPct',face.level)/100)inherent=paramRaw('execute','damageMultiplierPct',face.level)/100;const rawPower=Math.floor(rolledFaceValue(face)*inherent),adjustedPower=Math.floor(rolledFaceValue(face)*inherent*(weakOn?.5:1)*(vulnerableOn?1.25:1));parts.push(`${fmt(rawPower)}→${fmt(adjustedPower)}`);}}
  const targetDefUsed=Math.max(0,target0.defense-target1.defense),targetHpLoss=Math.max(0,target0.hp-target1.hp),actorDefGain=Math.max(0,actor1.defense-actor0.defense),actorHpGain=Math.max(0,actor1.hp-actor0.hp),actorHpLoss=Math.max(0,actor0.hp-actor1.hp),maxHpGain=Math.max(0,actor1.maxHp-actor0.maxHp);
  if(targetDefUsed>0)parts.push(`${targetName}防御 -${fmt(targetDefUsed)}`);if(targetHpLoss>0)parts.push(`${targetName}HP -${fmt(targetHpLoss)}`);if(actorDefGain>0)parts.push(`防御 +${fmt(actorDefGain)}`);if(actorHpGain>0)parts.push(`${actorName}HP +${fmt(actorHpGain)}`);if(actorHpLoss>0)parts.push(`${actorName}HP -${fmt(actorHpLoss)}`);if(maxHpGain>0)parts.push(`最大HP +${fmt(maxHpGain)}`);
  const statusMeta=[['weak','脱力','回'],['vulnerable','弱体','回'],['bind','デバフ無効','回'],['poison','毒','T'],['bleed','出血','回'],['regen','再生','T'],['barricade','バリケード','T']];
  for(const who of [side,1-side]){const b=before[who].status,a=after[who].status,name=who?'敵':'自分';for(const [key,label,unit] of statusMeta){const d=combatStatusAmount(a,key)-combatStatusAmount(b,key);if(d>0)parts.push(`${name}${label} +${fmt(d)}${unit}`);else if(d<0&&face.type==='cleanse_heal')parts.push(`${name}${label} 解除`);}if(!combatStatusAmount(b,'reflect')&&combatStatusAmount(a,'reflect'))parts.push(`${name}反射`);}
  const actorLevelChanges=actor1.levels.map((v,i)=>v-(actor0.levels[i]??v)).filter(v=>v>0),targetLevelChanges=target1.levels.map((v,i)=>(target0.levels[i]??v)-v).filter(v=>v>0);
  if(face.type==='attack_support'||face.type==='defense_support'){const label=face.type==='attack_support'?'攻撃':'防衛';if(actorLevelChanges.length)parts.push(`${label}面${actorLevelChanges.length}個 Lv+${fmt(Math.max(...actorLevelChanges))}`);}else if(face.type==='amplify'&&actorLevelChanges.length)parts.push(`未処理面${actorLevelChanges.length}個 合計Lv+${fmt(actorLevelChanges.reduce((a,b)=>a+b,0))}`);else if(face.type==='interfere'&&targetLevelChanges.length)parts.push(`${targetName}未処理面${targetLevelChanges.length}個 合計Lv-${fmt(targetLevelChanges.reduce((a,b)=>a+b,0))}`);
  for(const ev of events){const m=String(ev).match(/^(自分|敵) 継続：毒([0-9.]+)／再生([0-9.]+)/);if(m)parts.push(`${m[1]}終了時 毒${m[2]} / 再生${m[3]}`);}
  if(!Array.isArray(C.turnActions))C.turnActions=[];C.turnActions.push({label:`${actorName} ${EFFECTS[face.type]?.name||face.type}${mods.length?`（${mods.join('・')}）`:''}`,text:parts.length?parts.join(' / '):'変化なし'});if(C.turnActions.length>4)C.turnActions=C.turnActions.slice(-4);
}
function combatActionHistoryHtml(C,fallbackText="") {const rows=(C?.turnActions||[]).slice(-4);if(!rows.length&&fallbackText)rows.push({label:"行動を選択",text:fallbackText});return `<div class="combatActionHistory">${rows.map(st=>`<div class="processLine"><strong>${st.label}</strong><span>${st.text}</span></div>`).join("")}</div>`;}
function prepareAndResolveTurn(preferredIndex=null){const C=G.combat;if(!C?.results)return;if(!C.alt){C.alt=CombatCore.create(C.playerHp,C.playerMax,C.enemy.hp,ruin(),C.enemyDefense||0);CombatCore.beginRound(C.alt,C.results,C.enemyRolls);}
  C.results.forEach((r,i)=>r.reflected=i===C.reflectedCurseIndex);C.alt.sides[0].faces=C.results.map(f=>({...f,used:!!f.used}));C.alt.sides[1].faces=C.enemyRolls.map(f=>({...f,used:!!f.used}));syncAlternating(C);advanceAlternating(preferredIndex);}
async function advanceAlternating(preferredIndex=null,opts={}){const C=G.combat;if(!C)return;const token=++seq;let skipFirstForcedWait=!!opts.skipFirstForcedWait;UI={kind:'combatResolving'};
  while(G.combat===C&&token===seq){const s=C.alt;
    if(s.winner!==null){syncAlternating(C);afterTurn();return;}
    if(s.next===null){syncAlternating(C);afterTurn();return;}
    CombatCore.start(s);syncAlternating(C);
    if(s.next===null){afterTurn();return;}
    const forced=s.next===0&&s.forced&&CombatCore.pending(s.sides[0]).some(f=>CURSES.has(f.type));
    if(forced){
      UI={kind:'combatResolving'};render();
      if(skipFirstForcedWait)skipFirstForcedWait=false;else{await wait(TIMING.step);if(token!==seq||G.combat!==C)return;}
      const actionIndex=CombatCore.choose(s),actionFace={...s.sides[0].faces[actionIndex]},snapBefore=combatUiSnapshot(C),before=s.events.length;CombatCore.act(s,actionIndex,Math.random,combatCursePool());syncAlternating(C);const actionEvents=s.events.slice(before);recordCombatAction(C,0,actionFace,snapBefore,combatUiSnapshot(C),actionEvents);actionEvents.forEach(addLog);render();
      const moreForced=s.next===0&&s.forced&&CombatCore.pending(s.sides[0]).some(f=>CURSES.has(f.type));
      if(!moreForced){await wait(TIMING.step);if(token!==seq||G.combat!==C)return;}
      continue;
    }
    if(s.next===0){
      if(preferredIndex!=null&&C.results?.[preferredIndex]&&!C.results[preferredIndex].used){UI={kind:'combatResolving'};const actionIndex=preferredIndex,actionFace={...s.sides[0].faces[actionIndex]},snapBefore=combatUiSnapshot(C),before=s.events.length;CombatCore.act(s,actionIndex,Math.random,combatCursePool());preferredIndex=null;syncAlternating(C);const actionEvents=s.events.slice(before);recordCombatAction(C,0,actionFace,snapBefore,combatUiSnapshot(C),actionEvents);actionEvents.forEach(addLog);render();continue;}
      UI={kind:'combatChoose'};render();return;}
    UI={kind:'combatResolving'};render();await wait(TIMING.step);if(token!==seq||G.combat!==C)return;
    const actionIndex=CombatCore.choose(s),actionFace={...s.sides[1].faces[actionIndex]},snapBefore=combatUiSnapshot(C),before=s.events.length;CombatCore.act(s,actionIndex,Math.random,combatCursePool());syncAlternating(C);const actionEvents=s.events.slice(before);recordCombatAction(C,1,actionFace,snapBefore,combatUiSnapshot(C),actionEvents);actionEvents.forEach(addLog);render();
  }
}
function chooseCombatResultFace(index){const C=G.combat;if(UI.kind!=='combatResult'||!C?.results?.[index]||C.openingCursePending)return;if(!combatSelectableIndices(C,'combatResult').includes(index))return;clearCombatTap();prepareAndResolveTurn(index);}

function chooseCombatFace(index){const C=G.combat;if(UI.kind!=='combatChoose'||!C?.alt||C.alt.next!==0||C.results[index]?.used)return;
  clearCombatTap();UI={kind:'combatResolving'};const actionFace={...C.alt.sides[0].faces[index]},snapBefore=combatUiSnapshot(C),before=C.alt.events.length;
  CombatCore.act(C.alt,index,Math.random,combatCursePool());syncAlternating(C);const actionEvents=C.alt.events.slice(before);recordCombatAction(C,0,actionFace,snapBefore,combatUiSnapshot(C),actionEvents);actionEvents.forEach(addLog);render();advanceAlternating();}

function afterTurn(){const C=G.combat;if(!C)return;normalizeCombatHp(C);if(C.playerHp<=0){G.hp=clamp(C.playerHp,0,Math.max(1,finite(G.maxHp,C.playerMax)));gameOver();return}if(C.enemy.hp<=0){G.maxHp=Math.max(1,finite(G.maxHp,C.playerMax));G.hp=clamp(C.playerHp,0,G.maxHp);const token=++seq;UI={kind:"combatVictoryPause"};render();setTimeout(()=>{if(seq!==token||G.combat!==C)return;battleVictory()},900);return}beginTurn()}
function battleVictory(){const C=G.combat,kind=C.kind,endedHp=G.hp;if(kind==="normal")G.money+=20;else if(kind==="elite")G.money+=40;else if(kind==="mid")G.money+=60;if(ruin()>=25){const old=G.hp,heal=floor(G.maxHp*.10);G.hp=Math.min(G.maxHp,G.hp+heal);if(G.hp>old)addLog(`破滅25：戦闘勝利 HP+${G.hp-old}`)}addLog(`${G.floor}F 勝利${kind==="normal"?" +20G":kind==="elite"?" +40G":kind==="mid"?" +60G":""}`);if(kind==="boss"){gameClear();return}if(kind==="mid"){const heal=floor(G.maxHp*.3),old=G.hp;G.hp=Math.min(G.maxHp,G.hp+heal);addLog(`中ボス突破：HP+${G.hp-old}`);C.playerHp=G.hp;C.playerMax=G.maxHp;const gained=Math.max(0,G.hp-endedHp),token=++seq;UI={kind:"midHealPause",healGain:gained};render();setTimeout(()=>{if(seq!==token||G.combat!==C)return;checkpointReward(G.floor===10?G.specialOrder[0]:G.specialOrder[1])},700);return}showBattleReward(kind==="elite"?2:1,kind==="elite")}

function rewardAttrGrowths(count){const out=[];while(out.length<count){const n=Math.min(2,count-out.length);out.push(...shuffle(ATTRS).slice(0,n))}return out}
function makeRewardPacks(scale,pool=REWARD_POOL,extraCurse=0){const faces=shuffle(pool).slice(0,3*scale);return [{kind:"safe",faces:faces.slice(0,scale),attrs:[],curse:extraCurse},{kind:"face",faces:faces.slice(scale,scale+2*scale),attrs:[],curse:scale+extraCurse},{kind:"attr",faces:[],attrs:rewardAttrGrowths(2*scale),curse:scale+extraCurse}]}
function rewardTokenHtml(label,cls,count=1,extra=""){return `<span class="rewardToken"><span class="rewardTag ${cls}" ${extra}>${label}</span>${count>1?`<span class="rewardQty">${count}</span>`:""}</span>`}
function rewardTagsHtml(p){const tags=[],fc=new Map(),ac=new Map();for(const t of p.faces)fc.set(t,(fc.get(t)||0)+1);for(const [t,n] of fc){const a=faceAttr(t);tags.push(rewardTokenHtml(EFFECTS[t].name,`${a} infoTap`,n,`data-info-type="${t}" data-info-lv="1"`))}for(const a of p.attrs)ac.set(a,(ac.get(a)||0)+1);for(const [a,n] of ac)tags.push(rewardTokenHtml(`${ATTR_LABEL[a]}`,`growth growth-${a}`,n));if(p.curse)tags.push(rewardTokenHtml("呪い","curse",p.curse));return `<div class="rewardTags">${tags.join("")}</div>`}
function bundleActionTagHtml(a){if(a.kind==="face")return rewardTokenHtml(EFFECTS[a.type].name,`${faceAttr(a.type)} infoTap`,a.count,`data-info-type="${a.type}" data-info-lv="1"`);if(a.kind==="growth")return rewardTokenHtml(a.attr?`${ATTR_LABEL[a.attr]}`:"成長",a.attr?`growth growth-${a.attr}`:"growth",a.count);if(a.kind==="curse")return rewardTokenHtml("呪い","curse",a.count);return rewardTokenHtml(a.title||"効果","",a.count)}
function showBattleReward(scale,isElite=false){const pool=isElite?[...REWARD_POOL,...RARE_POOL]:REWARD_POOL;UI={kind:"reward",packs:makeRewardPacks(scale,pool,0),rerolled:false,scale,rewardPool:pool,isElite,overlayOpen:true};render();if(ruin()>=10&&!G.rewardRerollTutorialShown){G.rewardRerollTutorialShown=true;showOneTimeGuide("報酬リロール","↻を押すと、その報酬枠だけを1回振り直せます。")}}
function rerollReward(idx){if(UI.kind!=="reward"||UI.rerolled||ruin()<10)return;const p=UI.packs[idx];if(p.kind==="attr")p.attrs=rewardAttrGrowths(p.attrs.length);else{const used=new Set(UI.packs.flatMap((x,i)=>i===idx?[]:x.faces)),base=UI.rewardPool||REWARD_POOL,pool=shuffle(base.filter(x=>!used.has(x)));p.faces=(pool.length>=p.faces.length?pool:shuffle(base)).slice(0,p.faces.length)}UI.rerolled=true;addLog(`破滅10：報酬1枠をリロール`);render()}
function takeReward(idx){const p=UI.packs[idx],acts=[];for(const t of p.faces)acts.push({kind:"face",type:t,count:1,title:"戦闘報酬"});for(const a of p.attrs)acts.push({kind:"growth",attr:a,count:1,title:`${ATTR_LABEL[a]}`});if(p.curse)acts.push({kind:"curse",count:p.curse,title:"戦闘報酬の呪い"});startBundle("戦闘報酬",acts,moveNextFloor,"報酬")}
function checkpointReward(type){const title=`${G.floor}Fボス報酬`;if(type==="rare"){const shown=shuffle(RARE_POOL).slice(0,3);setChoice(title,"",shown.map(t=>({label:EFFECTS[t].name,onClick:()=>chooseFaceReward(t,moveNextFloor,faceAttr(t),title)})),"","報酬")}else setChoice(title,"",CURSE_SERIES.map(t=>({label:EFFECTS[t].name,onClick:()=>chooseFaceReward(t,moveNextFloor,faceAttr(t),title)})),"","報酬")}

function restFloor(){const curses=curseFaces(),canMove=curses.length>=2&&curses.some(x=>x.f.level>=2);setChoice("休憩","",[{label:"最大HPの30%回復",className:"good",onClick:()=>{const old=G.hp;G.hp=Math.min(G.maxHp,G.hp+floor(G.maxHp*.3));UI={kind:"restOverlay",before:old,after:G.hp,got:G.hp-old,onContinue:()=>{const token=++seq;UI={kind:"restFade"};render();setTimeout(()=>{if(seq!==token)return;moveNextFloor()},550)}};render()}},{label:"任意の2面を交換",onClick:()=>chooseSwap(moveNextFloor,"休憩：面交換")},{label:canMove?"呪いLvを1移動":"呪いLvを1移動（対象なし）",disabled:!canMove,onClick:restCurseTransfer}],"","休憩")}
function restCurseTransfer(){const sources=curseFaces().filter(x=>x.f.level>=2);if(!sources.length){restFloor();return}setFaceChoice("休憩：呪いLv移動","1Lv減らす呪い面を選択",sources.map(x=>x.key),(sdi,sfi)=>{const targets=curseFaces().filter(x=>x.di!==sdi||x.fi!==sfi);if(!targets.length){restFloor();return}setFaceChoice("休憩：呪いLv移動","1Lv増やす呪い面を選択",targets.map(x=>x.key),(tdi,tfi)=>{const src=G.dice[sdi][sfi],dst=G.dice[tdi][tfi];src.level--;dst.level++;addLog(`休憩：呪いLv移動 ${EFFECTS[src.type].name} -1 → ${EFFECTS[dst.type].name} +1`);moveNextFloor()},"",{mode:"event",instant:true})},"",{mode:"event",instant:true})}

function shopFloor(){if(!G.shopAttr)G.shopAttr=choice(ATTRS);UI={kind:"shop",overlayOpen:true};render()}
function shopPrice(cost,discount=false){return floor(discount?cost/4:cost)}
function payShop(cost,discount,purchase){const price=shopPrice(cost,discount);if(G.money<price)return;G.money-=price;const done=discount?()=>grantCurse(1,shopFloor,"ショップ割引の呪い"):shopFloor;purchase(done)}
function buyGrowth(discount=false){if(!normalFaces().length)return;payShop(60,discount,done=>chooseGrowth(1,done,null,"ショップ：成長点"))}
function buyAttrGrowth(discount=false){const attr=G.shopAttr;if(!normalFaces(attr).length)return;payShop(40,discount,done=>chooseGrowth(1,()=>{G.shopAttr=choice(ATTRS);done()},attr,`ショップ：${ATTR_LABEL[attr]}`))}
function buySwap(discount=false){payShop(30,discount,done=>chooseSwap(done,"ショップ：面交換"))}
function curseLowerCost(from,to){return to===0?(from-1)*30+50:(from-to)*30}
function minCurseLowerCost(f){if(!f||!CURSES.has(f.type))return Infinity;return f.level<=1?50:30}
function canAffordCurseLower(){return curseFaces().some(x=>G.money>=minCurseLowerCost(x.f))}
function buyCurseLower(){const keys=curseFaces().filter(x=>G.money>=minCurseLowerCost(x.f)).map(x=>x.key);if(!keys.length){shopFloor();return}setFaceChoice("呪い軽減","軽減する呪い面を選択",keys,(di,fi)=>{const f=G.dice[di][fi],opts=[];for(let to=f.level-1;to>=0;to--){const cost=curseLowerCost(f.level,to);opts.push({label:`Lv${f.level} → ${to===0?"除去":`Lv${to}`}：${cost}G`,disabled:G.money<cost,onClick:()=>{const oldMax=G.maxHp;G.money-=cost;if(to===0)G.dice[di][fi]=makeFace("empty",0);else f.level=to;syncCampaignHp(oldMax);shopFloor()}})}opts.push({label:"戻る",onClick:shopFloor});setChoice("呪い軽減",EFFECTS[f.type].name,opts,"","ショップ")},"",{mode:"curseLower",instant:true})}

const UNIQUE_EVENTS=["curse_transfer","level_swap","bargain_shop","curse_growth","basic_awaken","full_heal"],REPEAT_EVENTS=["curse_growth","level_swap","bargain_shop","full_heal"];
function mysteryEvent(){const rem=UNIQUE_EVENTS.filter(x=>!G.eventSeen.includes(x)),type=choice(rem.length?rem:REPEAT_EVENTS);if(rem.length)G.eventSeen.push(type);addLog(`イベント：${eventLabel(type)}`);if(type==="curse_transfer")eventCurseTransfer();else if(type==="level_swap")eventLevelSwap();else if(type==="bargain_shop")eventBargainShop();else if(type==="curse_growth")eventCurseGrowth();else if(type==="basic_awaken")eventBasicAwaken();else eventFullHeal()}
function eventLabel(t){return {curse_transfer:"呪い集約",level_swap:"レベル交換",bargain_shop:"格安面ショップ",curse_growth:"呪い＋成長",basic_awaken:"通常攻撃・通常防御覚醒",full_heal:"呪いで回復"}[t]}
function eventCurseTransfer(){const dice=[];for(let di=0;di<G.dice.length;di++){const slots=G.dice[di].map((f,fi)=>({f,fi,key:`${di}:${fi}`})).filter(x=>CURSES.has(x.f.type));if(slots.length)dice.push({di,slots,total:slots.reduce((n,x)=>n+x.f.level,0),type:choice(slots).f.type})}if(!dice.length){G.aggregateEvent=null;setChoice("呪い集約","呪い面がないため変化なし。",[{label:"次へ",onClick:moveNextFloor}],"","イベント");return}G.aggregateEvent={dice};showCurseAggregateChoices()}
function showCurseAggregateChoices(){const dice=G.aggregateEvent?.dice||[];const buttons=[{label:"集約しない",onClick:()=>{G.aggregateEvent=null;moveNextFloor()}},...dice.map(x=>({label:`◆${x.di+1}：呪い${x.slots.length}面 / 合計Lv${x.total}`,onClick:()=>aggregateCurseDie(x.di)}))];setChoice("呪い集約","このダイス内の呪いを1面にまとめます。集約するダイスを選択",buttons,"集約は任意","イベント")}
function aggregateCurseDie(di){const x=G.aggregateEvent?.dice?.find(v=>v.di===di);if(!x){showCurseAggregateChoices();return}const keys=x.slots.map(v=>v.key);setFaceChoice("呪い集約",`${EFFECTS[x.type].name} Lv${x.total}を残す面を選択`,keys,(sdi,sfi)=>{for(const v of x.slots)G.dice[di][v.fi]=makeFace("empty",0);G.dice[sdi][sfi]=makeFace(x.type,x.total);G.aggregateEvent=null;addLog(`イベント：呪い集約 → ${EFFECTS[x.type].name} Lv${x.total}（空白${Math.max(0,x.slots.length-1)}面）`);moveNextFloor()},"",{mode:"aggregateCurse",type:x.type,total:x.total,blankKeys:new Set(keys)})}

function eventLevelSwap(){const keys=normalFaces().map(x=>x.key);if(keys.length<2){moveNextFloor();return}setMultiFaceChoice("レベル交換",2,keys,order=>{const [a,b]=order.map(parseFaceKey),al=G.dice[a[0]][a[1]].level;G.dice[a[0]][a[1]].level=G.dice[b[0]][b[1]].level;G.dice[b[0]][b[1]].level=al;moveNextFloor()},{mode:"levelSwap",noRepeat:true,label:"レベルを交換する2面を選択"})}
function bargainOffer(attr,prev=null){const pool=REWARD_POOL.filter(t=>faceAttr(t)===attr&&t!==prev),base=pool.length?pool:REWARD_POOL.filter(t=>faceAttr(t)===attr);return choice(base)}
function eventBargainShop(){G.bargainOffers={attack:bargainOffer("attack"),defense:bargainOffer("defense"),support:bargainOffer("support")};UI={kind:"bargain",overlayOpen:true};render()}
function buyBargain(attr){if(UI.kind!=="bargain"||G.money<20||!G.bargainOffers)return;const type=G.bargainOffers[attr];if(!type||!allFaces().some(x=>!CURSES.has(x.f.type)&&(x.f.type==="empty"||faceAttr(x.f.type)===attr)))return;G.money-=20;chooseFaceReward(type,()=>{G.bargainOffers[attr]=bargainOffer(attr,type);UI={kind:"bargain",overlayOpen:true};render()},attr,"格安面ショップ")}
function leaveBargain(){G.bargainOffers=null;moveNextFloor()}
function eventCurseGrowth(){UI={kind:"eventScale",value:3,overlayOpen:true};render()}
function resolveCurseGrowth(n){startBundle("呪い＋成長",[{kind:"growth",count:n,title:"イベント成長"},{kind:"curse",count:n,title:"イベントの呪い"}],moveNextFloor,"イベント")}
function eventBasicAwaken(){let n=0;for(const d of G.dice)for(const f of d)if(f.type==="attack"||f.type==="defense"){if(!f.basicAwakened)n++;f.basicAwakened=true}setChoice("通常攻撃・通常防御覚醒",`${n}面を覚醒しました。`,[{label:"次へ",className:"good",onClick:moveNextFloor}],"通常攻撃 3+2Lv→4+3Lv / 通常防御 2+2Lv→3+3Lv","イベント")}
function eventFullHeal(){setChoice("呪いで回復","選択した呪いを受けてから回復します。",[{label:"何もしない",onClick:moveNextFloor},{label:"40%回復＋呪い1",onClick:()=>eventHealChoice(1,.4)},{label:"70%回復＋呪い2",onClick:()=>eventHealChoice(2,.7)},{label:"全回復＋呪い3",className:"danger",onClick:()=>eventHealChoice(3,1)}],"","イベント")}
function eventHealChoice(curses,ratio){grantCurse(curses,()=>{const add=ratio===1?G.maxHp-G.hp:floor(G.maxHp*ratio);G.hp=Math.min(G.maxHp,G.hp+add);moveNextFloor()},"回復イベントの呪い")}

function gameOver(){seq++;addLog(`${G.floor}Fで敗北`);UI={kind:"end",title:"敗北",text:`${G.floor}Fで力尽きた。破滅 ${ruin()}。`};render()}
function gameClear(){seq++;addLog("30F踏破");UI={kind:"end",title:"30F踏破",text:`最終HP ${fmt(G.hp)}/${fmt(G.maxHp)}・破滅 ${ruin()}・所持金 ${fmt(G.money)}G。`};render()}

function hpBarHtml(current,max,preview=null,enemy=false){max=Math.max(1,finite(max,1));const cur=clamp(finite(current,0),0,max),cp=cur/max*100;let ov="";if(preview!=null){const p=clamp(finite(preview,cur),0,max),pp=p/max*100;if(p<cur)ov=`<div class="barLoss" style="left:${pp}%;width:${cp-pp}%"></div>`;else if(p>cur)ov=`<div class="barGain" style="left:${cp}%;width:${pp-cp}%"></div>`}return `<div class="bar ${enemy?"enemyBar":""}"><div class="barFill" style="width:${cp}%"></div>${ov}</div>`}
function screenMode(){if(["combatReady","dicePick","rolling","rerollChoice","curseReflectChoice","combatResult","combatResolving","combatApplied","combatChoose","combatVictoryPause","midHealPause"].includes(UI.kind))return "combat";if(["faceChoice","multiFaceChoice","bundle","choice","shop","bargain","eventScale","reward"].includes(UI.kind))return "edit";return "select"}
function renderMode(){const mode=screenMode();document.body.classList.remove("mode-combat","mode-edit","mode-select","ui-direct-edit","combat-has-rolls");document.body.classList.add(`mode-${mode}`);if(mode==="combat"&&G.combat?.results&&G.combat.revealed>0)document.body.classList.add("combat-has-rolls");if(["faceChoice","multiFaceChoice"].includes(UI.kind))document.body.classList.add("ui-direct-edit")}
function renderStatus(){const C=G.combat,inBattle=!!C&&screenMode()==="combat",hp=inBattle?C.playerHp:G.hp,mx=inBattle?C.playerMax:G.maxHp;document.getElementById("status").innerHTML=`<div class="stat"><span>現在地</span><b>${G.floor===0?"準備":G.floor+"F"}</b></div><div class="stat"><span>HP</span><b>${fmt(Math.max(0,hp))}/${fmt(mx)}</b></div><div class="stat"><span>所持金</span><b>${fmt(G.money)}G</b></div><button class="stat statButton" id="ruinStatus"><span>破滅</span><b>${ruin()}</b></button><button class="guideTopBtn" id="guideTopBtn" aria-label="ガイド" title="ガイド">?</button>`;document.getElementById("ruinStatus").onclick=openRuinInfo;document.getElementById("guideTopBtn").onclick=()=>openGuide("play")}
function renderMap(){document.getElementById("map").innerHTML=Array.from({length:30},(_,i)=>{const f=i+1,k=f===10||f===20?"mid":f===30?"boss":null,mark=k?` milestone ${k==="boss"?"bossNode":""}`:"";return `<div class="node${mark} ${f<G.floor?"done":""} ${f===G.floor?"current":""}" title="${f}F${k?` ${KIND_LABEL[k]}`:""}" aria-label="${f}F${k?` ${KIND_LABEL[k]}`:""}"></div>`}).join("")}
function ruinDetailHtml(){const r=ruin(),marks=[5,10,15,20,25,30,35,40],next=marks.find(x=>r<x);return `<div class="screenResource"><div class="screenResourceTop"><strong>破滅 ${r}</strong><span>${next?`次まで ${next-r}`:"すべて解放"}</span></div><div class="miniRuin"><div class="ruinTrack"><div class="ruinFill" style="width:${Math.min(100,r/40*100)}%"></div>${marks.map(t=>`<i class="ruinMark ${r>=t?"on":""}" style="left:${t/40*100}%"></i>`).join("")}</div></div></div>`}
function openRuinInfo(){const r=ruin(),root=document.getElementById("detailRoot");root.className="detailRoot show";root.innerHTML=`<div class="detailCard tapDismissCard"><div class="modalKicker">破滅効果</div><h3>破滅 ${r}</h3>${ruinDetailHtml()}<div class="ruinInfoList">${RUIN_EFFECTS.map(([t,x])=>`<div class="ruinInfoRow ${r>=t?"active":""}"><strong>${t}</strong><span>${x}</span></div>`).join("")}</div><p class="detailTapHint">タップで閉じる</p></div>`;root.onclick=e=>{e.preventDefault();e.stopPropagation();closeInfo()}}
const GUIDE_TABS=[["play","遊び方"],["faces","面一覧"],["ruin","破滅"],["terms","状態・用語"]];
const GUIDE_FACE_TABS=[
  ["basic","基本面",["attack","defense","defense_support"]],
  ["normal","通常面",REWARD_POOL],
  ["rare","レア面",RARE_POOL],
  ["curseSeries","呪いシリーズ",CURSE_SERIES],
  ["curse","呪い面",CURSE_KEYS],
  ["other","その他",["empty"]]
];
const GUIDE_TERM_TABS=[["status","状態効果"],["display","表示の見方"]];
function guideSubTabsHtml(items,active,two=false){return `<div class="guideSubTabs ${two?"two":""}">${items.map(([id,label])=>`<button class="guideSubTab ${id===active?"active":""}" data-guide-sub="${id}">${label}</button>`).join("")}</div>`}
function guideFaceGroupHtml(title,keys){return `<div class="guideGroup"><div class="guideGroupTitle">${title}</div><div class="guideFaceList">${keys.map(type=>`<div class="guideFaceRow"><b>${EFFECTS[type].name}</b><span>${type==="empty"?effectHelpText(type,1):`Lv1：${effectHelpText(type,1)}`}</span></div>`).join("")}</div></div>`}
function guideTermsStatusHtml(){const sts=[["weak","脱力"],["vulnerable","弱体"],["poison","毒"],["bleed","出血"],["bind","デバフ無効"],["regen","再生"],["reflect","反射"],["barricade","バリケード"]];return `<div class="guideGroup"><div class="guideGroupTitle">状態効果</div><div class="guideTermList">${sts.map(([t,n])=>`<div class="guideTermRow"><b>${n}</b><span>${effectHelpText(t,1,1,true)}</span></div>`).join("")}</div></div>`}
function guideTermsDisplayHtml(){return `<div class="guideGroup"><div class="guideGroupTitle">表示の見方</div><div class="guideTermList"><div class="guideTermRow"><b>Lv</b><span>面のレベルです。高いほどその面の効果が強くなります。</span></div><div class="guideTermRow"><b>T</b><span>ターン経過で効果が発生する残り回数を表します。</span></div><div class="guideTermRow"><b>回</b><span>攻撃面など、対象になる処理の残り回数を表します。</span></div><div class="guideTermRow"><b>防御</b><span>受けるダメージを防ぎます。残った防御は通常、次の自分のターン開始時に半分になります。</span></div></div></div>`}
function guideContentHtml(tab,sub=""){
  if(tab==="faces"){const item=GUIDE_FACE_TABS.find(x=>x[0]===sub)||GUIDE_FACE_TABS[0];return `${guideSubTabsHtml(GUIDE_FACE_TABS,item[0])}${guideFaceGroupHtml(item[1],item[2])}`}
  if(tab==="ruin")return `<div class="guideLead"><strong>破滅とは</strong><p style="margin-top:5px">ダイスにある呪い面のLv合計が破滅になります。呪いを受け入れるほど危険になりますが、一定値ごとに新しい恩恵も解放されます。</p></div>${ruinDetailHtml()}<div class="guideRuinNote">詳しい段階効果は、ゲーム画面上部の「破滅」をタップするといつでも確認できます。</div>`;
  if(tab==="terms"){const active=GUIDE_TERM_TABS.some(x=>x[0]===sub)?sub:"status";return `${guideSubTabsHtml(GUIDE_TERM_TABS,active,true)}${active==="display"?guideTermsDisplayHtml():guideTermsStatusHtml()}`}
  return `<div class="guideLead"><strong>30Fを目指すダイスビルド</strong><p style="margin-top:5px">6個のダイスを育てながら進みます。戦闘では、振った自分の出目を好きな順にタップして使います。</p></div><p>報酬やイベントで面を増やしたり、面のLvを上げたりしてダイスを強くします。</p><p>呪いのLvが増えるほど破滅が進み、危険になる一方で新しい恩恵も解放されます。呪いをどこまで受け入れるかが重要です。</p><p>細かい効果はこの「？」の各タブから確認できます。詳しい破滅の段階効果は、画面上部の「破滅」をタップしてください。</p>`;
}
function openGuide(tab="play",sub=""){if(!GUIDE_TABS.some(x=>x[0]===tab))tab="play";const root=document.getElementById("detailRoot");root.className="detailRoot show";root.innerHTML=`<div class="detailCard tutorialCard guideCard"><div class="guideHead"><div><div class="modalKicker">ガイド</div><h3>ゲームガイド</h3></div><button class="guideClose" id="guideClose" aria-label="ガイドを閉じる">×</button></div><div class="guideTabs">${GUIDE_TABS.map(([id,label])=>`<button class="guideTab ${id===tab?"active":""}" data-guide-tab="${id}">${label}</button>`).join("")}</div><div class="guideBody">${guideContentHtml(tab,sub)}</div></div>`;root.querySelectorAll("[data-guide-tab]").forEach(el=>el.onclick=e=>{e.preventDefault();e.stopPropagation();openGuide(el.dataset.guideTab)});root.querySelectorAll("[data-guide-sub]").forEach(el=>el.onclick=e=>{e.preventDefault();e.stopPropagation();openGuide(tab,el.dataset.guideSub)});document.getElementById("guideClose").onclick=e=>{e.preventDefault();e.stopPropagation();closeInfo()};root.onclick=e=>{if(e.target===root)closeInfo()}}
function openBeginnerGuide(){const root=document.getElementById("detailRoot");root.className="detailRoot show";root.innerHTML=`<div class="detailCard tutorialCard beginnerCard"><div class="guideHead"><div><div class="modalKicker">ガイド</div><h3>初めての方へ</h3></div><button class="guideClose" id="beginnerClose" aria-label="閉じる">×</button></div><div class="beginnerPoints"><div class="beginnerPoint"><strong>30Fを目指します。</strong><br>6個のダイスを育て、戦闘では振った自分の出目を好きな順に使います。</div><div class="beginnerPoint"><strong>報酬やイベントでダイスを強化します。</strong><br>面を増やしたり、面のLvを上げたりして進みます。</div><div class="beginnerPoint"><strong>呪いを受けると破滅が進みます。</strong><br>危険になる一方で、破滅が進むと新しいボーナスも解放されます。</div></div><div class="beginnerGuideNote">詳しい遊び方・面一覧・状態異常などは、画面右上の「？」から確認できます。<br>破滅ボーナスの詳しい内容は、画面上部の「破滅」をタップすると確認できます。</div></div>`;document.getElementById("beginnerClose").onclick=e=>{e.preventDefault();e.stopPropagation();closeInfo()};root.onclick=e=>{if(e.target===root)closeInfo()}}
function faceHtml(f,key,eligible=false,pending=false,preview=null,flag="",extraClass=""){const shown=preview||f,cls=effectTone(shown.type),sub=CURSES.has(shown.type)?`呪Lv${shown.level}`:shown.type==="empty"?"空面":`Lv${shown.level}${shown.basicAwakened?"・覚":""}`;return `<div class="face ${cls} ${eligible?"eligible":"infoTap"} ${pending?"pending previewFace":""} ${extraClass}" data-face="${key}" data-info-type="${shown.type}" data-info-lv="${Math.max(1,shown.level)}" data-info-awakened="${shown.basicAwakened?1:0}">${flag}<span class="name">${EFFECTS[shown.type].name}</span><span class="val">${faceDisplayHtml(shown)}</span><span class="lv">${sub}</span></div>`}
function dieSummary(di){const m={};for(const f of G.dice[di])m[EFFECTS[f.type].name]=(m[EFFECTS[f.type].name]||0)+1;return Object.entries(m).map(([k,v])=>`${k}${v>1?`×${v}`:""}`).join("・")}
function renderDice(){
  const grid=document.getElementById("diceGrid"),below=document.getElementById("combatBelow");below.innerHTML="";
  if(screenMode()==="combat"){
    const C=G.combat;
    const rr=combatSpecialState("reroll");
    grid.classList.toggle("rerollAttention",!!(rr.ready&&!rr.active&&UI.kind==="combatResult"));
    const slot=(di,inner,extra="")=>`<div class="combatDieSlot ${extra}"><button class="combatDieBadge" data-die-inspect="${di}" aria-label="◆${di+1}の6面を見る">◆${di+1}</button>${inner}</div>`;
    if(UI.kind==="dicePick"){
      grid.innerHTML=C.offeredDice.map(di=>slot(di,`<div class="combatDie selectable" data-die="${di}"><span class="combatType">ダイス</span><span class="combatValue">選択</span><span class="lv">${dieSummary(di)}</span></div>`)).join("")+(ruin()>=40?'<div class="combatDieSlot"><div class="combatDieBadgeSpacer"></div><div class="combatDie combatPlaceholder"></div></div>':"");
      grid.querySelectorAll("[data-die]").forEach(el=>el.onclick=()=>chooseFixedDie(+el.dataset.die));bindCombatDieBadges();return;
    }
    if(!C.results){
      grid.innerHTML=`${C.selectedDice.map(di=>slot(di,'<div class="combatDie combatWaiting"></div>')).join("")}<div class="combatRollPromptOverlay">タップでダイスを振る</div>`;bindCombatDieBadges();return;
    }
    let selList=combatSelectableIndices(C,UI.kind);
    if(UI.kind==="combatResult"&&C.openingCursePending)selList=[];
    const sel=new Set(selList);
    grid.innerHTML=C.results.map((r,i)=>{const inner=i<C.revealed?`<div class="combatDie combatInfoHold ${effectTone(r.type)} ${r.used?"processed":""} ${sel.has(i)?"selectable":""}" data-roll="${i}" data-info-type="${r.type}" data-info-lv="${r.level}" data-info-awakened="${r.basicAwakened?1:0}"><span class="combatType">${EFFECTS[r.type].name}</span><span class="combatValue">${faceDisplayHtml(r)}</span><span class="lv">Lv${r.level}</span></div>`:'<div class="combatDie combatPlaceholder"></div>';return slot(r.die,inner)}).join("");
    bindCombatLongPress();bindCombatDieBadges();
    if(UI.kind==="rerollChoice")grid.querySelectorAll("[data-roll].selectable").forEach(el=>el.onclick=e=>{if(consumeCombatLongPress(e.target)){e.preventDefault();e.stopPropagation();return}e.stopPropagation();rerollResult(+el.dataset.roll)});
    if(UI.kind==="curseReflectChoice")grid.querySelectorAll("[data-roll].selectable").forEach(el=>el.onclick=e=>{if(consumeCombatLongPress(e.target)){e.preventDefault();e.stopPropagation();return}e.stopPropagation();reflectCurseResult(+el.dataset.roll)});
    if(UI.kind==="combatResult")grid.querySelectorAll("[data-roll].selectable").forEach(el=>el.onclick=e=>{if(consumeCombatLongPress(e.target)){e.preventDefault();e.stopPropagation();return}e.stopPropagation();chooseCombatResultFace(+el.dataset.roll)});
    if(UI.kind==="combatChoose")grid.querySelectorAll("[data-roll].selectable").forEach(el=>el.onclick=e=>{if(consumeCombatLongPress(e.target)){e.preventDefault();e.stopPropagation();return}e.stopPropagation();chooseCombatFace(+el.dataset.roll)});
    if(C.alt&&["combatChoose","combatResolving"].includes(UI.kind)){below.innerHTML=combatActionHistoryHtml(C,UI.kind==="combatChoose"?"未処理の面をタップ":"処理中");}
    if(UI.kind==="combatResolving"&&C.resolveIndex>=0&&C.resolveSteps.length){const st=C.resolveSteps[C.resolveIndex];below.innerHTML=`<div class="processLine"><strong>${st.label}</strong><span>${st.text}</span></div>`}else if(UI.kind==="combatApplied")below.innerHTML=combatSummaryHtml();
    return;
  }
  grid.classList.remove("rerollAttention");
  const isSingle=UI.kind==="faceChoice",isMulti=UI.kind==="multiFaceChoice",selection=isSingle||isMulti,allowed=selection?UI.allowedKeys:new Set(),pending=isSingle&&UI.pendingFace?`${UI.pendingFace[0]}:${UI.pendingFace[1]}`:null,min=UI.meta?.mode==="curse"?(UI.meta.minimum??Math.min(...allFaces().map(x=>x.f.level))):null;
  grid.innerHTML=G.dice.map((d,di)=>`<div class="die"><div class="faces">${d.map((f,fi)=>{
    const k=`${di}:${fi}`,el=allowed.has(k),pd=pending===k;let pv=null,flag="";
    if(isSingle&&UI.meta?.mode==="aggregateCurse"&&el)pv=pd?previewFace(f,UI.meta||{}):makeFace("empty",0);else if(pd)pv=previewFace(f,UI.meta||{});
    if(isMulti&&multiCount(k)>0){const mode=UI.meta?.mode;if(mode==="growth")pv={...f,level:f.level+multiCount(k)};else if((mode==="swap"||mode==="levelSwap")&&UI.order.length===2){const other=UI.order.find(x=>x!==k);if(other){const [odi,ofi]=parseFaceKey(other),of=G.dice[odi][ofi];pv=mode==="swap"?{...of}:{...f,level:of.level}}}else pv=f;flag=`<span class="previewFlag">${mode==="growth"?`×${multiCount(k)}`:"選択"}</span>`}
    const minimum=isSingle&&UI.meta?.mode==="curse"&&f.level===min,extra=[selection&&!el?"dimmed":"",minimum?"minimum":"",selectionFaceClass(UI.meta||{},f,el)].filter(Boolean).join(" ");if(minimum)flag+='<span class="minFlag">▼</span>';
    return faceHtml(f,k,el,pd,pv,flag,extra)
  }).join("")}</div></div>`).join("");
