+30% 次の行動順判定から5回",5],["治癒","support","heal",30,7,8,0,0,1,"最大HPの30%を即時回復、補充なし",0],["斬撃","attack","strike",35,6,8,1,1,2,"威力35 ダメージ計算",0],["強斬撃","attack","strike",55,9,10,1,0,2,"威力55 ダメージ計算",0],["必殺斬り","attack","strike",85,13,13,0,0,1,"威力85 補充なし",0],["連撃","attack","double",24,9,11,1,0,1,"威力24で2回攻撃・会心個別判定",0],["貫通撃","attack","pierce",24,10,11,1,0,1,"敵の防御力を参照せず攻撃力×24%で基本ダメージ",0],["吸収撃","attack","drain",27,9,11,1,0,1,"威力27 ダメージの実損害分HPを回復",0],["毒","support","poison",5,10,11,0,0,1,"敵の行動終了後に現在HP×5%（重複加算）、5回発動、補充なし",5],["成長結晶","support","unusable",0,24,12,0,0,1,"戦闘中使用不可・温存で成長ポイントを獲得",0]],"敵・階層":[["階層","種類","HP","攻撃","防御","素早さ","備考"],[1,"戦闘",15,8,8,11,"runner検証仮値（未確定）"],[2,"戦闘",19,9,9,11,"runner検証仮値（未確定）"],[3,"ショップ","","","","","仮配置"],[4,"戦闘",22,10,10,12,"runner検証仮値（未確定）"],[5,"戦闘",25,12,10,12,"runner検証仮値（未確定）"],[6,"ショップ","","","","","仮配置"],[7,"戦闘",29,13,11,13,"runner検証仮値（未確定）"],[8,"戦闘",32,14,12,14,"runner検証仮値（未確定）"],[9,"ショップ","","","","","仮配置"],[10,"ボス",62,18,13,16,"runner検証仮値（未確定）"],[11,"戦闘",32,26,13,16,"runner検証仮値：11階以降の攻撃+5（温存バランス調整、2026-10-10）"],[12,"ショップ","","","","","仮配置"],[13,"戦闘",35,29,14,17,"runner検証仮値：11階以降の攻撃+5（温存バランス調整、2026-10-10）"],[14,"ショップ","","","","","仮配置"],[15,"戦闘",37,31,15,18,"runner検証仮値：11階以降の攻撃+5（温存バランス調整、2026-10-10）"],[16,"ショップ","","","","","仮配置"],[17,"戦闘",41,33,16,19,"runner検証仮値：11階以降の攻撃+5（温存バランス調整、2026-10-10）"],[18,"ショップ","","","","","仮配置"],[19,"戦闘",45,37,17,20,"runner検証仮値：11階以降の攻撃+5（温存バランス調整、2026-10-10）"],[20,"ボス",77,58,19,24,"runner検証仮値：11階以降の攻撃+5（温存バランス調整、2026-10-10）"]],"ショップ":[["コード（変更不可）","値","意味","確定状況"],["battle_coin",4,"勝利時の獲得通貨","仮"],["boss_coin_bonus",3,"ボス撃破時の追加通貨","仮"],["shop_heal_cost",5,"ショップ回復費用","仮"],["shop_heal_amount",22,"有料回復量（不足HPまで）","仮"],["bot_shop_heal_min_missing",12,"Botが有料回復する最低減少HP","Bot仮"],["shop_remove_cost",7,"カード削除費用","仮"],["bot_shop_remove_min_deck",11,"Botがカード削除を検討する最低デッキ枚数（超過条件）","Bot仮"],["bot_shop_remove_min_copies",2,"Botが手札交換を削除する最低重複数","Bot仮"],["shop_offer_count",3,"ショップの商品提示数","仮"],["reward_offer_count",3,"戦闘報酬のカード提示数","仮"],["bot_deck_size_limit",20,"Botがカード追加を控えるデッキ枚数","Bot仮"]]};
const CFG=Object.fromEntries(TABLES['基本・成長'].slice(1).map(r=>[r[0],r[1]]));
const SHOP=Object.fromEntries(TABLES['ショップ'].slice(1).map(r=>[r[0],r[1]]));
const CARDS=Object.fromEntries(TABLES['カード'].slice(1).map(r=>[r[0],{name:r[0],kind:r[1],effect:r[2],value:+r[3],gp:+r[4],price:+r[5],replace:+r[6],initial:+r[7],weight:+r[8],desc:r[9],duration:+r[10]}]));
const FLOORS=Object.fromEntries(TABLES['敵・階層'].slice(1).map(r=>[+r[0],{type:r[1],hp:+r[2],attack:+r[3],defense:+r[4],speed:+r[5]}]));
const REWARDS=TABLES['カード'].slice(1).flatMap(r=>Array(+r[8]).fill(r[0]));
const STORAGE='monster-growth-demo-20261010-v1';
const app=document.getElementById('app'),overlay=document.getElementById('overlay');
let state=null, modal=null;
function h(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sampleWeighted(n){let a=REWARDS.slice(),o=[];for(let i=0;i<n&&a.length;i++){o.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);}return o;}
function save(){try{if(state)localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){}}
function load(){try{let raw=localStorage.getItem(STORAGE);if(!raw)return null;let x=JSON.parse(raw);return x&&x.version===1&&x.monster&&x.deck&&x.phase?x:null;}catch(e){return null;}}
function log(message){state.log.unshift(message);if(state.log.length>60)state.log.length=60;}
function total(kind){return state.battle.effects.reduce((n,e)=>n+(e.kind===kind&&e.remaining>0?e.value:0),0);}
function tick(kind){const b=state.battle;b.effects.forEach(e=>{if(e.kind===kind&&e.remaining>0)e.remaining--;});b.effects=b.effects.filter(e=>e.remaining>0);}
function speed(friendly){let x=friendly?state.monster:state.battle.enemy;return Math.max(1,Math.ceil(x.speed*(100+(friendly?total('speed_buff'):0))/100));}
function hpbar(hp,max,player=false){return `<div class="health ${player?'player':''}"><div style="width:${Math.max(0,100*hp/max)}%"></div></div>`;}
function cost(stat){return +CFG[`cost_${stat}_base`]+state.upgrades[stat]*(+CFG[`cost_${stat}_step`]);}
function statval(name){return name==='hp'?state.monster.maxHp:state.monster[name];}
function earnCount(){return state.deck.reduce((n,name)=>n+CARDS[name].gp,0);}
function title(){let kind=FLOORS[state.floor]?.type||'完走';return `${state.floor} / 20階 · ${kind}`;}
function fresh(){state={version:1,phase:'home',floor:1,monster:{maxHp:+CFG.initial_hp,hp:+CFG.initial_hp,attack:+CFG.initial_attack,defense:+CFG.initial_defense,speed:+CFG.initial_speed},points:0,coins:0,deck:TABLES['カード'].slice(1).flatMap(r=>Array(+r[7]).fill(r[0])),upgrades:{hp:0,attack:0,defense:0,speed:0},battle:null,log:[],earned:0,offers:[],shop:{bought:false,removed:false,healed:false},totalBattles:0,totalUsed:0};save();render();}
function newGame(){fresh();startFloor();}
function startFloor(){if(state.floor>20){state.phase='clear';save();render();return;}if(FLOORS[state.floor].type==='ショップ')startShop();else startBattle();}
function draw(n){let b=state.battle;for(let i=0;i<n;i++){if(!b.draw.length)break;b.hand.push(b.draw.pop());}}
function startBattle(){const f=FLOORS[state.floor];state.phase='battle';state.battle={enemy:{hp:f.hp,maxHp:f.hp,attack:f.attack,defense:f.defense,speed:f.speed},hand:[],draw:shuffle(state.deck.slice()),used:[],effects:[],round:0,mainDone:false,playerFirst:null,snapshot:[0,0],turn:'',damageTaken:0};state.log=[];draw(+CFG.initial_hand);log(`${state.floor}階：${f.type==='ボス'?'ボス':'敵'}が現れました。`);startRound();}
function startRound(){if(state.phase!=='battle')return;const b=state.battle;b.round++;b.mainDone=false;let a=speed(true),e=speed(false);b.snapshot=[a,e];b.playerFirst=a===e?Math.random()<.5:a>e;tick('speed_buff');log(`${b.round}ターン目：${b.playerFirst?'こちらが先攻':'敵が先攻'}。`);if(!b.playerFirst){enemyAct();if(state.phase!=='battle')return;}b.turn='player';save();render();}
function critLevels(friendly){const b=state.battle;const diff=friendly?b.snapshot[0]-b.snapshot[1]:b.snapshot[1]-b.snapshot[0];const rate=Math.max(0,+CFG.crit_base+Math.max(0,diff)*(+CFG.crit_speed_step));const guaranteed=Math.floor(rate);return guaranteed+(Math.random()<rate-guaranteed?1:0);}
function baseDamage(friendly,power,pierce=false){const actor=friendly?state.monster:state.battle.enemy;const target=friendly?state.battle.enemy:state.monster;if(pierce)return Math.max(1,actor.attack*power/100);return Math.max(1,power*actor.attack/(Math.max(1,target.defense)*CFG.damage_divisor));}
function hit(friendly,power,pierce=false){const target=friendly?state.battle.enemy:state.monster;const base=baseDamage(friendly,power,pierce);const buff=friendly?total('attack_buff'):0;const reduction=friendly?0:total('defense_buff');const level=critLevels(friendly);const multi=Math.max(0,1+buff/100+level*(+CFG.crit_multiplier-1)-reduction/100);const nominal=Math.max(0,Math.ceil(base*multi-1e-12));const actual=Math.min(target.hp,nominal);target.hp-=actual;if(!friendly)state.battle.damageTaken+=actual;return {actual,nominal,level};}
function fmtHit(label,x){return `${label}：${x.actual}ダメージ${x.level?'（会心'+(x.level>1?'×'+x.level:'')+'）':''}${x.actual===0?'（無効化）':''}`;}
function enemyAct(){if(state.phase!=='battle')return;const b=state.battle;const power=b.round%CFG.enemy_strong_period===0?+CFG.enemy_power_strong:+CFG.enemy_power_normal;const x=hit(false,power);log(fmtHit('敵'+(power===+CFG.enemy_power_strong?'の強攻撃':'の攻撃'),x));tick('defense_buff');if(state.monster.hp<=0){lose();return;}if(b.enemy.hp>0){let poison=total('poison');if(poison){let dealt=Math.min(b.enemy.hp,Math.ceil(b.enemy.hp*poison/100-1e-12));b.enemy.hp-=dealt;log(`毒：敵に${dealt}ダメージ。`);}tick('poison');if(b.enemy.hp<=0){win();return;}}}
function checkWin(){if(state.battle.enemy.hp<=0){win();return true;}return false;}
function mainAction(type,cardIndex){if(state.phase!=='battle')return;const b=state.battle;if(b.turn!=='player'||b.mainDone)return;
 if(type==='attack'){
  const name=b.hand[cardIndex],c=CARDS[name];if(!c||c.kind!=='attack')return;b.hand.splice(cardIndex,1);b.used.push(name);
  if(c.effect==='double'){for(let i=0;i<2;i++){let x=hit(true,c.value);log(fmtHit(`${name} ${i+1}撃目`,x));if(b.enemy.hp<=0)break;}}
  else{let x=hit(true,c.value,c.effect==='pierce');log(fmtHit(name,x));if(c.effect==='drain'){const heal=Math.min(state.monster.maxHp-state.monster.hp,x.actual);state.monster.hp+=heal;if(heal)log(`吸収撃でHPを${heal}回復。`);}}
  draw(c.replace);
 }else if(type==='normal'){log(fmtHit('通常攻撃',hit(true,+CFG.normal_power)));}
 else if(type==='draw'){if(b.draw.length){draw(1);log('山札から1枚ドローしました。');}else{log('山札が空です。');return;}}
 else return;
 b.mainDone=true;tick('attack_buff');if(checkWin())return;save();render();}
function endTurn(){if(state.phase!=='battle')return;const b=state.battle;if(!b.mainDone)return;if(b.playerFirst){enemyAct();if(state.phase!=='battle')return;}startRound();}
function support(index){if(state.phase!=='battle'||state.battle.turn!=='player')return;const name=state.battle.hand[index],c=CARDS[name];if(!c||c.kind!=='support'||c.effect==='unusable')return;if(c.effect==='exchange'){modal={type:'exchange',source:index,selected:[]};renderModal();return;}applySupport(index,[]);}
function applySupport(index,exchangeIndexes){const b=state.battle;const name=b.hand[index],c=CARDS[name];if(!c||c.kind!=='support'||c.effect==='unusable')return;
 b.hand.splice(index,1);b.used.push(name);log(`${name}を使用（成長P ${c.gp}を放棄）。`);
 if(['attack_buff','defense_buff','speed_buff','poison'].includes(c.effect)){b.effects.push({kind:c.effect,value:c.value,remaining:c.duration});}
 else if(c.effect==='heal'){const amount=Math.min(state.monster.maxHp-state.monster.hp,Math.ceil(state.monster.maxHp*c.value/100));state.monster.hp+=amount;log(`HPを${amount}回復。`);}
 else if(c.effect==='draw'){draw(c.value);}
 else if(c.effect==='exchange'){
  const chosen=exchangeIndexes.map(i=>({i:i>index?i-1:i})).sort((a,b)=>b.i-a.i);
  const cards=chosen.map(o=>b.hand.splice(o.i,1)[0]).filter(Boolean);b.draw.push(...cards);shuffle(b.draw);draw(cards.length);log(`${cards.length}枚を山札へ戻して引き直しました。`);
 }
 draw(c.replace);save();render();}
function win(){if(state.phase!=='battle')return;const b=state.battle;const totalPoints=earnCount();const used=b.used.reduce((v,name)=>v+CARDS[name].gp,0);const gained=totalPoints-used;state.points+=gained;state.earned=gained;state.coins+=+SHOP.battle_coin+(FLOORS[state.floor].type==='ボス'?+SHOP.boss_coin_bonus:0);state.totalBattles++;state.totalUsed+=b.used.length;log(`勝利！ 未使用カードから成長P ${gained}獲得。`);
 if(state.floor===20){state.monster.hp=state.monster.maxHp;state.phase='clear';}else{state.phase='growth';}
 save();render();}
function lose(){state.phase='gameover';log(`${state.floor}階で敗北しました。`);save();render();}
function upgrade(stat){if(state.phase!=='growth')return;let price=cost(stat);if(state.points<price)return;state.points-=price;state.upgrades[stat]++;if(stat==='hp'){state.monster.maxHp+=+CFG.hp_growth;state.monster.hp+=+CFG.hp_growth;}else{state.monster[stat]+=+CFG.other_growth;}save();render();}
function toReward(){if(state.phase!=='growth')return;state.offers=sampleWeighted(+SHOP.reward_offer_count);state.phase='reward';save();render();}
function takeReward(index){if(state.phase!=='reward')return;if(index>=0){let name=state.offers[index];if(!name)return;state.deck.push(name);}if(FLOORS[state.floor].type==='ボス'){state.monster.hp=state.monster.maxHp;}nextFloor();}
function nextFloor(){state.floor++;state.offers=[];save();startFloor();}
function startShop(){state.phase='shop';state.shop={bought:false,removed:false,healed:false};state.offers=sampleWeighted(+SHOP.shop_offer_count);save();render();}
function buy(i){if(state.phase!=='shop'||state.shop.bought)return;const name=state.offers[i],c=CARDS[name];if(!c||state.coins<c.price)return;state.coins-=c.price;state.deck.push(name);state.shop.bought=true;save();render();}
function healShop(){if(state.phase!=='shop'||state.shop.healed||state.coins<SHOP.shop_heal_cost||state.monster.hp>=state.monster.maxHp)return;state.coins-=+SHOP.shop_heal_cost;state.monster.hp=Math.min(state.monster.maxHp,state.monster.hp+ +SHOP.shop_heal_amount);state.shop.healed=true;save();render();}
function removeShop(i){if(state.phase!=='shop'||state.shop.removed||state.coins<SHOP.shop_remove_cost||state.deck.length<2)return;if(i<0||i>=state.deck.length)return;state.deck.splice(i,1);state.coins-=+SHOP.shop_remove_cost;state.shop.removed=true;modal=null;save();render();}
function section(label,headline,hint=''){return `<div class="sectiontop"><div><div class="eyebrow">${label}</div><h1>${headline}</h1>${hint?`<div class="hint">${hint}</div>`:''}</div></div>`;}
function button(action,label,cls='',disabled=false,more=''){return `<button type="button" class="btn ${cls}" data-action="${action}" ${disabled?'disabled':''} ${more}>${label}</button>`;}
function cardHtml(name,i,where){const c=CARDS[name],attack=c.kind==='attack',unusable=c.effect==='unusable';const playable=where==='hand'&&state.battle.turn==='player'&&!unusable&&(!attack||!state.battle.mainDone);const offer=where==='reward'||where==='shop';const cantShop=where==='shop'&&(state.shop.bought||c.price>state.coins);const disabled=where==='hand'?!playable:where==='shop'?cantShop:false;const act=where==='hand'?'play-card':where==='reward'?'take-reward':'buy';const desc=where==='hand'&&!playable&&attack&&state.battle.mainDone?'このターンは攻撃済み':c.desc;return `<button type="button" class="card ${attack?'attack':''} ${unusable?'unusable':''} ${disabled?'disabled':''}" data-action="${act}" data-index="${i}" ${disabled?'disabled':''}><span class="kind">${attack?'ATTACK':'SUPPORT'} ${c.replace?' · 補充'+c.replace:' · 補充なし'}</span><span class="name">${h(name)}</span><span class="desc">${h(desc)}</span><span class="bottom"><span class="tag">${offer?'価格 '+c.price+'コイン':unusable?'使用不可':'使用'} </span><span class="tag">温存 ＋${c.gp}P</span></span></button>`;}
function progress(){let s='';for(let i=1;i<=20;i++)s+=`<i class="${i<state.floor?'done':i===state.floor?'now':''}" title="${i}階・${FLOORS[i].type}"></i>`;return `<div class="floors" aria-label="進行状況">${s}</div>`;}
function header(){const m=state.monster;return `<header class="head"><div><div class="brand">モンスター育成 <em>DEMO</em></div><div class="subbrand">カードを使って生き残るか、残して育てるか。</div></div><div class="controls">${button('help','遊び方','ghost tiny')}${button('deck','デッキ','ghost tiny')}${button('reset-confirm','最初から','ghost tiny')}</div></header>${progress()}<div class="stats"><div class="stat hp"><small>HP</small><strong>${m.hp}<small style="display:inline;font-size:12px"> / ${m.maxHp}</small></strong></div><div class="stat"><small>攻撃</small><strong>${m.attack}</strong></div><div class="stat"><small>防御</small><strong>${m.defense}</strong></div><div class="stat"><small>素早さ</small><strong>${m.speed}</strong></div><div class="stat money"><small>成長ポイント</small><strong>${state.points}</strong></div><div class="stat money"><small>コイン</small><strong>${state.coins}</strong></div></div>`;}
function renderBattle(){const b=state.battle,e=b.enemy,m=state.monster;let buffs=b.effects.filter(x=>x.remaining>0).map(x=>`<span class="pill">${{attack_buff:'攻撃増幅',defense_buff:'ダメージ軽減',speed_buff:'加速',poison:'毒'}[x.kind]} ${x.value}% ・残${x.remaining}</span>`).join('');
let mainDisabled=b.mainDone;
return section('BATTLE',title(),`残り山札 ${b.draw.length} 枚 ／ 使用済み ${b.used.length} 枚 ／ 未使用なら最大 ${earnCount()}P`)+`<div class="twocol"><div><div class="panel"><div class="enemy"><div class="enemy-title"><strong>${FLOORS[state.floor].type==='ボス'?'BOSS':'ENEMY'}</strong><small>HP ${e.hp} / ${e.maxHp}</small></div>${hpbar(e.hp,e.maxHp)}<div class="enemy-stats"><span>攻撃 ${e.attack}</span><span>防御 ${e.defense}</span><span>素早さ ${e.speed}</span></div></div><div class="battlecenter"><div class="round">ROUND ${b.round}</div><div class="turn-note">${b.mainDone?'行動済み · 補助カードを使うかターン終了':'あなたの行動'}</div><div class="hint">行動順：${b.playerFirst?'自分 → 敵':'敵 → 自分'} ／ 自分HP ${m.hp} / ${m.maxHp}</div></div>${hpbar(m.hp,m.maxHp,true)}<div class="choices">${button('normal','通常攻撃','primary',mainDisabled)}${button('draw','1枚ドロー','',mainDisabled||!b.draw.length)}${button('end-turn','ターン終了','gold',!b.mainDone)}</div><div class="hint">通常攻撃・攻撃カード・1枚ドローのうち、毎ターン1つを選択。補助カードは行動の前後に何枚でも使用できます。</div>${buffs?`<div class="space"></div>${buffs}`:''}</div><div class="space"></div><div class="panel"><div class="splithead"><strong>手札（${b.hand.length}枚）</strong><span class="hint">使用すると成長Pなし</span></div><div class="space"></div>${b.hand.length?`<div class="cardgrid">${b.hand.map((n,i)=>cardHtml(n,i,'hand')).join('')}</div>`:'<div class="empty">手札は空です。山札があればドローできます。</div>'}</div></div><div><div class="panel"><div class="splithead"><strong>戦闘ログ</strong><span class="hint">新しい順</span></div><div class="space"></div><ul class="log">${state.log.map((v,i)=>`<li class="${i===0?'new':''}">${h(v)}</li>`).join('')}</ul></div><div class="space"></div><div class="panel"><strong>現在の損得</strong><div class="space"></div><div class="hint">温存予定：${(earnCount()-b.used.reduce((n,x)=>n+CARDS[x].gp,0))}P<br>今回使用したカード：${b.used.length}枚<br>被ダメージ合計：${b.damageTaken}<br>この戦闘で減ったHPは次の戦闘に持ち越されます。</div></div></div></div>`;}
function renderGrowth(){const m=state.monster;const arr=[['hp','最大HP',`＋${CFG.hp_growth}`],['attack','攻撃力',`＋${CFG.other_growth}`],['defense','防御力',`＋${CFG.other_growth}`],['speed','素早さ',`＋${CFG.other_growth}`]];return section('GROWTH',`${state.floor}階 勝利！`,`未使用カードから ${state.earned}P 獲得しました。好きな能力を何回でも育てられます。`)+`<div class="panel"><div class="banner"><h2>獲得 ${state.earned}P</h2><p>所持ポイント：<strong>${state.points}P</strong> ／ ポイントは次の階層へ持ち越せます。</p></div><div class="space"></div><div class="utility">${arr.map(([key,label,plus])=>`<div class="upgrade"><div><strong>${label} <span class="mono">${statval(key)}</span></strong><small>1回の成長 ${plus} ／ 必要 ${cost(key)}P</small></div>${button('upgrade','＋','primary tiny',state.points<cost(key),`data-stat="${key}"`)}</div>`).join('')}</div><div class="resultnav">${button('to-reward','報酬カードを選ぶ →','gold')}</div></div>`;}
function renderReward(){return section('REWARD','報酬カードを1枚選択',`デッキに追加します。不要ならスキップできます。現在 ${state.deck.length} 枚。`)+`<div class="panel"><div class="cardgrid">${state.offers.map((n,i)=>cardHtml(n,i,'reward')).join('')}</div><div class="resultnav">${button('skip-reward','今回は追加しない','ghost')}</div><hr class="divider"><div class="note">カードを増やすと毎戦の獲得可能な成長ポイントは増えますが、必要なカードを引きにくくなることがあります。</div></div>`;}
function renderShop(){const missing=state.monster.maxHp-state.monster.hp;return section('SHOP',`${state.floor}階 · ショップ`,`コインでカード購入・デッキ整理・HP回復ができます。各サービスは1回ずつです。`)+`<div class="panel"><div class="splithead"><strong>カードを購入（1枚まで）</strong><span class="cardprice">所持 ${state.coins}コイン</span></div><div class="space"></div><div class="cardgrid">${state.offers.map((n,i)=>cardHtml(n,i,'shop')).join('')}</div><hr class="divider"><div class="utility"><div class="upgrade"><div><strong>HP回復</strong><small>費用 ${SHOP.shop_heal_cost}コイン ／ 最大${SHOP.shop_heal_amount}回復<br>減少HP ${missing}</small></div>${button('shop-heal','回復','primary tiny',state.shop.healed||state.coins<SHOP.shop_heal_cost||missing===0)}</div><div class="upgrade"><div><strong>カード削除</strong><small>費用 ${SHOP.shop_remove_cost}コイン ／ 1枚</small></div>${button('shop-remove','選択','tiny',state.shop.removed||state.coins<SHOP.shop_remove_cost||state.deck.length<2)}</div></div><div class="resultnav">${button('shop-next','次の階へ →','gold')}</div></div>`;}
function renderEnd(clear){return `<div class="panel hero"><div class="eyebrow">${clear?'DEMO COMPLETE':'GAME OVER'}</div><h1>${clear?'20階クリア！':'冒険終了'}</h1><p>${clear?'最終ボスを撃破しました。':'今回は'+state.floor+'階で敗北しました。'}<br>戦闘 ${state.totalBattles}勝 ／ 使用したカード ${state.totalUsed}枚 ／ デッキ ${state.deck.length}枚</p><div class="resultnav">${button('reset-confirm','新しく始める','primary')}${button('deck','デッキを見る','ghost')}</div></div>`;}
function renderHome(){return `<div class="panel hero"><div class="eyebrow">DEMO · 20 FLOORS</div><h1>モンスター育成</h1><p>戦闘カードを使えば今を生き残れる。<br>使わずに残したカードは、戦闘後の成長ポイントになる。<br><br>1体のモンスターを育て、20階のボスを目指します。</p><div class="resultnav">${button('start','冒険を始める','primary')}${button('help','遊び方','ghost')}</div><div class="space"></div><div class="hint">初期デッキ ${state.deck.length}枚 ／ 初期手札 ${CFG.initial_hand}枚</div></div>`;}
function render(){if(!state){fresh();return;}let main=state.phase==='home'?renderHome():state.phase==='battle'?renderBattle():state.phase==='growth'?renderGrowth():state.phase==='reward'?renderReward():state.phase==='shop'?renderShop():renderEnd(state.phase==='clear');app.innerHTML=header()+main+`<div class="footer">モンスター育成 DEMO · 検証設定 2026-10-10 · 進行はこの端末に自動保存されます</div>`;renderModal();}
function closeModal(){modal=null;renderModal();}
function renderModal(){if(!modal){overlay.innerHTML='';return;}let body='';if(modal.type==='help'){
 body=`<h2>遊び方</h2><p>各戦闘では、通常攻撃・攻撃カード・1枚ドローのいずれか1回を選びます。補助カードは自分の行動の前後に何枚でも使用できます。</p><p>使ったカードはその戦闘で消費され、勝利時には使わなかったカード（手札・山札を含む）の成長ポイントを獲得します。次の戦闘では使用済みカードも復活します。</p><p>成長ポイントは4能力に自由に割り振れます。HPの減少は持ち越し、10・20階のボス勝利後は全回復します。</p><p>素早さが高い方が先攻。同値ならランダム。会心は基本5%、素早さ差が1増えるたび＋5ポイント。会心率100%ごとに基本ダメージ＋50%、余りの確率でもう1段階発生。敵にも同じです。</p><p>カードの「成長＋P」は使用するとその戦闘では獲得できなくなります。ショップではカード購入・削除・HP回復ができます。</p>`;
 }else if(modal.type==='deck'){
 const counts={};state.deck.forEach(n=>counts[n]=(counts[n]||0)+1);
 body=`<h2>デッキ ${state.deck.length}枚</h2><p>未使用時の合計成長ポイント：${earnCount()}P</p><div class="decklist">${Object.entries(counts).map(([n,c])=>`<div class="deckrow">${h(n)} ×${c}<div class="hint">${CARDS[n].gp}P / 枚</div></div>`).join('')}</div>`;
 }else if(modal.type==='reset'){
 body=`<h2>初めからやり直す</h2><p>現在の進行を消して1階から始めます。よろしいですか？</p><div class="resultnav">${button('new-game','新しいゲーム','danger')}${button('close-modal','キャンセル','ghost')}</div>`;
 }else if(modal.type==='exchange'){
 const b=state.battle;const candidates=b.hand.map((n,i)=>({n,i})).filter(x=>x.i!==modal.source);const needed=Math.min(+CARDS['手札交換'].value,candidates.length);
 body=`<h2>手札交換</h2><p>山札に戻すカードを${needed}枚選びます。選んだカードは未使用扱いのまま引き直します。</p><div class="decklist">${candidates.map(x=>`<button type="button" class="deckrow ${modal.selected.includes(x.i)?'chosen':''}" data-action="exchange-toggle" data-index="${x.i}">${h(x.n)}<div class="hint">温存 ${CARDS[x.n].gp}P</div></button>`).join('')}</div><div class="resultnav">${button('exchange-ok',`交換する（${modal.selected.length}/${needed}）`,'primary',modal.selected.length!==needed)}${button('close-modal','やめる','ghost')}</div>`;
 }else if(modal.type==='remove'){
 body=`<h2>カードを1枚削除</h2><p>デッキから1枚を永久に削除します（${SHOP.shop_remove_cost}コイン）。</p><div class="decklist">${state.deck.map((n,i)=>`<button type="button" class="deckrow" data-action="remove-card" data-index="${i}">${h(n)}<div class="hint">未使用 ${CARDS[n].gp}P</div></button>`).join('')}</div>`;
 }
 overlay.innerHTML=`<div class="modalback" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="操作ウィンドウ">${body}<hr class="divider">${button('close-modal','閉じる','ghost tiny')}</div></div>`;
}
function dispatch(action,node){let idx=+node.dataset.index;switch(action){case 'help':modal={type:'help'};renderModal();break;case 'deck':modal={type:'deck'};renderModal();break;case 'reset-confirm':modal={type:'reset'};renderModal();break;case 'close-modal':closeModal();break;case 'backdrop':closeModal();break;case 'new-game':modal=null;newGame();break;case 'start':startFloor();break;case 'normal':mainAction('normal');break;case 'draw':mainAction('draw');break;case 'end-turn':endTurn();break;case 'play-card':if(state.battle){if(CARDS[state.battle.hand[idx]]?.kind==='attack')mainAction('attack',idx);else support(idx);}break;case 'upgrade':upgrade(node.dataset.stat);break;case 'to-reward':toReward();break;case 'take-reward':takeReward(idx);break;case 'skip-reward':takeReward(-1);break;case 'buy':buy(idx);break;case 'shop-heal':healShop();break;case 'shop-remove':modal={type:'remove'};renderModal();break;case 'remove-card':removeShop(idx);break;case 'shop-next':nextFloor();break;case 'exchange-toggle':{let arr=modal.selected;let pos=arr.indexOf(idx);if(pos>=0)arr.splice(pos,1);else if(arr.length<Math.min(2,state.battle.hand.length-1))arr.push(idx);renderModal();break;}case 'exchange-ok':{const from=modal.source,sel=modal.selected.slice();const need=Math.min(2,state.battle.hand.length-1);if(sel.length===need){modal=null;applySupport(from,sel);}break;}}
}
document.addEventListener('click',function(event){let node=event.target.closest('[data-action]');if(!node)return;const a=node.dataset.action;if(a==='backdrop'&&node!==event.target)return;if(node.disabled)return;dispatch(a,node);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){closeModal();}});
state=load();if(!state)fresh();else render();
</script></body></html>
