function header(){const d=game.day>=31?'最終戦':`${game.day} / 30 日`;return `<header class="top"><div><div class="eyebrow">TECHNIQUE DISCOVERY RPG — DEMO</div><div class="brand">技育成</div></div><div class="controls"><button class="btn small ghost" data-a="book">技図鑑 ${game.known.length}/35</button><button class="btn small ghost" data-a="reset">最初から</button></div></header>`}
function sidebar(){const c=game.counts;return `<aside class="side"><h2>育成状況</h2><div class="split"><strong>${game.day>=31?'31日目・最終戦':`${game.day}日目 / 30日`}</strong><span class="pill">${game.gold} G</span></div>${bar('スタミナ',game.stamina,80,'sta')}<div class="aside-divider"></div><div class="statgrid">${Object.entries(STATS).map(([k,v])=>`<div><span class="statlabel">${v}</span><span class="statval">${game.stats[k]}</span></div>`).join('')}</div><div class="aside-divider"></div><div class="split tiny muted"><span>習得 ${game.known.length} / 35</span><span>勝利 ${game.wins}　敗北 ${game.losses}</span></div><div class="foot">現在の能力値は最大値です。戦闘中のHP・MPは別に管理します。<br>各数値・30日制はランナーv12の試験設定です。</div></aside>`}
function btn(action,title,klass='',extra=''){return `<button class="btn ${klass}" data-a="${action}" ${extra}>${title}</button>`;}
function panel(title,body){return `<section class="panel"><h1>${title}</h1>${body}</section>`;}
function shopView(){const items=[{kind:'gear',name:'トレーニング機材',price:32,desc:'今後の訓練で上がる能力がそれぞれ＋1（重複不可）',disable:!!game.gear},{kind:'stamina',name:'スタミナ回復',price:15,desc:'スタミナを＋30（上限80）'},{kind:'stat',name:'能力強化',price:22,desc:'選択した能力を＋3'}];return panel('ショップ',`<p class="muted">5日ごとに開催。買い物は今回1回までです（試験ルール）。</p><div class="tiles">${items.map(it=>`<div class="tile"><strong>${it.name}</strong><p>${it.desc}</p><span class="badge">${it.price} G</span>${it.kind==='stat'?`<label class="tiny">上げる能力 <select id="shopstat">${Object.entries(STATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>`:''}${btn('buy:'+it.kind,'購入','small primary',(game.gold<it.price||game.shopBought||it.disable)?'disabled':'')}</div>`).join('')}</div><div class="buttons">${btn('shopNext','ショップを出る','gold')}</div>`);}
function trainView(){return panel(`${game.day}日目：トレーニング`, `<p class="muted">今日の育成を1つ選んでください。その後に技をセットして戦います。</p>${game.stamina<16?'<div class="notice">スタミナ不足です。訓練を選ぶと失敗します。休養すると回復します。</div>':''}<div class="tiles">${Object.entries(DATA.training).map(([name,gains])=>`<button class="tile selectable" data-a="train:${name}"><strong>${name}</strong><span class="muted tiny">${Object.entries(gains).map(([k,v])=>`${STATS[k]} ＋${v+(game.gear?1:0)}`).join('　/　')}</span><p>スタミナ −13</p></button>`).join('')}<button class="tile selectable" data-a="rest"><strong>休養</strong><span class="muted tiny">スタミナ ＋26（上限80）</span><p>休養した日も戦闘します</p></button></div>`);}
function equipView(){const available=game.known;return panel(`${game.day>=31?'最終戦':'戦闘'}の準備：技セット`,`<p class="muted">習得済みの技から最大4つ。技を押して追加・解除してください。戦闘中の新技は一時的な追加枠です。</p><div class="slots">${Array.from({length:4},(_,i)=>{let id=game.equipped[i];return `<div class="slot ${id?'filled':''}">${id?`<button data-a="slot:${id}" title="解除">${skillName(id)} <span class="tiny muted">×</span></button>`:`<span class="muted">空き枠 ${i+1}</span>`}</div>`}).join('')}</div><div class="tiles">${available.map(id=>`<button class="tile selectable ${selected(id)?'selected':''}" data-a="toggle:${id}" ${!selected(id)&&game.equipped.length===4?'disabled':''}><strong>${skillName(id)} ${selected(id)?'<span class="badge new">セット中</span>':''}</strong><p>${DESCRIPTIONS[id]}</p><span class="tiny">MP ${cost(id)}　${tags(id).join('・')}</span></button>`).join('')}</div><div class="buttons">${btn('equipNext',game.day>=31?'最終ボスに挑む':'敵を選ぶ','primary',game.equipped.length?'':'disabled')}</div>`);}
function enemiesForDay(){const day=game.day;const level=Math.floor((day-1)/5);const kinds=day>=12?['normal','shield','highdef','evasive','aggressive','endurance','caster']:['normal','shield','highdef','evasive','aggressive','caster'];return Array.from({length:3},()=>{const kind=choose(kinds);const hp=kind==='endurance'?230+level*20:90+level*18+(kind==='shield'?10:0);return {kind,hp,hpmax:hp,defense:24+level*4+(kind==='highdef'?26:0),speed:25+level*4+(kind==='evasive'?12:0),attack:27+level*3+(kind==='aggressive'?9:0),accuracy:kind==='endurance'?.76:kind==='evasive'?.78:.82,shield:0,shieldTurns:0,debuff:0,debuffTurns:0,dodge:0,lastDamage:0};});}

function battleView(){const b=game.battle;const e=b.enemy;let options=useOptions();const forced=b.charge;return panel(`${game.day===31?'最終戦':'戦闘'}：${ENEMY_NAMES[e.kind]}`,`<div class="fight"><div class="fighter enemy"><div class="split"><strong>${ENEMY_NAMES[e.kind]}</strong><span class="badge">ターン ${b.turn} / 24</span></div>${bar('敵HP',Math.max(0,e.hp),e.hpmax,'hp')}<div class="tiny muted">攻撃 ${e.attack}　防御 ${e.defense+(e.shield||0)-(e.debuff||0)}　素早さ ${e.speed}</div>${e.shield?'<span class="pill">防御強化中</span>':''}${e.debuff?'<span class="pill">防御低下中</span>':''}</div><div class="fighter"><div class="split"><strong>プレイヤー</strong><span class="badge">技 ${game.equipped.length}＋${b.s.new.length}</span></div>${bar('HP',Math.max(0,b.php),game.stats.hp,'hp')}${bar('MP',b.s.mp,game.stats.mp,'mp')}${b.s.magicPower?'<span class="pill">魔法強化</span>':''}${b.s.magicBarrier?'<span class="pill">魔法障壁</span>':''}</div></div><h2 style="margin-top:17px">使用する技</h2>${forced?`<div class="notice">ため斬りの発動ターンです。MPの追加消費なしで自動的に攻撃します。</div><div class="buttons">${btn('act:T101','ため斬りを放つ','primary')}</div>`:`<div class="skill-grid">${options.length?options.map(id=>`<button class="btn skill ${b.s.new.includes(id)?'new-skill':''}" data-a="act:${id}"><strong>${skillName(id)} ${b.s.new.includes(id)?'<span class="badge new">NEW</span>':''}</strong><small>${DESCRIPTIONS[id]}</small><span class="cost tiny">消費MP ${cost(id)}</span></button>`).join(''):`<button class="btn skill" data-a="act:T000"><strong>弱い攻撃</strong><small>使える技がないときの救済行動</small><span class="cost tiny">消費MP 0</span></button>`}</div>`}<h2 style="margin-top:20px">戦闘ログ</h2><div class="log" id="battlelog">${b.logs.slice(-20).map(l=>`<div><time>${l.turn}T</time>${esc(l.text)}</div>`).join('')}</div><p class="foot">行動を選ぶと両者が素早さに応じて行動します。逃走・アイテム使用はありません。</p>`);}
function resultView(){const r=game.result;const won=r.reason==='win';return panel(r.boss?'最終決戦の結果':'戦闘結果',`<div class="result-num">${won?'勝利':r.reason==='death'?'敗北':'時間切れ'}</div><p class="muted">${ENEMY_NAMES[r.enemy.kind]} / ${r.turn}ターン　${r.boss?'最終戦':'通常戦'}</p><div class="tiles"><div class="tile"><strong>獲得したお金</strong><span>${r.goldGain} G</span></div><div class="tile"><strong>今回発見した技</strong><span>${r.learned.length}技</span></div></div>${r.learned.length?`<div class="banner"><strong>新たに発見</strong><p>${r.learned.map(skillName).join('・')}</p></div>`:''}<p>現在の習得技：${game.known.length}/35　所持金：${game.gold} G</p>${!won?'<div class="notice">敗北・時間切れでも育成は続きます。スタミナが9低下しました。</div>':''}<div class="buttons">${btn(r.boss?'finish':'nextDay',r.boss?'最終結果を見る':'翌日へ進む','primary')}</div>`);}

function bookView(){const knowns=ids().filter(id=>known(id));return `<div class="overlay" role="dialog" aria-modal="true"><div class="modal"><div class="split"><h2>技図鑑 ${knowns.length}/35</h2>${btn('close','閉じる','small')}</div><p class="muted tiny">発見した技のみ名称と習得条件を表示します。条件と個別数値はv12試験設定です。</p>${knowns.map(id=>`<div class="detail"><b>${skillName(id)} <span class="badge">MP ${cost(id)}</span></b><div class="tiny muted">${DESCRIPTIONS[id]}　/　${tags(id).join('・')}</div><div class="tiny">習得条件：${id==='T001'?'初期習得':esc(DATA.conditions[id]||'条件記録なし')}</div></div>`).join('')}<p class="foot">未発見 ${35-knowns.length}技の情報は表示しません。</p></div></div>`;}
function learnView(){return `<div class="overlay" role="dialog" aria-modal="true"><div class="modal"><div class="effect"><div class="eyebrow">TECHNIQUE DISCOVERED</div><h2>新しい技を発見！</h2>${game.learnModal.map(id=>`<p style="font-size:24px;font-weight:800;margin:9px 0">${skillName(id)}</p><p class="tiny">${DESCRIPTIONS[id]}</p>`).join('')}</div><p class="muted">新技は次の自分の行動から使用できます。戦闘終了後は習得済みに残りますが、次の戦闘ではセットが必要です。</p><div class="buttons">${btn('closeLearn','戦闘に戻る','primary')}</div></div></div>`;}
function render(){const title=game.phase==='shop'?shopView():game.phase==='train'?trainView():game.phase==='equip'?equipView():game.phase==='enemy'?enemyView():game.phase==='battle'?battleView():game.phase==='result'?resultView():endView();$('app').innerHTML=`<div class="layout">${header()}<div class="shell">${sidebar()}<main class="main">${game.phase==='end'?'':phSteps()}${title}<div class="foot">技育成 HTMLデモ v1 — Pythonランナーv12を基準とした試作。詳細数値・習得条件は未確定です。</div></main></div></div>${game.modal==='book'?bookView():''}${game.learnModal.length?learnView():''}`;save();const log=$('battlelog');if(log)log.scrollTop=log.scrollHeight;}

function eligibility(id){const b=game.battle;const options=[...new Set([...game.equipped,...b.s.new])], mode=DATA.modes[id];if(mode==='any')return true;if(mode==='individual')return (DATA.parents[id]||[]).some(k=>options.includes(k));if(mode==='tag'){
 if(id==='T024')return options.some(a=>options.some(z=>a!==z&&hasTag(a,'魔法系')&&hasTag(z,'剣技系')));
 if(id==='T015')return options.some(a=>options.some(z=>a!==z&&hasTag(a,'連撃系')&&hasTag(z,'剣技系')));
 return (DATA.requiredTags[id]||[]).every(t=>options.some(k=>hasTag(k,t)));
}return false;}
function addUnique(list,key){if(!list.includes(key))list.push(key);}

 function satisfied(id){const cond={
 T004:cnt(c.kills,'T001')>=2,

 T002:z.defense>=40&&c.defenseHitsQualified>=2,

 T033:maxCount(c.enemyMisses)>=10,

 T032:c.counterBattles.length>=2,
 T026:c.defenseUses>=5&&c.defenseThenHits>=3,
 T012:s.lowHpHitSeq>=2,
 T016:known('T014')&&c.lowhpBattles.length>=1,
 T097:['T017','T104','T089'].every(known)&&s.differentHitSeq>=3,
 T027:z.int>=36&&cnt(hit,'T001')>=3,
 T028:cnt(u,'T027')>=4&&c.magicHits>=3,
 T005:cnt(hit,'T028')>=6&&s.maxFireSeq>=2,

 T057:c.magicSpent>=40&&s.mp<=20&&s.zeroMpAttack,
 T076:s.focusCount>=2,
 T074:c.enemyMagicBattles.length>=2&&z.int>=40,
 T009:known('T004')&&z.int>=36&&z.attack>=36&&cnt(u,'T027')>=4,
 T024:known('T009')&&known('T028')&&s.hitThisBattle.includes('T004')&&s.hitThisBattle.includes('T028'),
 T055:cnt(u,'T005')>=5&&s.maxSpellSeq>=3
 };return !!cond[id];}
 for(let pass=0;pass<3;pass++){let changed=false;for(const id of ids()){if(known(id)||id==='T001'||!eligibility(id)||!satisfied(id))continue;game.known.push(id);game.discovered[id]=game.day;s.new.push(id);game.learnModal.push(id);blog(`新技「${skillName(id)}」を発見！`);changed=true;}if(!changed)break;}
}
function enemyAct(){const b=game.battle,e=b.enemy,s=b.s,c=game.counts;let behavior='attack';
 if(e.kind==='shield'&&e.shield===0&&e.hp>e.hpmax*.32&&rnd()<.62){e.shield=7;e.shieldTurns=2;behavior='shield';blog('敵は防御を強化した。');return 'guard';}
 if(e.kind==='highdef'&&e.shield===0&&e.lastDamage>9&&rnd()<.30){e.shield=4;e.shieldTurns=2;blog('敵は身構えた。');return 'guard';}
 if(e.kind==='evasive'&&e.hp>e.hpmax*.20&&rnd()<.25){e.dodge=1;blog('敵は回避態勢をとった。');return 'guard';}
 if((e.kind==='caster'||e.kind==='boss')&&rnd()<(e.kind==='caster'?.53:.23))behavior='spell';
 else if((e.kind==='aggressive'||e.kind==='boss')&&rnd()<(e.kind==='aggressive'?.40:.18))behavior='heavy';
 let acc=clamp(e.accuracy+Math.min(.12,(e.speed-game.stats.speed)*.0025)-(behavior==='heavy'?.13:0)-(b.evade?.23:0),.40,.94);
 const hit=rnd()<acc;
 let evt;if(!hit){inc(c.enemyMisses,e.kind+'_attack');if(s.latestPlayerGuard)s.seenEvadeDef=true;evt='miss';blog(`敵の${behavior==='spell'?'魔法':behavior==='heavy'?'強攻撃':'攻撃'}は外れた。`);}else{
 let raw=behavior==='spell'?Math.max(1,rint(e.attack*1.05-game.stats.int*.18-game.stats.defense*.07)):
 Math.max(1,rint(e.attack*(behavior==='heavy'?(e.kind==='boss'?1.16:1.32):.88)-game.stats.defense*.28));
 if(behavior==='spell'){if(s.magicBarrier)raw=rint(raw*.45);s.seenEnemyMagic=true;}
 const dmg=Math.max(0,rint(raw*b.guard));b.php-=dmg;s.receivedHits++;s.damageTaken+=dmg;if(game.stats.defense>=40)c.defenseHitsQualified++;if(s.latestPlayerGuard)s.guardReceived++;
 blog(`敵の${behavior==='spell'?'魔法':behavior==='heavy'?'強攻撃':'攻撃'}：${dmg}ダメージ。`);evt='hit';b.guard=1;
 }
 if(b.evade)b.evade--;if(s.magicBarrier)s.magicBarrier--;return evt;
}

 if(force)chosen='T101';if(chosen!=='T000'&&!force&&(!useOptions().includes(chosen)))throw Error('使用できない技が選択されました');
 s.playerActions++;s.phpRatio=b.php/z.hp;

 if(chosen==='T000'){
  if(rnd()<.72){e.hp-=2;s.damage+=2;blog('弱い攻撃：2ダメージ。');}else blog('弱い攻撃は外れた。');

 }

 if(chosen==='T074'){s.magicBarrier=2;s.guardSeq=0;s.spellSeq=0;s.fireSeq=0;s.recentZeroMp=false;blog('魔力障壁：敵の魔法攻撃2回を軽減。');checkLearn();return;}
 if(defSkill){c.defenseUses++;inc(c.uses,chosen);s.guardSeq++;s.maxGuardSeq=Math.max(s.maxGuardSeq,s.guardSeq);s.multiSeq=0;s.differentHitSeq=0;s.recentHit=null;s.prevAttack=null;s.distinctUsed=[];if(chosen==='T002')b.guard=.52;else if(chosen==='T020')b.guard=0;else if(chosen==='T033'){b.evade=Math.max(b.evade,2);b.guard=1;}else{b.guard=.57;b.evade=Math.max(b.evade,2);}blog(`${skillName(chosen)}で身を守る。`);checkLearn();return;}
 s.guardSeq=0;

 if(chosen==='T101'&&!force){inc(c.uses,chosen);c.attackHitStreak=0;s.prevAttack=null;s.multiSeq=0;s.differentHitSeq=0;s.distinctUsed=[];b.charge=true;blog('ため斬り：力をためた。次の自分の行動で発動。');checkLearn();return;}
 if(!force&&!isMagic)inc(c.uses,chosen);
 b.charge=false;
 const [reference,initialMult]=DATA.references[chosen];let mult=initialMult;
 let stat=reference==='mix'?(z.attack+z.speed)/2:reference==='mix_def'?(z.attack*.75+z.defense*.25):reference==='speed'?z.speed:reference==='int'?z.int:reference==='attack_int'?(z.attack+z.int)/2:z.attack;
 if(chosen==='T101')mult=2.55;

 if(b.atkBuff){stat*=1.28;b.atkBuff--;}
 if(b.bonus>1){mult*=b.bonus;b.bonus=1;}
 if(['T012','T016'].includes(chosen))mult*=1+(1-b.php/z.hp);
 if(chosen==='T006'&&first)mult*=1.28;
 if(chosen==='T026'&&evt==='hit')mult*=1.35;

 let accuracy=.86+(z.speed-e.speed)*.0035-(e.kind==='evasive'?.10:0)-(e.dodge?.17:0);
 if(game.stamina<8){accuracy-=.06;mult*=.88;}
 if(['T037','T040','T089'].includes(chosen))accuracy+=.12;
 let guaranteed=['T014','T016'].includes(chosen)||(['T037','T040'].includes(chosen)&&s.prevAttack&&!s.prevAttack[1]);
 accuracy=guaranteed?1:clamp(accuracy,.48,.985);
 const parts=['T011','T015','T055'].includes(chosen)?2:chosen==='T017'?3:1;
 let defense=e.defense+e.shield-e.debuff;
 const pierce=chosen==='T102'?.45:chosen==='T089'?.38:['T009','T024'].includes(chosen)?.35:['T028','T005','T055'].includes(chosen)?.22:0;
 defense*=1-pierce;
 const base=Math.max(1,rint(stat*mult*.88-defense*.36));let damage=0,landed=0;
 for(let i=0;i<parts;i++)if(rnd()<accuracy||guaranteed){landed++;damage+=parts>1?Math.max(1,rint(base*.67)):base;}
 const hit=landed>0;e.dodge=0;
 if(hit){const beforeHP=e.hp;e.hp-=damage;e.lastDamage=damage;s.damage+=damage;s.attackHits++;

 if(s.prevAttack&&!s.prevAttack[1]){let prev=s.prevAttack[0];if(prev===chosen)c.sameCount++;else if(hasTag(prev,'剣技系')&&hasTag(chosen,'剣技系'))c.otherCount++;}

 }else{blog(`${skillName(chosen)}は外れた。`);s.spellSeq=0;s.fireSeq=0;c.attackHitStreak=0;s.multiSeq=0;s.differentHitSeq=0;s.recentHit=null;s.sameSeq={};s.lowHpHitSeq=0;s.distinctUsed=[];}
 s.prevAttack=[chosen,hit];s.recentZeroMp=!isMagic;s.previousPlayerWasGuard=false;checkLearn();

function action(id){const b=game.battle,s=b.s,e=b.enemy;const forced=b.charge;
 if(!forced){if(id==='T000'){if(useOptions().length)return;}else if(!useOptions().includes(id))return;}
 const first=(game.stats.speed+rnd()*5>=e.speed+rnd()*5)||id==='T103';let evt=b.prevEvent;
 if(first){const oldUses=cnt(game.counts.uses,'T006');playerAct(id,true,evt);if(b.turn===1&&s.prevAttack&&s.prevAttack[1]){b.firstStrike=hasTag(s.prevAttack[0],'攻撃系');b.rapidFirst=cnt(game.counts.uses,'T006')>oldUses&&s.prevAttack[0]==='T006';}
 if(e.hp>0){evt=enemyAct();b.prevEvent=evt;}}
 else{evt=enemyAct();b.prevEvent=evt;if(b.php>0)playerAct(id,false,evt);}
 s.previousPlayerWasGuard=s.latestPlayerGuard;
 if(e.shieldTurns){e.shieldTurns--;if(e.shieldTurns===0)e.shield=0;}
 if(e.debuffTurns){e.debuffTurns--;if(e.debuffTurns===0)e.debuff=0;}
 checkLearn();
 if(b.php<=0||e.hp<=0||b.turn>=24){endBattle();return;}
 b.turn++;s.turn=b.turn;render();
}
function endBattle(){const b=game.battle,s=b.s,c=game.counts,e=b.enemy;
 c.firstStrikeSeq=b.firstStrike?c.firstStrikeSeq+1:0;c.firstRapidSeq=b.rapidFirst?c.firstRapidSeq+1:0;
 if(s.seenHighdefHit)addUnique(c.highdefBattles,game.day);
 if(s.seenShieldHit)addUnique(c.shieldBattles,game.day);
 if(s.seenEvadeDef)addUnique(c.evadeDefBattles,game.day);
 if(s.seenCounter)addUnique(c.counterBattles,game.day);
 if(s.seenLowhpT012)addUnique(c.lowhpBattles,game.day);
 if(s.seenEnemyMagic)addUnique(c.enemyMagicBattles,game.day);
 checkLearn();const won=e.hp<=0;const reason=won?'win':b.php<=0?'death':'timeout';let gain=0;
 if(won){game.wins++;if(game.day<=30){gain=11+Math.floor(game.day/7)*2;game.gold+=gain;}}
 else{game.losses++;game.stamina=Math.max(0,game.stamina-9);}
 const r={day:game.day,boss:game.day===31,reason,turn:b.turn,enemy:{kind:e.kind},goldGain:gain,learned:[...s.new],playerHP:b.php,playerMP:s.mp};game.result=r;game.records.push(r);game.battle=null;game.phase='result';render();
}
function interact(a){if(game.learnModal.length&&a!=='closeLearn')return;
 if(a==='closeLearn'){game.learnModal=[];render();return;}
 if(game.modal==='book'&&a!=='close')return;
 if(a==='book'){game.modal='book';render();return;}
 if(a==='close'){game.modal='';render();return;}
 if(a==='reset'){if(confirm('最初から新しい周回を開始しますか？ このデモの保存内容は消去されます。')){game=fresh();render();}return;}
 if(game.phase==='shop'){
  if(a==='shopNext'){setNextPhase('train');return;}
  if(a.startsWith('buy:')&&!game.shopBought){let kind=a.split(':')[1],price=kind==='gear'?32:kind==='stamina'?15:22;if(game.gold<price||(kind==='gear'&&game.gear))return;
   game.gold-=price;game.shopBought=true;
   if(kind==='gear')game.gear=1;else if(kind==='stamina')game.stamina=Math.min(80,game.stamina+30);else {let key=$('shopstat').value;if(!STATS[key])key='attack';game.stats[key]+=3;}
   msg(`${game.day}日目：ショップで${kind==='gear'?'トレーニング機材':kind==='stamina'?'スタミナ回復':'能力強化'}を購入。`);render();return;
  }
 }
 if(game.phase==='train'){
  if(a==='rest'){game.stamina=Math.min(80,game.stamina+26);msg(`${game.day}日目：休養。`);setNextPhase('equip');return;}
  if(a.startsWith('train:')){const name=a.slice(6),tr=DATA.training[name];if(!tr)return;
   if(game.stamina>=16){for(const [k,n] of Object.entries(tr))game.stats[k]+=n+game.gear;game.stamina-=13;inc(game.trainCounts,name);msg(`${game.day}日目：${name}を実施。`);}else msg(`${game.day}日目：${name}はスタミナ不足で失敗。`);
   setNextPhase('equip');return;
  }
 }
 if(game.phase==='equip'){
  if(a.startsWith('toggle:')||a.startsWith('slot:')){const id=a.split(':')[1];if(!known(id))return;const index=game.equipped.indexOf(id);if(index>=0)game.equipped.splice(index,1);else if(game.equipped.length<4)game.equipped.push(id);render();return;}
  if(a==='equipNext'&&game.equipped.length){if(game.day===31)startBattle(enemyForBoss());else{game.enemyChoices=enemiesForDay();setNextPhase('enemy');}return;}
 }
 if(game.phase==='enemy'&&a.startsWith('enemy:')){const i=Number(a.split(':')[1]);if(game.enemyChoices[i])startBattle(structuredClone(game.enemyChoices[i]));return;}
 if(game.phase==='battle'&&a.startsWith('act:')){action(a.slice(4));return;}
 if(game.phase==='result'){if(a==='finish'&&game.day===31){setNextPhase('end');return;}if(a==='nextDay'&&game.day<=30){newDay();return;}}
}
