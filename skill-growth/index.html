function hintProgress(id){
 const c=game.counts,z=game.stats,u=c.uses,h=c.hits;
 const f=(n,d)=>Math.min(1,Math.max(0,n/d));
 const has=k=>known(k)?1:0;

 T004:f(cnt(h,'T001'),4),T013:(f(z.attack-30,12)+f(cnt(c.hitsTag,'攻撃系'),5))/2,
 T101:Math.max(f(cnt(u,'T004'),6),f(cnt(u,'T013'),6)),
 T102:f(c.highdefHits,3),T104:f(cnt(u,'T101'),5),
 T105:f(c.shieldHits,3),T011:f(cnt(u,'T001'),8),T015:f(cnt(u,'T011'),5),
 T017:(f(cnt(u,'T011'),10)+has('T015')+f(cnt(c.kills,'連撃系'),3))/3,
 T014:f(Object.entries(h).filter(([k])=>hasTag(k,'攻撃系')&&!['T014','T016'].includes(k)).reduce((a,[,n])=>a+n,0),15),
 T037:.1,T040:f(c.otherCount,2),
 T089:(has('T037')+has('T040')+f(c.criticalKills,1))/3,
 T006:f(c.firstStrikeSeq,3),T103:(f(cnt(u,'T006'),8)+f(c.firstRapidSeq,3))/2,
 T002:(f(z.defense-30,10)+f(c.defenseHitsQualified,2))/2,
 T020:f(cnt(u,'T002'),6),T033:f(maxCount(c.enemyMisses),5),
 T046:f(c.evadeDefBattles.length,2),T032:f(c.counterBattles.length,2),
 T026:(f(c.defenseUses,5)+f(c.defenseThenHits,2))/2,
 T012:f(c.lowhpBattles.length,1)*.7,T016:(has('T014')+f(cnt(u,'T012'),1))/2,
 T097:(has('T017')+has('T104')+has('T089'))/3,
 T027:(f(z.int-30,6)+f(cnt(h,'T001'),3))/2,
 T028:f(cnt(u,'T027'),4),T005:f(cnt(h,'T028'),6),
 T003:f(cnt(u,'T027'),2),T057:f(c.magicSpent,40),
 T076:f(c.magicHits,3),T074:(f(c.enemyMagicBattles.length,2)+f(z.int-30,10))/2,
 T009:(has('T004')+f(z.int-30,6)+f(z.attack-30,6)+f(cnt(u,'T027'),4))/4,
 T024:(has('T009')+has('T028'))/2,T055:f(cnt(u,'T005'),5)
 };return q[id]||0;
}
function nextHint(){
 if(game.day===1||!game.records.length||game.records.at(-1).learned.length)return null;
 const candidates=ids().filter(id=>id!=='T001'&&!known(id)&&
  (DATA.parents[id]||[]).some(p=>known(p)));
 if(!candidates.length)return null;
 // 技の到達度を優先。僅差の場合は前日と同じ技ばかりにならないようにする。
 candidates.sort((a,b)=>{
  const sa=hintProgress(a)-(a===game.lastHintId?.012:0),sb=hintProgress(b)-(b===game.lastHintId?.012:0);
  return sb-sa||a.localeCompare(b);
 });
 const id=candidates[0];return {id,text:HINTS[id]?.[1]||DATA.conditions[id]||'習得した技を組み合わせて戦ってみよう。'};
}
function prepareHint(){
 if(game.hintDay===game.day)return;
 const found=nextHint();game.hintDay=game.day;game.hint=found?.text||null;

 };

 if(e.debuffTurns){e.debuffTurns--;if(e.debuffTurns===0)e.debuff=0;}
  if(e.slowTurns){e.slowTurns--;if(e.slowTurns===0)e.speed=e.speedOriginal||e.speed;}
 if(b.php<=0||e.hp<=0||b.turn>=24){endBattle();return;}
 b.turn++;s.turn=b.turn;
 refreshCandidates();
 render();
}
function endBattle(){const b=game.battle,s=b.s,c=game.counts,e=b.enemy;
 c.firstStrikeSeq=b.firstStrike?c.firstStrikeSeq+1:0;c.firstRapidSeq=b.rapidFirst?c.firstRapidSeq+1:0;
 if(s.seenHighdefHit)addUnique(c.highdefBattles,game.day);
 if(s.seenShieldHit)addUnique(c.shieldBattles,game.day);
 if(s.seenEvadeDef)addUnique(c.evadeDefBattles,game.day);
 if(s.seenCounter)addUnique(c.counterBattles,game.day);
 if(s.seenLowhpT012)addUnique(c.lowhpBattles,game.day);
 if(s.seenEnemyMagic)addUnique(c.enemyMagicBattles,game.day);
 const late=refreshCandidates(true);
 const delayed=['T004','T028','T089','T006','T103','T046','T032','T074','T029','T030','T034','T061','T082','T095'];
 game.carryCandidates=b.php>0&&game.day<31?[...new Set([...(s.pending||[]),...late])].filter(k=>delayed.includes(k)&&!known(k)):[];
 const won=e.hp<=0;const reason=won?'win':b.php<=0?'death':'timeout';let gain=0;
 if(won){game.wins++;if(game.day<=30){gain=11+Math.floor(game.day/7)*2;game.gold+=gain;}}
 else{game.losses++;game.stamina=Math.max(0,game.stamina-9);}
 const r={day:game.day,boss:game.day===31,reason,turn:b.turn,enemy:{kind:e.kind},goldGain:gain,learned:[...s.new],playerHP:b.php,playerMP:s.mp};game.result=r;game.records.push(r);game.battle=null;game.phase='result';render();
}
function interact(a){if(game.learnModal.length&&a!=='closeLearn')return;
 if(a==='closeLearn'){game.learnModal=[];render();return;}
 if(['book','help','inspect'].includes(game.modal)&&a!=='close'&&!a.startsWith('filter:'))return;
 if(a.startsWith('filter:')){const [_,target,id]=a.split(':');if(CATEGORY_OPTIONS.some(([x])=>x===id)){if(target==='equip'&&game.phase==='equip')ui.equipFilter=id;else if(target==='book'&&game.modal==='book')ui.bookFilter=id;}render();return;}
 if(a==='guide'){game.modal='help';render();return;}
 if(a.startsWith('inspect:')&&game.phase==='equip'){ui.inspected=a.slice(8);game.modal='inspect';render();return;}
 if(a==='book'){game.modal='book';render();return;}
 if(a==='close'){game.modal='';ui.inspected=null;render();return;}
 if(a==='reset'){if(confirm('最初から新しい周回を開始しますか？ 現在の育成状況を初期化します（発見済みの技図鑑は引き継ぎます）。')){game=fresh();render();}return;}
 if(game.phase==='shop'){
  if(a==='shopNext'){setNextPhase('train');return;}
  if(a.startsWith('buy:')&&!game.shopBought){let kind=a.split(':')[1],price=kind==='gear'?32:kind==='stamina'?15:22;if(game.gold<price||(kind==='gear'&&game.gear))return;
   game.gold-=price;game.shopBought=true;
   if(kind==='gear')game.gear=1;else if(kind==='stamina')game.stamina=Math.min(80,game.stamina+30);else {let key=$('shopstat').value;if(!STATS[key])key='attack';game.stats[key]+=3;}
   msg(`${game.day}日目：ショップで${kind==='gear'?'トレーニング機材':kind==='stamina'?'スタミナ回復':'能力強化'}を購入。`);render();return;
  }
 }
 if(game.phase==='train'){
  if(a==='rest'){game.stamina=Math.min(80,game.stamina+26);msg(`${game.day}日目：休養。`);setNextPhase('equip');return;}
  if(a.startsWith('train:')){const name=a.slice(6),tr=DATA.training[name];if(!tr)return;
   if(game.stamina>=16){for(const [k,n] of Object.entries(tr))game.stats[k]+=n+game.gear;game.stamina-=13;inc(game.trainCounts,name);msg(`${game.day}日目：${name}を実施。`);}else msg(`${game.day}日目：${name}はスタミナ不足で失敗。`);
   setNextPhase('equip');return;
  }
 }
 if(game.phase==='equip'){
  if(a.startsWith('toggle:')||a.startsWith('slot:')){const id=a.split(':')[1];if(!known(id))return;const index=game.equipped.indexOf(id);if(index>=0)game.equipped.splice(index,1);else if(game.equipped.length<4)game.equipped.push(id);render();return;}
  if(a==='equipNext'&&game.equipped.length){if(game.day===31)startBattle(enemyForBoss());else{game.enemyChoices=enemiesForDay();setNextPhase('enemy');}return;}
 }
 if(game.phase==='enemy'&&a.startsWith('enemy:')){const i=Number(a.split(':')[1]);if(game.enemyChoices[i])startBattle(structuredClone(game.enemyChoices[i]));return;}
 if(game.phase==='battle'&&a.startsWith('act:')){action(a.slice(4));return;}
 if(game.phase==='result'){if(a==='finish'&&game.day===31){setNextPhase('end');return;}if(a==='nextDay'&&game.day<=30){newDay();return;}}
}
document.addEventListener('click',e=>{const target=e.target.closest('[data-a]');if(target&&!target.disabled)try{interact(target.dataset.a)}catch(error){console.error(error);alert('処理に問題が発生しました。保存済み状態を確認してください。');}});
load();render();
</script></body></html>
